<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; margin: 0; padding-bottom: 100px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .question-block { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .question-text { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .options { list-style-type: none; padding: 0; }
        .options li { margin-bottom: 10px; }
        .options label { display: block; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        .options label:hover { background: #eef2f5; }
        .options input[type="radio"] { margin-right: 10px; cursor: pointer; }
        .explanation { display: none; margin-top: 15px; padding: 15px; background-color: #e8f4f8; border-left: 4px solid #3498db; border-radius: 4px; font-size: 0.95em; }
        .correct-answer-label { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; font-weight: bold; }
        .wrong-answer-label { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            padding: 15px 20px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
            border-top: 3px solid #3498db;
        }
        .stats {
            font-size: 1.1em;
            color: #2c3e50;
        }
        .stats span { font-weight: bold; color: #e74c3c; font-size: 1.2em; margin-left: 5px; }
        .stats b { color: #2980b9; margin-left: 5px; font-size: 1.1em; }
        
        .global-check-btn {
            padding: 12px 30px;
            font-size: 1.1em;
            background-color: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.3);
        }
        .global-check-btn:hover { background-color: #27ae60; transform: translateY(-1px); }
        .global-check-btn:active { transform: translateY(1px); }
        .reset-btn {
            padding: 12px 20px;
            font-size: 1.1em;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.3);
        }
        .reset-btn:hover { background-color: #c0392b; transform: translateY(-1px); }
        .reset-btn:active { transform: translateY(1px); }
        
        @media (max-width: 600px) {
            .sticky-footer { flex-direction: column; gap: 10px; padding: 10px; }
            .global-check-btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bài Kiểm Tra: Transitions</h1>
    <p style="text-align: center; color: #7f8c8d;">Bạn có thể chọn 1 hoặc nhiều câu, sau đó bấm <strong>"Kiểm tra"</strong> ở thanh dưới cùng để xem kết quả ngay nhé!</p>
    <div id="quiz"></div>
</div>

<div class="sticky-footer">

        Tiến độ:<b id="progressText">0/0</b> &nbsp;&nbsp;|&nbsp;&nbsp; 
        Điểm số:<span id="scoreText">0</span>

    <div style="display: flex; gap: 10px;">
        <button class="reset-btn" id="resetBtn">🔄 Làm lại từ đầu</button>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBWAaxOqQHJQTFjp2hxkWwDCSvagb6KvSg",
        authDomain: "saturnifyllm.firebaseapp.com",
        projectId: "saturnifyllm",
        storageBucket: "saturnifyllm.firebasestorage.app",
        messagingSenderId: "679587062435",
        appId: "1:679587062435:web:f10555b0cbbdb9fb89d516",
        measurementId: "G-YV0NEJKNNH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function saveScoreToFirebase(score, total) {
        const studentName = sessionStorage.getItem('studentName') || "Học sinh ẩn danh";
        const studentId = sessionStorage.getItem('studentId') || "N/A";
        const quizName = document.title;

        try {
            await addDoc(collection(db, "results"), {
                name: studentName,
                id: studentId,
                quizTitle: quizName,
                score: score,
                total: total,
                timestamp: new Date()
            });
            console.log("Đã lưu điểm thành công lên Firebase!");
        } catch (error) {
            console.error("Lỗi khi lưu điểm lên Firebase: ", error);
        }
    }
    const quizData = [{"id": 1, "question": "Samuel Coleridge-Taylor was a prominent classical music composer from England who toured the  US three times in the early 1900s. The child of a West African father and an English mother, Coleridge- Taylor emphasized his mixed-race ancestry. For example, he referred to himself as Anglo- African. ______ he incorporated the sounds of traditional African music into his classical music  compositions.  Which choice completes the text with the most logical transition?", "options": {"A": "In addition,", "B": "Actually,", "C": "However,", "D": "Regardless,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “In addition” logically signals that the detail in this sentence—that  Coleridge-Taylor included traditional African music in his classical compositions—adds to the  information in the previous sentence. Specifically, the previous sentence indicates one way in which  Coleridge-Taylor emphasized his mixed-race ancestry, and the claim that follows indicates a second,  additional way.  Choice B is incorrect because “actually” illogically signals that the detail in this sentence is surprising in  light of the information in the previous sentence. Instead, the detail adds to the information, indicating a  second, additional way in which Coleridge-Taylor emphasized his mixed-race ancestry. Choice C is  incorrect because “however” illogically signals that the detail in this sentence contrasts with the  information in the previous sentence. Instead, the detail adds to the information, indicating a second,  additional way in which Coleridge-Taylor emphasized his mixed-race ancestry. Choice D is incorrect  because “regardless” illogically signals that the detail in this sentence is true despite the information in  the previous sentence. Instead, the detail adds to the information, indicating a second, additional way in  which Coleridge-Taylor emphasized his mixed-race ancestry."}, {"id": 2, "question": "In her poetry collection Thomas and Beulah, Rita Dove interweaves the titular characters’ personal  stories with broader historical narratives. She places Thomas’s journey from the American South to the  Midwest in the early 1900s within the larger context of the Great Migration. ______Dove sets events  from Beulah’s personal life against the backdrop of the US Civil Rights Movement.  Which choice completes the text with the most logical transition?", "options": {"A": "Specifically,", "B": "Thus,", "C": "Regardless,", "D": "Similarly,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “Similarly” logically signals that the information in the sentence—that  Dove situates Beulah’s life in the context of the US Civil Rights Movement—is similar to the previous  information about Thomas and the Great Migration. Both sentences support the first sentence’s claim  that Dove portrays her characters in the context of broader historical narratives.     Choice A is incorrect because “specifically” illogically signals that the information about Beulah in this  sentence provides specific details elaborating on the previous information about Thomas. Instead, it’s  similar to the previous information about Thomas. Choice B is incorrect because “thus” illogically  signals that the information about Beulah in this sentence is a result or consequence of the previous  information about Thomas. Instead, it’s similar to the previous information about Thomas. Choice C is  incorrect because “regardless” illogically signals that the information about Beulah in this sentence is  true despite the previous information about Thomas. Instead, it’s similar to the previous information  about Thomas."}, {"id": 3, "question": "In a heated debate in biogeography, the field is divided between dispersalists and  vicariancists. ______ there are those who argue that dispersal is the most crucial determining factor in a  species’ distribution, and those who insist that vicariance (separation due to geographic barriers) is.  Biogeographer Isabel Sanmartín counts herself among neither.  Which choice completes the text with the most logical transition?", "options": {"A": "Furthermore,", "B": "By contrast,", "C": "Similarly,", "D": "That is,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “That is” logically signals that this sentence clarifies the terms of the  scientific debate introduced in the previous sentence by explaining the difference between dispersalists  and vicariancists.    Choice A is incorrect because “furthermore” illogically signals that the information in this sentence is  merely additional to (and separate from) the information in the previous sentence about the scientific  debate. Instead, the information about dispersalists and vicariancists clarifies the terms of that debate.  Choice B is incorrect because “by contrast” illogically signals that the information in this sentence  contrasts with the information in the previous sentence about the scientific debate. Instead, the  information about dispersalists and vicariancists clarifies the terms of that debate. Choice C is incorrect  because “similarly” illogically signals that the information in this sentence is merely similar to the  information in the previous sentence about the scientific debate. Instead, the information about  dispersalists and vicariancists clarifies the terms of that debate."}, {"id": 4, "question": "Most of the planets that have been discovered outside our solar system orbit G-type stars, like our  Sun. In 2014, ______ researchers identified a planet orbiting KELT-9, a B-type star more than twice as  massive and nearly twice as hot as the Sun. Called KELT-9b, it is one of the hottest planets ever  discovered.  Which choice completes the text with the most logical transition?", "options": {"A": "likewise,", "B": "however,", "C": "therefore,", "D": "for example,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. The word “however” logically signals that the information in this sentence  about the planet KELT-9b—that it orbits a B-type star—contrasts with the previous information about  planets discovered outside our solar system. Most of these planets orbit G-type stars, not B-type stars.    Choice A is incorrect because “likewise” illogically signals that the information about the planet KELT- 9b is similar to the previous information about most planets outside our solar system. Instead, it  contrasts with that information. Choice C is incorrect because “therefore” illogically signals that the  information about the planet KELT-9b is a result of the previous information about most planets outside  our solar system. Instead, it contrasts with that information. Choice D is incorrect because “for example”  illogically signals that the information about the planet KELT-9b is an example of the previous  information about most planets outside our solar system. Instead, it contrasts with that information."}, {"id": 5, "question": "In 1815, while in exile in Jamaica, Venezuelan revolutionary Simón Bolívar penned a letter praising  England’s republican government and expressing hope that Latin American nations seeking  independence from Spain might achieve something similar. The letter was addressed to a local merchant,  Henry Cullen; ______ though, Bolívar’s goal was to persuade political leaders from England and Europe  to support his cause.  Which choice completes the text with the most logical transition?", "options": {"A": "additionally,", "B": "ultimately,", "C": "accordingly,", "D": "consequently,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “Ultimately” means “in the long run” or “at the highest level.” Although  Bolívar wrote to a local merchant, his ultimate goal was to send a message to political leaders in Europe.  Therefore, “ultimately” fits perfectly in this context.    Choice A is incorrect. This choice uses a transition that indicates the addition of an agreeing idea.  However, the second part of the sentence actually disagrees with the first part. Bolívar addressed the  letter to Cullen, but he was really sending a message to someone else. Notice how the contrast word  “though” also acts as a transition between these ideas. Choice C is incorrect. This choice uses a cause- and-effect transition. Bolívar’s writing of the letter to Cullen would not cause him to have a goal of  persuading European powers to support him. Choice D is incorrect. This choice uses a cause-and-effect  transition. Bolívar’s writing of the letter to Cullen would not cause him to have a goal of persuading  European powers to support him."}, {"id": 6, "question": "The Babylonian king Hammurabi achieved much during his forty-year reign. He conquered all of  Mesopotamia and built Babylon into one of the most powerful cities of the ancient world.  Today, ______ he is mainly remembered for a code of laws inscribed on a seven-foot-tall block of stone:  the Code of Hammurabi.  Which choice completes the text with the most logical transition?", "options": {"A": "therefore,", "B": "likewise,", "C": "however,", "D": "for instance,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “However” logically signals that the information in this sentence—that  Hammurabi is mainly remembered for just a single achievement, the Code of Hammurabi—is contrary  to what might be assumed from the previous information about Hammurabi’s many achievements.     Choice A is incorrect because “therefore” illogically signals that the information in this sentence is a  result of the previous information about Hammurabi’s many achievements. Instead, this sentence makes  a point that is contrary to what might be assumed from the previous information. Choice B is incorrect  because “likewise” illogically signals that the information in this sentence is similar to the previous  information about Hammurabi’s many achievements. Instead, this sentence makes a point that is  contrary to what might be assumed from the previous information. Choice D is incorrect because “for  instance” illogically signals that this sentence exemplifies the previous information about Hammurabi’s  many achievements. Instead, this sentence makes a point that is contrary to what might be assumed from  the previous information."}, {"id": 7, "question": "Some members of the US Supreme Court have resisted calls to televise the court’s oral arguments,  concerned that the participants would be tempted to perform for the cameras (and thus lower the quality  of the discourse). ______ the justices worry that most viewers would not even watch the full  deliberations, only short clips that could be misinterpreted and mischaracterized.  Which choice completes the text with the most logical transition?", "options": {"A": "However,", "B": "Additionally,", "C": "In comparison,", "D": "For example,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “Additionally” logically signals that the claim in this sentence—that some  Supreme Court justices worry that viewers (of televised court arguments) would watch only short,  misleading clips—adds to the information in the previous sentence. Specifically, the previous sentence  indicates one concern raised by those opposed to televising the court’s oral arguments, and the claim that  follows indicates a second, additional concern.  Choice A is incorrect because “however” illogically signals that the claim in this sentence contrasts with  the information in the previous sentence. Instead, the claim adds to the information, indicating a second,  additional concern that some Supreme Court justices have about televising the court’s arguments.  Choice C is incorrect because “in comparison” illogically signals that the claim in this sentence is being  compared to the information in the previous sentence. Instead, the claim adds to the information,  indicating a second, additional concern that some Supreme Court justices have about televising the  court’s arguments. Choice D is incorrect because “for example” illogically signals that the claim in this  sentence exemplifies the information in the previous sentence. Instead, the claim adds to the  information, indicating a second, additional concern that some Supreme Court justices have about  televising the court’s arguments."}, {"id": 8, "question": "Award-winning travel writer Linda Watanabe McFerrin considers the background research she  conducts on destinations featured in her travel books to be its own reward. ______ McFerrin admits to  finding the research phase of her work just as fascinating and engaging as exploring a location in person.  Which choice completes the text with the most logical transition?", "options": {"A": "By contrast,", "B": "Likewise,", "C": "Besides,", "D": "In fact,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “In fact” logically signals that the information in this sentence—that  McFerrin finds the research phase of her work to be just as fascinating as travel—emphasizes and  elaborates on the previous sentence’s point that McFerrin regards background research as a rewarding  activity.    Choice A is incorrect because “by contrast” illogically signals that the information in this sentence  contrasts with the previous sentence’s point about McFerrin’s attitude toward background research.  Instead, it emphasizes and elaborates on that point. Choice B is incorrect because “likewise” illogically  signals that this sentence merely adds a second, similar point to the previous sentence’s point about  McFerrin’s attitude toward background research. Instead, it emphasizes and elaborates on that point.  Choice C is incorrect because “besides” illogically signals that this sentence provides a separate point in  addition to, or apart from, the previous sentence’s point about McFerrin’s attitude toward background  research. Instead, it emphasizes and elaborates on that point."}, {"id": 9, "question": "In 1873, Spanish scientist Santiago Ramón y Cajal observed that brain fibers have distinct  boundaries with clear end points, a finding that went against earlier assumptions about the  brain. ______ scientists had assumed that the brain was a continuous web of fused fibers, not a vast  network of distinct, individual cells.   Which choice completes the text with the most logical transition?", "options": {"A": "However,", "B": "Previously,", "C": "As a result,", "D": "Likewise,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “Previously” logically signals that the fused fiber theory came before  Ramón y Cajal’s discovery.    Choice A is incorrect. “However” illogically signals that the fused fiber theory in this sentence contrasts  with the information in the previous sentence. While this theory does contrast with Ramón y Cajal’s  discovery, the previous sentence concludes by stating that his discovery went against prior assumptions  about the brain. The fact that the fused fiber theory was one of those earlier assumptions makes  “however” an illogical choice. Choice C is incorrect because “as a result” illogically signals that the  fused fiber theory in this sentence was a result of the discovery in the previous sentence. Instead, the  fused fiber theory came before Ramón y Cajal’s discovery. Choice D is incorrect because “likewise”  illogically signals that the fused fiber theory in this sentence was similar to the discovery in the previous  sentence. Instead, the fused fiber theory, which came before Ramón y Cajal’s discovery, was very  different from it."}, {"id": 10, "question": "For years, biologists have experimented with using grime-eating bacteria rather than harsh  chemicals to clean artworks, and results have been impressive overall. ______ these bacterial strains— which can metabolize centuries’ worth of oil, glue, dirt, and other surface impurities without creating  harmful byproducts—have proven more effective than traditional chemical cleaning methods.  Which choice completes the text with the most logical transition?", "options": {"A": "However,", "B": "In many cases,", "C": "As a result,", "D": "Additionally,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. The first sentence makes the claim that using grime-eating bacteria has led  to “impressive results.” This sentence supports that claim by describing the specific findings of the  biologists’ experimentation. The transition “in many cases” fits the context perfectly.    Choice A is incorrect. This choice uses a disagreement transition. But this sentence actually agrees with  the previous sentence. Both claim that grime-eating bacteria are better at cleaning artworks than  chemicals. Choice C is incorrect. This choice uses a cause-and-effect transition, which doesn’t make  sense in context. The fact that the results of the experimentation have been impressive overall doesn’t  cause the bacteria to have proven more effective. Choice D is incorrect. This choice uses a transition that  indicates the addition of a new idea. But this sentence doesn’t introduce a new idea. Instead, it elaborates  on the same idea laid out in the previous sentence by describing the “impressive results” in more detail."}, {"id": 11, "question": "In 1968, US Congressman John Conyers introduced a bill to establish a national holiday in honor of  Dr. Martin Luther King Jr. The bill didn’t make it to a vote, but Conyers was determined. He teamed up  with Shirley Chisholm, the first Black woman to be elected to Congress, and they resubmitted the bill  every session for the next fifteen years. ______ in 1983, the bill passed.  Which choice completes the text with the most logical transition?", "options": {"A": "Instead,", "B": "Likewise,", "C": "Finally,", "D": "Additionally,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Finally” logically signals that the bill passing—following many attempts  between 1968 and 1983—is the final, concluding event in the sequence described in the previous  sentences.   Choice A is incorrect because “instead” illogically signals that the bill passing is an alternative to one of  the events described in the previous sentences. Instead, it is the final event in the sequence. Choice B is  incorrect because “likewise” illogically signals that the bill passing is similar to one of the events  described in the previous sentences. Instead, it is the final event in the sequence. Choice D is incorrect  because “additionally” illogically signals that the bill passing is merely another event described along  with the events of the previous sentences. Instead, it is the final, concluding event in the sequence."}, {"id": 12, "question": "It has long been thought that humans first crossed a land bridge into the Americas approximately  13,000 years ago. ______ based on radiocarbon dating of samples uncovered in Mexico, a research team  recently suggested that humans may have arrived more than 30,000 years ago—much earlier than  previously thought.  Which choice completes the text with the most logical transition?", "options": {"A": "As a result,", "B": "Similarly,", "C": "However,", "D": "In conclusion,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “However” logically signals that the theory discussed in this sentence—that  humans may have arrived in the Americas over 30,000 years ago—contrasts with the previously  discussed theory that humans arrived around 13,000 years ago.  Choice A is incorrect because “as a result” illogically signals that the theory in this sentence is the result  of the theory discussed in the previous sentence. Instead, this theory contrasts with the previous one.  Choice B is incorrect because “similarly” illogically signals that the theory in this sentence is similar to  the theory discussed in the previous sentence. Instead, this theory contrasts with the previous one.  Choice D is incorrect because “in conclusion” illogically signals that the theory in this sentence  concludes or summarizes the discussion of the previous theory. Instead, this theory contrasts with the  previous one."}, {"id": 13, "question": "Researchers believe that pieces of hull found off Oregon’s coast are from a Spanish cargo ship that  was lost in 1697. Stories passed down among the area’s Confederated Tribes of Siletz Indians support  this belief. ______ Siletz stories describe how blocks of beeswax, an item the ship had been carrying,  began washing ashore after the ship was lost.   Which choice completes the text with the most logical transition?", "options": {"A": "For this reason,", "B": "For example,", "C": "However,", "D": "Likewise,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “For example” logically signals that the Siletz beeswax stories mentioned  in this sentence are examples consistent with the previous claim that Siletz stories support the shipwreck  theory.  Choice A is incorrect because “for this reason” illogically signals that the Siletz stories about the  beeswax were caused by the previous claim that Siletz stories support the shipwreck theory. Instead, the  beeswax stories are examples consistent with the claim. Choice C is incorrect because “however”  illogically signals that the Siletz stories about the beeswax contrast with the previous claim that Siletz  stories support the shipwreck theory. Instead, the beeswax stories are examples consistent with the  claim. Choice D is incorrect because “likewise” illogically signals that the Siletz stories about the  beeswax are similar to the previous claim that Siletz stories support the shipwreck theory. Instead, the  beeswax stories are examples consistent with the claim."}, {"id": 14, "question": "Alexander Lawrence Posey (1873–1908) varied his focus and tone depending on the genre in which  he was writing. In his poetry, he used heartfelt language to evoke the beauty and peacefulness of his  natural surroundings; in his journalism, ______ he employed humor and satire to comment on political  issues affecting his Muskogee Creek community.  Which choice completes the text with the most logical transition?", "options": {"A": "that is,", "B": "granted,", "C": "similarly,", "D": "by contrast,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. This sentence compares two examples of Posey’s tone: the “heartfelt  language” he used in his poetry versus the “humor and satire” he used in his journalism. We know from  these descriptions and from the claim in the previous sentence that the two tones are very different from  each other. So the transition “by contrast” fits the context perfectly.    Choice A is incorrect. This choice uses a transition that indicates a restatement of the same idea in other  words. But the text isn’t restating the first example here. Instead, it’s offering a second, totally different  example. Choice B is incorrect. This choice uses a transition that means “admittedly.” But the text isn’t  admitting or conceding anything here. Instead, these two examples work together to support the claim  made in the first sentence. Choice C is incorrect. This choice uses a transition that indicates the addition  of an agreeing idea. But these two examples are intentionally very different from each other, so  “similarly” doesn’t make sense here."}, {"id": 15, "question": "Geoscientists have long considered Hawaii’s Mauna Loa volcano to be Earth’s largest shield  volcano by volume, measuring approximately 74,000 cubic kilometers. _____ according to a 2020 study  by local geoscientist Michael Garcia, Hawaii’s Pūhāhonu shield volcano is significantly larger, boasting  a volume of about 148,000 cubic kilometers.  Which choice completes the text with the most logical transition?", "options": {"A": "Secondly,", "B": "Consequently,", "C": "Moreover,", "D": "However,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “However” logically signals that this sentence, which indicates that the  Pūhāhonu volcano may be larger than the Mauna Loa volcano, offers a contrast to or refutation of the  previous assumption that Mauna Loa is the largest shield volcano.    Choice A is incorrect because “secondly” illogically signals that this sentence merely offers an  additional or secondary point concerning the previous assumption that Mauna Loa is the largest shield  volcano. Instead, the sentence offers a contrast to or refutation of that assumption. Choice B is incorrect  because “consequently” illogically signals that this sentence offers a result or consequence of the  previous assumption that Mauna Loa is the largest shield volcano. Instead, the sentence offers a contrast  to or refutation of that assumption. Choice C is incorrect because “moreover” illogically signals that this  sentence merely adds to the previous assumption that Mauna Loa is the largest shield volcano. Instead,  the sentence offers a contrast to or refutation of that assumption."}, {"id": 16, "question": "Okot p’Bitek’s poem Song of Lawino (1966) explores postcolonial Ugandan life through the eyes of  a woman living in a rural village. With its vibrant imagery, bitingly satiric tone, and dexterous use of  traditional Acholi song and phraseology, the poem inspired a generation of East African  writers. ______ those who adopted its style are often referred to as Okot School poets.    Which choice completes the text with the most logical transition?", "options": {"A": "Nevertheless,", "B": "Fittingly,", "C": "By comparison,", "D": "Instead,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “Fittingly” is a transition that means “appropriately” or “suitably,” and it is  appropriate that writers who adopted their style from Okot p’Bitek would be known as the Okot School  poets.    Choice A is incorrect. This choice uses a disagreement transition. But this sentence is not disagreeing  with anything—rather, it’s discussing how it makes sense for those writers who adopted Okot’s style to  be known as the Okot School poets. Choice C is incorrect. This choice uses a transition that compares  two ideas. But this sentence is not comparing the Okot School poets and their style to Okot’s style.  Choice D is incorrect. This choice uses a disagreement transition. But this sentence is not disagreeing  with anything—rather, it’s discussing how it makes sense for those writers who adopted Okot’s style to  be known as the Okot School poets."}, {"id": 17, "question": "Before the 1847 introduction of the US postage stamp, the cost of postage was usually paid by the  recipient of a letter rather than the sender, and recipients were not always able or willing to pay  promptly. ______ collecting this fee could be slow and arduous, and heaps of unpaid-for, undeliverable  mail piled up in post offices.  Which choice completes the text with the most logical transition?", "options": {"A": "Regardless,", "B": "On the contrary,", "C": "Consequently,", "D": "For example,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Consequently” logically signals that the postal problems described in this  sentence (slow fee collection, heaps of undeliverable mail) were a consequence of the fee system  described in the previous sentence.    Choice A is incorrect because “regardless” illogically signals that the postal problems described in this  sentence occurred despite the fee system described in the previous sentence. Instead, they were a  consequence of that system. Choice B is incorrect because “on the contrary” illogically signals that the  postal problems described in this sentence contrast with the fee system described in the previous  sentence. Instead, they were a consequence of that system. Choice D is incorrect because “for example”  illogically signals that the postal problems described in this sentence are an example of the fee system  described in the previous sentence. Instead, they were a consequence of that system."}, {"id": 18, "question": "A potter choosing which type of clay to use for a piece considers two key factors: the desired look  of the piece and its intended use. ______ earthenware clay is often used for decorative pieces because of  its rustic look. This type of clay is not often used in industrial settings, though, because it is less durable  than other clays.  Which choice completes the text with the most logical transition?", "options": {"A": "In other words,", "B": "Regardless,", "C": "In conclusion,", "D": "For example,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. The previous sentence tells us that potters think about the look and use of a  piece when selecting clay. This sentence provides a specific example of a type of clay selected for its  appearance, so the transition \"for example\" fits perfectly.    Choice A is incorrect. This choice uses a transition that indicates a restatement of the same idea. But this  sentence does more than just restate the previous idea. Instead, it provides a more specific example of  the idea presented in the first sentence. Choice B is incorrect. This choice uses a disagreement transition.  But this sentence actually agrees with the previous sentence. Both sentences suggest that desired look  plays a role in the selection of clay types for pottery pieces. Choice C is incorrect. This choice uses a  concluding transition. But this sentence doesn’t sum up the previous sentence. Instead, it gives a specific  example of the idea presented in the previous sentence."}, {"id": 19, "question": "In Gothic architecture, flying buttresses are large arches that help support a building’s exterior  walls. Before the Gothic era, cathedrals’ heavy ceilings had to be supported by thick, short walls, but the  invention of flying buttresses eliminated this need. ______ Gothic cathedrals could be built with thinner,  higher walls.  Which choice completes the text with the most logical transition?", "options": {"A": "Similarly,", "B": "For instance,", "C": "Nevertheless,", "D": "As a result,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “As a result” logically signals that the thinner, higher walls in this sentence  were a result of the invention of flying buttresses in the previous sentence.    Choice A is incorrect because “similarly” illogically signals that the thinner, higher walls in this sentence  are similar to the invention of flying buttresses in the previous sentence. Instead, the walls were a result  of that invention. Choice B is incorrect because “for instance” illogically signals that the thinner, higher  walls in this sentence are an example supporting the statement about the invention of flying buttresses in  the previous sentence. Instead, the walls were a result of that invention. Choice C is incorrect because  “nevertheless” illogically signals that the thinner, higher walls in this sentence occurred despite the  invention of flying buttresses in the previous sentence. Instead, the walls were a result of that invention."}, {"id": 20, "question": "Tyrian purple was a highly prized dye among the Phoenicians (an ancient civilization located in  present-day Lebanon). The Phoenicians were famous for using this natural dye to color their clothes a  distinctive purple. ______ the name “Phoenicia” itself, some historians claim, may have originally  meant “land of purple.”  Which choice completes the text with the most logical transition?", "options": {"A": "In fact,", "B": "Regardless,", "C": "Lastly,", "D": "On the contrary,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “In fact” logically signals that the claim in this sentence—Phoenicia being  named after the color purple—emphasizes and supports the previous claim that Phoenicians were  famous for using purple dye.    Choice B is incorrect because “regardless” illogically signals that the claim about Phoenicia’s name  contrasts with the previous claim that Phoenicians were famous for using purple dye. Instead, the  naming emphasizes and supports this claim. Choice C is incorrect because “lastly” illogically signals  that the claim about Phoenicia’s name is the final step in a process or sequence. Instead, the naming  emphasizes and supports the previous claim that Phoenicians were famous for using purple dye. Choice  D is incorrect because “on the contrary” illogically signals that the claim about Phoenicia’s name  directly opposes the previous claim that Phoenicians were famous for using purple dye. Instead, the  naming emphasizes and supports this claim."}, {"id": 21, "question": "Etched into Peru’s Nazca Desert are line drawings so large that they can only be fully seen from  high above. Archaeologists have known of the lines since the 1920s, when a researcher spotted some  from a nearby foothill, and they have been studying the markings ever since. ______ archaeologists’  efforts are aided by drones that capture high-resolution aerial photographs of the lines.  Which choice completes the text with the most logical transition?", "options": {"A": "Currently,", "B": "In comparison,", "C": "Still,", "D": "However,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Currently” logically signals that the archaeologists’ use of drones (a  current technology) to photograph the lines is the present-day continuation of the ongoing  archaeological research described in the previous sentence.    Choice B is incorrect because “in comparison” illogically signals that the action described in this  sentence offers a comparison to the ongoing archaeological research described in the previous sentence.  Instead, the use of drones is the present-day continuation of that research. Choice C is incorrect because  “still” illogically signals that the action described in this sentence occurs despite the ongoing  archaeological research described in the previous sentence. Instead, the use of drones is the present-day  continuation of that research. Choice D is incorrect because “however” illogically signals that the action  described in this sentence occurs either despite or in contrast to the ongoing archaeological research  described in the previous sentence. Instead, the use of drones is the present-day continuation of that  research."}, {"id": 22, "question": "Because an achiral molecule is symmetrical, flipping it yields a structurally identical molecule. A  flipped chiral molecule, ______ can be compared to a glove that has been turned inside out: it produces  a structurally inverted molecule rather than an identical one.  Which choice completes the text with the most logical transition?", "options": {"A": "in other words,", "B": "by contrast,", "C": "for example,", "D": "similarly,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. This sentence compares a chiral molecule to an achiral one. It discusses  how when a chiral molecule is flipped, it results in something very different than when an achiral  molecule is flipped. So the transition \"by contrast\" fits the context perfectly.    Choice A is incorrect. This choice uses a transition that indicates a restatement of the same idea in  different words. But this sentence doesn’t restate the same idea as the previous sentence. Instead, it  makes a new point about a different type of molecule (chiral instead of achiral). Choice C is incorrect.  This choice uses a transition that introduces an example, which doesn’t make sense here. The second  sentence isn’t an example of the first sentence’s claim about achiral molecules: it actually introduces an  entirely different idea that focuses on chiral molecules. Choice D is incorrect. This choice uses a  transition that indicates the addition of an agreeing idea. But this sentence shows a contrast with the first  sentence—namely, that a chiral molecule acts very differently from an achiral molecule when flipped."}, {"id": 23, "question": "Most conifers (trees belonging to the phylum Coniferophyta) are evergreen. That is, they keep their  green leaves or needles year-round. However, not all conifer species are evergreen. Larch trees, ______  lose their needles every fall.  Which choice completes the text with the most logical transition?", "options": {"A": "for instance,", "B": "nevertheless,", "C": "meanwhile,", "D": "in addition,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “For instance” logically signals that the information in this sentence—that  larch trees lose their needles every fall—is an example supporting the claim in the previous sentence  (that not all conifer species keep their leaves or needles year-round).     Choice B is incorrect because “nevertheless” illogically signals that the information in this sentence is  true in spite of the claim about conifer species in the previous sentence. Instead, it’s an example  supporting that claim. Choice C is incorrect because “meanwhile” illogically signals that the information  in this sentence is separate from (while occurring simultaneously with) the claim about conifer species  in the previous sentence. Instead, it’s an example supporting that claim. Choice D is incorrect because  “in addition” illogically signals that the information in this sentence is merely an additional fact related  to the claim about conifer species in the previous sentence. Instead, it’s an example supporting that  claim."}, {"id": 24, "question": "Jhumpa Lahiri’s story collection Interpreter of Maladies features multiple stories about romantic  relationships. In “This Blessed House,” newlyweds argue over whether to replace items left by the  previous owners of their new home. ______ in “A Temporary Matter,” a husband and wife attempt to  rekindle their relationship during a four-night blackout.  Which choice completes the text with the most logical transition?", "options": {"A": "Granted,", "B": "For example,", "C": "Likewise,", "D": "Hence,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. \"Likewise\" is a transition that indicates the addition of a new but related  idea. In this sentence, the author is providing another similar example to that discussed in the previous  sentence. Therefore, \"likewise\" works best in this context.    Choice A is incorrect. This choice uses a transition that means \"admittedly.\" But the text isn’t admitting  or conceding anything here. Instead, these two examples work together to support the claim made in the  first sentence. Choice B is incorrect. This choice uses an exemplification transition, which doesn’t make  sense here. The second story is not an example of the story in the previous sentence—it’s another,  similar story. And while both stories exemplify the first sentence in the text, the transition we’re looking  for isn’t actually connected to that sentence. Choice D is incorrect. This choice uses a cause-and-effect  transition, which doesn’t make sense here. The first story didn’t result in the events of the second story."}, {"id": 25, "question": "Small, flat structures called spatulae are found at the tips of the hairs on a spider’s leg. These  spatulae temporarily bond with the atoms of whatever they touch. ______ spiders are able to cling to and  climb almost any surface.  Which choice completes the text with the most logical transition?", "options": {"A": "For instance,", "B": "However,", "C": "Similarly,", "D": "As a result,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “As a result” logically signals that the claim in this sentence—that spiders  can cling to and climb almost any surface—is because of the previous information about the bonding  properties of spiders’ spatulae.    Choice A is incorrect because “for instance” illogically signals that the claim in this sentence  exemplifies the information in the previous sentences. Instead, the claim is because of the previous  information about the bonding properties of spiders’ spatulae. Choice B is incorrect because “however”  illogically signals that the claim in this sentence contrasts with the information in the previous sentences.  Instead, the claim is because of the previous information about the bonding properties of spiders’  spatulae. Choice C is incorrect because “similarly” illogically signals that the claim in this sentence is  similar to, but separate from, the information in the previous sentences. Instead, the claim is because of  the previous information about the bonding properties of spiders’ spatulae."}, {"id": 26, "question": "As a young historian in the 1950s, Alixa Naff began interviewing fellow Arab American immigrants  about their experiences straddling two cultures. Over the next few decades, Naff conducted more than  450 such interviews, also known as oral histories. ______ she collected photographs and other artifacts  that represented her subjects’ experiences.  Which choice completes the text with the most logical transition?", "options": {"A": "In other words,", "B": "On the contrary,", "C": "In addition,", "D": "Today,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. \"In addition\" logically signals that Naff’s artifact collecting was separate  from, and in addition to, her interviewing.    Choice A is incorrect because \"in other words\" illogically signals that the information about Naff’s  artifact collecting restates the previous information about her interviewing. Instead, Naff collected  artifacts in addition to conducting interviews. Choice B is incorrect because \"on the contrary\" illogically  signals that Naff’s artifact collecting was contrary to her interviewing. Instead, Naff collected artifacts in  addition to conducting interviews. Choice D is incorrect because \"today\" illogically signals that Naff’s  artifact collecting is occurring in the present day. Instead, this activity occurred in the past, as indicated  by the past tense verb \"collected.\""}, {"id": 27, "question": "Before California’s 1911 election to approve a proposition granting women the right to vote,  activists across the state sold tea to promote the cause of suffrage. In San Francisco, the Woman’s  Suffrage Party sold Equality Tea at local fairs. ______ in Los Angeles, activist Nancy Tuttle Craig, who  ran one of California’s largest grocery store firms, distributed V otes for Women Tea.  Which choice completes the text with the most logical transition?", "options": {"A": "For example,", "B": "To conclude,", "C": "Similarly,", "D": "In other words,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Similarly” logically signals that the activity described in this sentence  (Nancy Tuttle Craig distributing V otes for Women Tea in her Los Angeles grocery stores) is like the  activity described in the previous sentence (the Woman’s Suffrage Party selling Equality Tea at fairs in  San Francisco). Together, the two examples support the preceding claim that “activists across the state  sold tea to promote the cause of suffrage.”  Choice A is incorrect because “for example” illogically signals that the activity described in this  sentence exemplifies the activity described in the previous sentence. Instead, the two activities are  similar, and both support the preceding claim about selling tea to promote women’s right to vote. Choice  B is incorrect because “to conclude” illogically signals that the activity described in this sentence  concludes or summarizes the information in the previous sentences. Instead, the activity is similar to the  one described in the previous sentence, and both support the preceding claim about selling tea to  promote women’s right to vote. Choice D is incorrect because “in other words” illogically signals that  the activity described in this sentence paraphrases the activity described in the previous sentence.  Instead, the two activities are similar, and both support the preceding claim about selling tea to promote  women’s right to vote."}, {"id": 28, "question": "In 2019, researcher Patricia Jurado Gonzalez and food historian Nawal Nasrallah prepared a stew  from a 4,000-year-old recipe found on a Mesopotamian clay tablet. When they tasted the dish, known  as pašrūtum (“unwinding”), they found that it had a mild taste and inspired a sense of calm. ______ the  researchers, knowing that dishes were sometimes named after their intended effects, theorized that the  dish’s name, “unwinding,” referred to its function: to help ancient diners relax.  Which choice completes the text with the most logical transition?", "options": {"A": "Therefore,", "B": "Alternately,", "C": "Nevertheless,", "D": "Likewise,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. \"Therefore\" logically signals that the action described in this sentence—the  researchers theorizing that the dish was named for its effect on diners—is a result or consequence of the  previous observation that the dish had a calming effect.    Choice B is incorrect because \"alternately\" illogically signals that the action described in this sentence  offers an alternative or contrast to the previous observation that the dish had a calming effect. Instead,  the action is a result or consequence of that observation. Choice C is incorrect because \"nevertheless\"  illogically signals that the action described in this sentence occurs despite the previous observation that  the dish had a calming effect. Instead, the action is a result or consequence of that observation. Choice D  is incorrect because \"likewise\" illogically signals that this sentence merely adds a second, similar detail  to the previous observation that the dish had a calming effect. Instead, this sentence describes an action  that is a result or consequence of that observation."}, {"id": 29, "question": "Neuroscientist Karen Konkoly wanted to determine whether individuals can understand and  respond to questions during REM sleep. She first taught volunteers eye movements they would use to  respond to basic math problems while asleep (a single left-right eye movement indicated the number  one). ______ she attached electrodes to the volunteers’ faces to record their eye movements during  sleep.  Which choice completes the text with the most logical transition?", "options": {"A": "Specifically,", "B": "Next,", "C": "For instance,", "D": "In sum,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “Next” logically signals that the action described in this sentence— Konkoly recording participants’ eye movements—is the next step in Konkoly’s experiment.    Choice A is incorrect because “specifically” illogically signals that this sentence specifies or elaborates  on an aspect of the action described in the previous sentence. Instead, it describes the next step in  Konkoly’s experiment. Choice C is incorrect because “for instance” illogically signals that the action  described in this sentence is an example of the action described in the previous sentence. Instead, it is  the next step in Konkoly’s experiment. Choice D is incorrect because “in sum” illogically signals that  this sentence summarizes or concludes the action described in the previous sentence. Instead, it  describes the next step in Konkoly’s experiment."}, {"id": 30, "question": "In June, female loggerhead sea turtles will swim back to the sandy beaches where they were born to  lay eggs of their own. First, the turtle will dig her nest in the sand. ______ she will lay up to 100 eggs in  the nest. Finally, she will cover it all with sand, before returning to the ocean.  Which choice completes the text with the most logical transition?", "options": {"A": "By contrast,", "B": "Similarly,", "C": "Next,", "D": "For example,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Next” logically signals that the egg laying in this sentence is the next step  in the sequence of events described in the other sentences.    Choice A is incorrect because “by contrast” illogically signals that the egg laying in this sentence  contrasts with the nest digging in the previous sentence. Instead, the egg laying follows the nest digging  as the next step in the sequence of events. Choice B is incorrect because “similarly” illogically signals  that the egg laying in this sentence is similar to the nest digging in the previous sentence. Though the  two actions are related, they are not similar. Instead, the egg laying follows the nest digging as the next  step in the sequence of events. Choice D is incorrect because “for example” illogically signals that the  egg laying in this sentence is an example of the nest digging in the previous sentence. Instead, the egg  laying follows the nest digging as the next step in the sequence of events."}, {"id": 31, "question": "In 2009, the Craft and Folk Art Museum in Los Angeles hosted a special exhibition, Sueños/Yume,  showcasing the works of local sculptor Dora de Larios. As suggested by the show’s title (sueños and  yume mean “dreams” in Spanish and Japanese, respectively), de Larios’s art reflects a mix of cultural  influences. ______ her work is grounded in the artistic traditions of both Mexico and Japan.  Which choice completes the text with the most logical transition?", "options": {"A": "In addition,", "B": "In contrast,", "C": "Specifically,", "D": "Therefore,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Specifically” logically signals that this sentence provides specific, precise  details elaborating on the previous sentence’s claim that de Larios’s art reflects a mix of cultures. This  sentence specifies which cultures the previous sentence is referring to: the artistic traditions of both  Mexico and Japan.     Choice A is incorrect because “in addition” illogically signals that the information in this sentence is a  separate point that follows the previous claim about de Larios’s art. Instead, it provides specific details  elaborating on that claim. Choice B is incorrect because “in contrast” illogically signals that the  information in this sentence contrasts with the previous claim about de Larios’s art. Instead, it provides  specific details elaborating on that claim. Choice D is incorrect because “therefore” illogically signals  that the information in this sentence is a result of the previous claim about de Larios’s art. Instead, it  provides specific details elaborating on that claim."}, {"id": 32, "question": "When one looks at the dark craggy vistas in Hitoshi Fugo’s evocative photo series, one’s mind  might wander off to the cratered surfaces of faraway planets. ______ it’s the series’ title, Flying Frying  Pan, that brings one back to Earth, reminding the viewer that each photo is actually a close-up view of a  familiar household object: a frying pan.  Which choice completes the text with the most logical transition?", "options": {"A": "Consequently,", "B": "Alternatively,", "C": "Ultimately,", "D": "Additionally,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. The first sentence describes an experience that the viewer has when they’re  looking at the photos: they imagine other planets. This sentence describes an experience that the viewer  has afterward: the title reminds them that the photos are of frying pans, bringing them back to reality.  “Ultimately” is a transition that means “eventually” or “in the end,” so it fits the context perfectly.    Choice A is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here.  The viewer imagining other planets when they’re looking at the photos doesn’t cause the title to bring  them back to reality. Choice B is incorrect. This choice uses a transition that indicates another option or  possibility, which doesn’t make sense here. Rather, the viewer has both experiences: first the viewer  imagines that they’re looking at another planet, and then the title reminds them that it’s just a frying pan.  Choice D is incorrect. This choice uses a transition that indicates the addition of an agreeing idea. But  the viewer’s experience in the second sentence is actually the opposite of the viewer’s experience in the  first sentence. In the first sentence, the viewer is imagining that they’re seeing a landscape from another  planet. In the second sentence, the viewer is reminded that they’re looking at a frying pan."}, {"id": 33, "question": "When Chinese director Chloé Zhao accepted the Oscar in 2021 for her film Nomadland, she made  Academy Award history. ______ only one other woman, Kathryn Bigelow of the United States, had  been named best director at the Oscars, making Zhao the second woman and the first Asian woman to  win the award.  Which choice completes the text with the most logical transition?", "options": {"A": "As a result,", "B": "Previously,", "C": "However,", "D": "Likewise,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “Previously” logically signals that the event described in this sentence— Bigelow being named best director—occurred before Zhao’s win. The fact that only one other woman  had won the award before puts Zhao’s win in perspective.    Choice A is incorrect because “as a result” illogically signals that the event described in this sentence  occurred as a result or consequence of Zhao’s win. Instead, it occurred before Zhao was named best  director and puts Zhao’s win in perspective. Choice C is incorrect because “however” illogically signals  that the event described in this sentence occurred in spite of or in contrast to Zhao’s win. Instead, it  occurred before Zhao was named best director and puts Zhao’s win in perspective. Choice D is incorrect  because “likewise” illogically signals that this sentence merely adds a second, similar piece of  information to the information about Zhao’s win. Instead, the fact that only one other woman had won  the award before puts Zhao’s win in perspective."}, {"id": 34, "question": "In 1933, the Twentieth Amendment to the US Constitution was ratified. The amendment mandates  that presidential inaugurations be held on January 20, approximately ten weeks after the November  election. ______ this amendment requires newly elected US senators and representatives to be sworn  into their respective offices on January 3.  Which choice completes the text with the most logical transition?", "options": {"A": "Instead,", "B": "For instance,", "C": "Specifically,", "D": "In addition,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “In addition” logically signals that the information in this sentence—that  the Twentieth Amendment requires newly elected US senators and representatives to be sworn in on  January 3—is separate from and additional to the amendment’s mandate concerning presidential  inaugurations.    Choice A is incorrect because “instead” illogically signals that the information in the sentence presents  an alternative to or substitute for the Twentieth Amendment’s mandate concerning presidential  inaugurations. Rather, the sentence presents a separate requirement in addition to that one. Choice B is  incorrect because “for instance” illogically signals that the information in the sentence exemplifies the  Twentieth Amendment’s mandate concerning presidential inaugurations. Instead, the sentence presents a  separate requirement in addition to that one. Choice C is incorrect because “specifically” illogically  signals that the sentence provides specific, precise details elaborating on the Twentieth Amendment’s  mandate concerning presidential inaugurations. Instead, the sentence presents a separate requirement in  addition to that one."}, {"id": 35, "question": "When soil becomes contaminated by toxic metals, it can be removed from the ground and disposed  of in a landfill. ______ contaminated soil can be detoxified via phytoremediation: plants that can  withstand high concentrations of metals absorb the pollutants and store them in their shoots, which are  then cut off and safely disposed of, preserving the health of the plants.  Which choice completes the text with the most logical transition?", "options": {"A": "Alternatively,", "B": "Specifically,", "C": "For example,", "D": "As a result,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Alternatively” logically signals that the soil decontamination method  described in this sentence—removing toxic metals from the soil via phytoremediation—offers an  alternative to the previously described method (removing the contaminated soil from the ground).    Choice B is incorrect because “specifically” illogically signals that the soil decontamination method  described in this sentence specifies or elaborates on an aspect of the previously described method  (removing the contaminated soil from the ground). Instead, phytoremediation is an alternative to that  method. Choice C is incorrect because “for example” illogically signals that the soil decontamination  method described in this sentence is an example of the previously described method (removing the  contaminated soil from the ground). Instead, phytoremediation is an alternative to that method. Choice  D is incorrect because “as a result” illogically signals that the soil decontamination method described in  this sentence is a result or consequence of the previously described method (removing the contaminated  soil from the ground). Instead, phytoremediation is an alternative to that method."}, {"id": 36, "question": "Plato believed material objects to be crude representations of unseen ideal forms. In his view, such  abstract, nonmaterial forms are the ultimate source of knowledge. Aristotle disagreed, positing that  knowledge is best obtained through direct engagement with the material world; ______ sensory  experience of the material is the ultimate source of knowledge.  Which choice completes the text with the most logical transition?", "options": {"A": "regardless,", "B": "admittedly,", "C": "in other words,", "D": "meanwhile,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “In other words” logically signals that the claim about sensory experience  that follows—that sensory experience is the source of knowledge—is a restatement of Aristotle’s theory  from earlier in the sentence.    Choice A is incorrect because “regardless” illogically signals that the claim about sensory experience  that follows is true in spite of Aristotle’s theory from earlier in the sentence. Instead, this claim is a  restatement of his theory. Choice B is incorrect because “admittedly” illogically signals that the claim  about sensory experience that follows is an exception to Aristotle’s theory from earlier in the sentence.  Instead, this claim is a restatement of his theory. Choice D is incorrect because “meanwhile” illogically  signals that the claim about sensory experience that follows is separate from (while occurring  simultaneously with) Aristotle’s theory from earlier in the sentence. Instead, this claim is a restatement  of his theory."}, {"id": 37, "question": "The envelope-shaped paper bags common in the US 150 years ago were impractical for carrying  goods. ______ because they were the only paper bags that could be mass-produced, these bags  dominated the market. That all changed in the 1870s, when industrial designer Margaret Knight patented  a machine to make flat-bottomed, foldable paper bags.  Which choice completes the text with the most logical transition?", "options": {"A": "However,", "B": "For instance,", "C": "Thus,", "D": "In other words,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “However” logically signals that the information in this sentence—that  envelope-shaped bags dominated the market—contrasts with the previous claim that these bags were  impractical for carrying goods.    Choice B is incorrect because “for instance” illogically signals that the information in this sentence is an  example supporting the previous claim that envelope-shaped bags were impractical for carrying goods.  Instead, the sentence contrasts with the previous claim about the bags. Choice C is incorrect because  “thus” illogically signals that the information in this sentence is a result of the previous claim that  envelope-shaped bags were impractical for carrying goods. Instead, the sentence contrasts with the  previous claim about the bags. Choice D is incorrect because “in other words” illogically signals that the  information in this sentence is a paraphrase of the previous claim that envelope-shaped bags were  impractical for carrying goods. Instead, the sentence contrasts with the previous claim about the bags."}, {"id": 38, "question": "Although novels and poems are considered distinct literary forms, many authors have created hybrid  works that incorporate elements of both. Bernardine Evaristo’s The Emperor’ s Babe, ______ is a verse  novel, a book-length narrative complete with characters and a plot but conveyed in short, crisp lines of  poetry rather than prose.  Which choice completes the text with the most logical transition?", "options": {"A": "by contrast,", "B": "consequently,", "C": "secondly,", "D": "for example,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “For example” logically signals that the information in this sentence—that  The Emperor’s Babe is a novel conveyed in lines of poetry—exemplifies the claim in the previous  sentence about hybrid works that incorporate elements of both novels and poems.    Choice A is incorrect because “by contrast” illogically signals that the information in this sentence  contrasts with the claim about hybrid works in the previous sentence. Instead, the information  demonstrates that Evaristo’s novel is an example of a hybrid work. Choice B is incorrect because  “consequently” illogically signals that the information in this sentence is a consequence, or result, of the  claim about hybrid works in the previous sentence. Instead, the information demonstrates that Evaristo’s  novel is an example of a hybrid work. Choice C is incorrect because “secondly” illogically signals that  the information in this sentence is a second, separate claim from the previous sentence’s claim about  hybrid works. Instead, the information demonstrates that Evaristo’s novel is an example of a hybrid  work."}, {"id": 39, "question": "In studying whether jellyfish sleep, researchers Michael Abrams, Claire Bedbrook, and Ravi Nath  attempted to answer three questions. ______ is there a period each day when the pulse rates of jellyfish  decline? Second, do jellyfish respond more slowly to stimuli during that period? Finally, if prevented  from sleeping, are jellyfish adversely affected?  Which choice completes the text with the most logical transition?", "options": {"A": "As a result,", "B": "First,", "C": "Additionally,", "D": "However,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “First” logically signals that the question in this sentence—whether there is  a daily period during which jellyfish pulse rates decline—is the first in a sequence of three questions the  researchers attempted to answer about jellyfish sleep behavior.    Choice A is incorrect because “as a result” illogically signals that the question in this sentence is a result  of the three questions the researchers attempted to answer. Instead, it is the first of those three questions.  Choice C is incorrect because “additionally” illogically signals that the question in this sentence is an  additional question related to the three questions the researchers attempted to answer. Instead, it is the  first of those three questions. Choice D is incorrect because “however” illogically signals that the  question in this sentence contrasts with the three questions the researchers attempted to answer. Instead,  it is the first of those three questions."}, {"id": 40, "question": "Every chemical compound has a spectroscopic fingerprint, a pattern of reflected light unique to that  compound. ______ upon analyzing the light reflected by the bright regions on the surface of the dwarf  planet Ceres, Maria Cristina De Sanctis of Rome’s National Institute of Astrophysics was able to  determine that the regions contain large amounts of the compound sodium carbonate.  Which choice completes the text with the most logical transition?", "options": {"A": "Regardless,", "B": "Meanwhile,", "C": "Thus,", "D": "In comparison,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Thus” logically signals that the action described in this sentence—the  researcher being able to determine the chemical makeup of the planet’s bright regions based on how they  reflect light—is a result or consequence of the previous information about spectroscopic fingerprints.    Choice A is incorrect because “regardless” illogically signals that the action described in this sentence  occurs despite the previous information about spectroscopic fingerprints. Instead, the finding in this  sentence is a result or consequence of that information. Choice B is incorrect because “meanwhile”  illogically signals that the action described in this sentence either occurs at the same time as or offers an  alternative to the previous information about spectroscopic fingerprints. Instead, the finding in this  sentence is a result or consequence of that information. Choice D is incorrect because “in comparison”  illogically signals that the action described in this sentence is being compared with the previous  information about spectroscopic fingerprints. Instead, the finding in this sentence is a result or  consequence of that information."}, {"id": 41, "question": "The more diverse and wide ranging an animal’s behaviors, the larger and more energy demanding  the animal’s brain tends to be. ______ from an evolutionary perspective, animals that perform only basic  actions should allocate fewer resources to growing and maintaining brain tissue. The specialized  subtypes of ants within colonies provide an opportunity to explore this hypothesis.   Which choice completes the text with the most logical transition?", "options": {"A": "Subsequently,", "B": "Besides,", "C": "Nevertheless,", "D": "Thus,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “Thus” logically signals that the claim in this sentence—that animals  performing only basic actions should allocate relatively few resources to their brain tissue—is a  consequence of the previous sentence’s claim about the energy demands of animal brains (namely, that  the more diverse an animal’s behaviors, the more energy its brain needs).     Choice A is incorrect because “subsequently” illogically signals that the claim in this sentence occurs  later in a chronological sequence of events than the previous sentence’s claim about the energy demands  of animal brains. Instead, the second claim is a consequence of the first. Choice B is incorrect because  “besides” illogically signals that the claim in this sentence provides a separate point in addition to, or  apart from, the previous sentence’s claim about the energy demands of animal brains. Instead, the  second claim is a consequence of the first. Choice C is incorrect because “nevertheless” illogically  signals that the claim in this sentence is true in spite of the previous sentence’s claim about the energy  demands of animal brains. Instead, the second claim is a consequence of the first."}, {"id": 42, "question": "In his 1925 book The Morphology of Landscape, US geographer Carl Sauer challenged prevailing  views about how natural landscapes influence human cultures. ______ Sauer argued that instead of  being shaped entirely by their natural surroundings, cultures play an active role in their own  development by virtue of their interactions with the environment.  Which choice completes the text with the most logical transition?", "options": {"A": "Similarly,", "B": "Finally,", "C": "Therefore,", "D": "Specifically,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “Specifically” logically signals that the information in this sentence about  Sauer’s argument—that, according to Sauer, cultures play a role in their own development, as opposed  to being shaped solely by natural surroundings—provides specific, precise details elaborating on the  more general information in the previous sentence about how Sauer challenged prevailing views about  how natural landscapes influence human cultures.  Choice A is incorrect because “similarly” illogically signals that the information in this sentence about  Sauer’s argument is similar to, but separate from, the more general information in the previous sentence.  Instead, it provides specific, precise details elaborating on that information. Choice B is incorrect  because “finally” illogically signals that the information in this sentence about Sauer’s argument  indicates a last step in a process or a concluding summary. Instead, it provides specific, precise details  elaborating on the general information in the previous sentence. Choice C is incorrect because  “therefore” illogically signals that the information in this sentence about Sauer’s argument is a result of  the more general information in the previous sentence. Instead, it provides specific, precise details  elaborating on that information."}, {"id": 43, "question": "Magnetic levitation (maglev) trains are suspended above a track by powerful electromagnets,  reducing friction and thus allowing for much faster speeds. Though maglev advocates in the US have  long imagined these trains crisscrossing the country, their dream remains unrealized. ______ of the  handful of maglev trains currently in operation, all are in Asia.  Which choice completes the text with the most logical transition?", "options": {"A": "In fact,", "B": "To that end,", "C": "Nevertheless,", "D": "That said,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. This sentence emphasizes just how far maglev advocates’ dreams are from  coming true. “In fact” is a transition used to emphasize the truth of a statement that modifies the  previous statement and therefore fits perfectly in this context.    Choice B is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here.  Maglev advocates’ dream remaining unrealized would not cause there to be only a few maglev trains, all  located in Asia. Choice C is incorrect. This choice uses a disagreement transition, which doesn’t make  sense here. In fact, this sentence agrees with the previous sentence—both talk about how maglev trains  are far from becoming common in the US. Choice D is incorrect. This choice uses a disagreement  transition, which doesn’t make sense here. In fact, this sentence agrees with the previous sentence—both  talk about how maglev trains are far from becoming common in the US."}, {"id": 44, "question": "Iraqi artist Nazik Al-Malaika, celebrated as the first Arabic poet to write in free verse, didn’t reject  traditional forms entirely; her poem “Elegy for a Woman of No Importance” consists of two ten-line  stanzas and a standard number of syllables. Even in this superficially traditional work, ______ Al- Malaika was breaking new ground by memorializing an anonymous woman rather than a famous man.  Which choice completes the text with the most logical transition?", "options": {"A": "therefore,", "B": "in fact,", "C": "moreover,", "D": "though,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. The first sentence tells us that Al-Malaika sometimes used \"traditional  forms\". The second tells us that even when she used traditional forms, Al-Malaika was \"breaking new  ground\". To connect these ideas, we need a contrast word like \"but.\" \"Though\" is a contrast word similar  to \"but.\"  Choice A is incorrect. This isn’t a logical transition. The first sentence tells us that Al-Malaika  sometimes used \"traditional forms\". The second tells us that even when she used traditional forms, Al- Malaika was \"breaking new ground\". To connect these ideas, we need a contrast word like \"but.\"  \"Therefore\" doesn’t show contrast; it shows cause and effect. Choice B is incorrect. This isn’t a logical  transition. The first sentence tells us that Al-Malaika sometimes used \"traditional forms\". The second  tells us that even when she used traditional forms, Al-Malaika was \"breaking new ground\". To connect  these ideas, we need a contrast word like \"but.\" \"In fact\" is a phrase that usually emphasizes the truth of  the previous statement. Choice C is incorrect. This isn’t a logical transition. The first sentence tells us  that Al-Malaika sometimes used \"traditional forms\". The second tells us that even when she used  traditional forms, Al-Malaika was \"breaking new ground\". To connect these ideas, we need a contrast  word like \"but.\" \"Moreover\" doesn’t show contrast—it introduces additional information that continues  or supports the previous idea."}, {"id": 45, "question": "A 2017 study of sign language learners tested the role of iconicity—the similarity of a sign to the  thing it represents—in language acquisition. The study found that the greater the iconicity of a sign, the  more likely it was to have been learned. ______ the correlation between acquisition and iconicity was  lower than that between acquisition and another factor studied: sign frequency.  Which choice completes the text with the most logical transition?", "options": {"A": "In fact,", "B": "In other words,", "C": "Granted,", "D": "As a result,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Granted” logically signals that the following information—that iconicity is  not as highly correlated with acquisition as sign frequency—is true in spite of the inform
