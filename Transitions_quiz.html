ation about the  correlation between iconicity and acquisition in the previous sentence.    Choice A is incorrect because “in fact” illogically signals that the sentence that follows either  emphasizes or refutes the information in the previous sentence regarding the correlation between  iconicity and acquisition. Instead, the sentence that follows provides additional information that is true  in spite of the preceding information; it neither emphasizes nor refutes that information. Choice B is  incorrect because “in other words” illogically signals that the sentence that follows is a restatement of  the information in the previous sentence; instead, the sentence that follows provides additional  information that is true in spite of the preceding information. Choice D is incorrect because “as a result”  illogically signals that the sentence that follows is a result of the information in the previous sentence  regarding the correlation between iconicity and acquisition; instead, the sentence that follows is true in  spite of the preceding information."}, {"id": 46, "question": "Establishing Coordinated Universal Time (UTC) is no easy task. Each month, readings of a single  second from atomic clocks around the world are taken and sent to the International Bureau of Weights  and Measures (BIPM) in France. ______ BIPM metrologists perform the meticulous work of assembling  these minutely disparate readings into a globally shared time standard.  Which choice completes the text with the most logical transition?", "options": {"A": "There,", "B": "In particular,", "C": "For example,", "D": "Conversely,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. \"There\" indicates that the work of calculating Coordinated Universal Time  takes place at the International Bureau of Weights and Measures in France. Because \"there\" indicates a  location, it fits the context perfectly.    Choice B is incorrect. This choice uses an exemplification transition, which doesn’t make sense here.  This sentence is describing where the work of coordinating Coordinated Universal Time takes place, not  giving an example of the work described in the previous sentence. Choice C is incorrect. This choice  uses an exemplification transition, which doesn’t make sense here. This sentence is describing where the  work of coordinating Coordinated Universal Time takes place, not giving an example of the work  described in the previous sentence. Choice D is incorrect. This choice uses a disagreement transition.  But this sentence doesn’t disagree with the previous sentence. They both describe the work involved in  calculating Coordinated Universal Time."}, {"id": 47, "question": "Historically, most conductors of major orchestras and opera companies have been European men,  but a new, more diverse generation of artists is stepping up to the podium. Mexico’s Alondra de la Parra  took over as conductor for the Queensland Symphony Orchestra in 2017, ______ and Colombia’s Lina  Gonzalez-Granados did the same for the Los Angeles Opera in 2022.  Which choice completes the text with the most logical transition?", "options": {"A": "in addition,", "B": "lastly,", "C": "granted,", "D": "for instance,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “For instance” logically signals that the details in this sentence—that  Mexican conductor Alondra de la Parra and Colombian conductor Lina Gonzalez-Granados took new  conducting positions—are examples supporting the previous claim about the new generation of artists.    Choice A is incorrect because “in addition” illogically signals that the details in this sentence about de la  Parra and Gonzalez-Granados are merely additional facts related to the previous claim about the new  generation of artists. Instead, they are examples supporting that claim. Choice B is incorrect because  “lastly” illogically signals that the details in this sentence about de la Parra and Gonzalez-Granados are  the last step or a concluding summary of the previous claim about the new generation of artists. Instead,  they are examples supporting that claim. Choice C is incorrect because “granted” illogically signals that  the details in this sentence about de la Parra and Gonzalez-Granados are exceptions to the previous  claim about the new generation of artists. Instead, they are examples supporting that claim."}, {"id": 48, "question": "Earth’s auroras—colorful displays of light seen above the northern and southern poles—result,  broadly speaking, from the Sun’s activity. _____ the Sun releases charged particles that are captured by  Earth’s magnetic field and channeled toward the poles. These particles then collide with atoms in the  atmosphere, causing the atoms to emit auroral light.  Which choice completes the text with the most logical transition?", "options": {"A": "Specifically,", "B": "Similarly,", "C": "Nevertheless,", "D": "Hence,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Specifically” logically signals that the information in this sentence—that  the Sun releases charged particles that later collide with atoms, resulting in auroral light—provides  specific, precise details about how auroras result from the Sun’s activity.     Choice B is incorrect because “similarly” illogically signals that the information in this sentence is  similar to the general information about auroras in the previous sentence. Instead, this sentence provides  specific, precise details about how auroras form. Choice C is incorrect because “nevertheless” illogically  signals that the information in this sentence is despite the general information about auroras in the  previous sentence. Instead, this sentence provides specific, precise details about how auroras form.  Choice D is incorrect because “hence” illogically signals that the information in this sentence is a result  of the general information about auroras in the previous sentence. Instead, this sentence provides  specific, precise details about how auroras form."}, {"id": 49, "question": "“Tulip mania”—the rapid rise and sudden fall of the price of tulip bulbs in seventeenth-century  Amsterdam—is often cited as an example of the perils of rampant market speculation. However, recent  research has demonstrated that the episode was neither as frenzied nor as disastrous as has been thought.  The popular myth surrounding it, ______ should be regarded with some skepticism.  Which choice completes the text with the most logical transition?", "options": {"A": "for example,", "B": "by contrast,", "C": "nevertheless,", "D": "therefore,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. This sentence is arguing that new evidence contradicting popular beliefs  about “tulip mania” should cast doubt on those beliefs. “Therefore” is a cause-and-effect transition,  which fits perfectly in this context.    Choice A is incorrect. This choice uses an exemplification transition, which doesn’t make sense here.  Skepticism about the popular beliefs is not an example of recent evidence contradicting those beliefs— rather, skepticism is an effect of that recent evidence. Choice B is incorrect. This choice uses a  disagreement transition. But this sentence doesn’t disagree with the previous sentence. Instead, it  connects a cause from the previous sentence (new evidence that tulip mania was not as disastrous as  thought) to an effect (that we should look with skepticism upon the myth about its disastrousness).  Choice C is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with  the previous sentence. Instead, it connects a cause from the previous sentence (new evidence that tulip  mania was not as disastrous as thought) to an effect (that we should look with skepticism upon the myth  about its disastrousness)."}, {"id": 50, "question": "When, in the 1800s, geologists first realized that much of Earth had once been covered by great  sheets of ice, some theorized that the phenomenon was cyclical, occurring at regular intervals. Each Ice  Age is so destructive, though, that it largely erases the geological evidence of its predecessor. ______  geologists were unable to confirm the theory of cyclical Ice Ages until the 1960s.  Which choice completes the text with the most logical transition?", "options": {"A": "Hence,", "B": "Moreover,", "C": "Nevertheless,", "D": "Next,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Hence” logically signals that the information in this sentence—that  geologists couldn’t confirm the theory of cyclical Ice Ages until the 1960s—is a consequence of the  previous information about the destructiveness of each Ice Age and the erasure of necessary geological  evidence.      Choice B is incorrect because “moreover” illogically signals that the information in this sentence is  merely additional to the previous information about the destructiveness of each Ice Age. Instead, the  sentence  identifies a specific consequence of that information. Choice C is incorrect because  “nevertheless” illogically signals that the information in this sentence is true despite the previous  information about the destructiveness of each Ice Age. Instead, the sentence identifies a specific  consequence of that information. Choice D is incorrect because “next” illogically signals that the  information in this sentence is the next step in a process. Instead, the sentence identifies a specific  consequence of the previous information."}, {"id": 51, "question": "Practical movie effects, such as the use of actual locations in a film, provide a more realistic visual  experience than computer-generated imagery (CGI) does, but giving audiences the “real thing” can be  prohibitively expensive. ______ many filmmakers use a blended approach, employing practical effects  whenever possible and CGI elements as necessary to control costs.  Which choice completes the text with the most logical transition?", "options": {"A": "Similarly,", "B": "For this reason,", "C": "Furthermore,", "D": "In other words,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. The first sentence tells us that practical effects are more realistic but also  more expensive than CGI. The second sentence tells us that many filmmakers use both kinds of effects,  balancing realism with cost. To connect these ideas, we need a cause-and-effect transition, like  “therefore.” “For this reason” has the same meaning as “therefore.” .  Choice A is incorrect. This isn’t a logical transition. The first sentence tells us that practical effects are  more realistic but also more expensive than CGI. The second sentence tells us that many filmmakers use  both kinds of effects, balancing realism with cost. To connect these ideas, we need a cause-and-effect  transition, like “therefore.” “Similarly” doesn’t show cause and effect: it shows the addition of another  agreeing idea. Choice C is incorrect. This isn’t a logical transition. The first sentence tells us that  practical effects are more realistic but also more expensive than CGI. The second sentence tells us that  many filmmakers use both kinds of effects, balancing realism with cost. To connect these ideas, we need  a cause-and-effect transition, like “therefore.” “Furthermore” doesn’t show cause and effect: it shows the  addition of another agreeing idea. Choice D is incorrect. This isn’t a logical transition. The first sentence  tells us that practical effects are more realistic but also more expensive than CGI. The second sentence  tells us that many filmmakers use both kinds of effects, balancing realism with cost. To connect these  ideas, we need a cause-and-effect transition, like “therefore.” “In other words” doesn’t show cause and  effect: it shows a restatement of the same idea in different words."}, {"id": 52, "question": "Originally coined by economist Joan Robinson to refer to markets with multiple sellers of a product  but only one buyer, the term “monopsony” can also refer to markets where demand for labor is limited.  In a product monopsony, the single buyer can force sellers to lower their prices. ______ in a labor  monopsony, employers can force workers to accept lower wages.  Which choice completes the text with the most logical transition?", "options": {"A": "Earlier,", "B": "Instead,", "C": "Similarly,", "D": "In particular,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Similarly” logically signals that the information in this sentence about a  labor monopsony is similar to the information in the previous sentence about a product monopsony. In  both types of markets, one party (an employer or a buyer) has the power to force another party (a worker  or seller) to accept less money (for labor or products).      Choice A is incorrect because “earlier” illogically signals that the information in this sentence about a  labor monopsony occurs earlier (in a chronological sequence) than the information about a product  monopsony. Instead, it is similar to the information about a product monopsony. Choice B is incorrect  because “instead” illogically signals that the information in this sentence about a labor monopsony is an  alternative to the previous information about a product monopsony. Instead, it is similar to the  information about a product monopsony.  Choice D is incorrect because “in particular” illogically  signals that the information in this sentence about a labor monopsony provides specific details  elaborating on the previous information about a product monopsony. Instead, it is similar to the  information about a product monopsony."}, {"id": 53, "question": "Seismologists Kaiqing Yuan and Barbara Romanowicz have proposed that the magma fueling  Iceland’s more than 30 active volcano systems emerges from deep within Earth. The great depths  involved—nearly 3,000 km—mark Iceland’s volcanoes as extreme outliers; ______ many of Earth’s  volcanoes are fed by shallow pockets of magma found less than 15 km below the surface.  Which choice completes the text with the most logical transition?", "options": {"A": "indeed,", "B": "nevertheless,", "C": "in addition,", "D": "consequently,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. The second part of the sentence says that many volcanoes use shallow  pockets of magma. This is an elaboration of the same underlying idea from the first part of the sentence,  which says that the super deep magma of Icelandic volcanoes’ makes them outliers. “Indeed” is a  transition used for elaborating on the same idea, so it fits the context perfectly.    Choice B is incorrect. This choice uses a disagreement transition. But these two parts of the sentence  agree with each other, so “nevertheless” doesn’t make sense. Choice C is incorrect. This choice uses a  transition that indicates the addition of a new idea. But the second part of the sentence isn’t adding a  new idea: it’s elaborating on the same idea expressed in the first part of the sentence. Choice D is  incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here. The fact that  Iceland’s deep-magma volcanoes are outliers doesn’t cause many other volcanoes to get fed by shallow  pockets of magma."}, {"id": 54, "question": "Chimamanda Ngozi Adichie’s 2013 novel Americanah chronicles the divergent experiences of  Ifemelu and Obinze, a young Nigerian couple, after high school. Ifemelu moves to the United States to  attend a prestigious university. ______ Obinze travels to London, hoping to start a career there.  However, frustrated with the lack of opportunities, he soon returns to Nigeria.  Which choice completes the text with the most logical transition?", "options": {"A": "Meanwhile,", "B": "Nevertheless,", "C": "Secondly,", "D": "In fact,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Meanwhile” logically signals that the action described in this sentence  (Obinze’s move to London to pursue a career) is simultaneous with the action described in the previous  sentence (Ifemelu’s move to the United States). The first sentence establishes that the actions take place  around the same time, referring to the characters’ “divergent experiences” following high school.      Choice B is incorrect because “nevertheless” illogically signals that the information in this sentence  about Obinze’s move to London is true despite the previous information about Ifemelu’s move to the  United States. Instead, as the first sentence establishes, Obinze’s move and Ifemelu’s move are related,  parallel experiences that occur around the same time. Choice C is incorrect because “secondly”  illogically signals that the information in this sentence is a second point or reason separate from the  previous information about Ifemelu’s move to the United States. Instead, as the first sentence  establishes, Obinze’s move and Ifemelu’s move are related, parallel experiences that occur around the  same time. Choice D is incorrect because “in fact” illogically signals that the information in this  sentence emphasizes, modifies, or contradicts the previous information about Ifemelu’s move to the  United States. Instead, as the first sentence establishes, Obinze’s move and Ifemelu’s move are related,  parallel experiences that occur around the same time."}, {"id": 55, "question": "The chemical trimethylamine N-oxide not only gives fish their fishy smell but also protects them  from crushing hydrostatic pressure in deep waters. Trimethylamine N-oxide strengthens the bonds  between water molecules in a fish’s body. ______ these water molecules maintain their linked structure  at extreme depths, thus preventing pressure-related damage.  Which choice completes the text with the most logical transition?", "options": {"A": "Nevertheless,", "B": "As a result,", "C": "However,", "D": "For instance,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “As a result” indicates that water molecules maintaining their linked  structure at high pressures is caused by the strengthening of these water molecules by trimethylamine N- oxide. So the transition “as a result” fits the context perfectly.    Choice A is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with  the previous one—rather, it’s describing an effect of the phenomenon described in the previous sentence.  Choice C is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with  the previous one; it actually expands on the previous sentence by describing an effect of the  strengthened molecules. Choice D is incorrect. This choice uses an exemplification transition, which  doesn’t make sense here. The second sentence doesn’t provide an example or instance of the idea in the  previous sentence. Instead, it explores the effects of the previous idea in more depth."}, {"id": 56, "question": "One poll taken after the first 1960 presidential debate suggested that John Kennedy lost badly: only  21 percent of those who listened on the radio rated him the winner. ______ the debate was ultimately  considered a victory for the telegenic young senator, who rated higher than his opponent, Vice President  Richard Nixon, among those watching on the new medium of television.    Which choice completes the text with the most logical transition?", "options": {"A": "In other words,", "B": "Therefore,", "C": "Likewise,", "D": "Nevertheless,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “Nevertheless” logically signals that the claim in this sentence—that the  telegenic Kennedy was ultimately considered the winner of the debate—is true despite the previous  information about the poll of radio listeners.    Choice A is incorrect because “in other words” illogically signals that the claim in this sentence is a  paraphrase of the previous information about the poll of radio listeners. Instead, Kennedy was ultimately  considered the winner despite what that poll suggested about his performance. Choice B is incorrect  because “therefore” illogically signals that the claim in this sentence is a result of the previous  information about the poll of radio listeners. Instead, Kennedy was ultimately considered the winner  despite what that poll suggested about his performance. Choice C is incorrect because “likewise”  illogically signals that the claim in this sentence is similar to the previous information about the poll of  radio listeners. Instead, Kennedy was ultimately considered the winner despite what that poll suggested  about his performance."}, {"id": 57, "question": "A firefly uses specialized muscles to draw oxygen into its lower abdomen through narrow tubes,  triggering a chemical reaction whereby the oxygen combines with chemicals in the firefly’s abdomen to  produce a glow. ______ when the firefly stops drawing in oxygen, the reaction—and the glow—cease.  Which choice completes the text with the most logical transition?", "options": {"A": "For instance,", "B": "By contrast,", "C": "Specifically,", "D": "In conclusion,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “By contrast” logically signals that the information in this sentence—that a  firefly’s glow ceases when it stops drawing in oxygen—contrasts with the previous sentence’s  discussion of the processes that cause a firefly to begin to glow.    Choice A is incorrect because “for instance” illogically signals that the information in the sentence  exemplifies the previous sentence’s discussion of how a firefly begins to glow. Instead, it contrasts with  the previous sentence’s discussion. Choice C is incorrect because “specifically” illogically signals that  the information in the sentence provides specific details elaborating on the previous sentence’s  discussion of how a firefly begins to glow. Instead, it contrasts with the previous sentence’s discussion.  Choice D is incorrect because “in conclusion” illogically signals that the information in the sentence  sums up the previous sentence’s discussion of how a firefly begins to glow. Instead, it contrasts with the  previous sentence’s discussion."}, {"id": 58, "question": "With her room-sized installation The Interstitium, Iranian American artist Laleh Mehran succeeded  in creating a space that felt, as intended, both “familiar and distant.” ______ with a video screen placed  at the far end of the coal slag-encrusted room, her installation was reminiscent of a typical movie  theater—albeit one found in a subterranean coal mine.  Which choice completes the text with the most logical transition?", "options": {"A": "Next,", "B": "Nevertheless,", "C": "Indeed,", "D": "Instead,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. \"Indeed\" logically signals that the information in this sentence—that Laleh  Mehran’s installation resembled both a typical movie theater and a coal mine—supports the previous  sentence’s claim that the space Mehran created felt both \"familiar and distant.\"    Choice A is incorrect because \"next\" illogically signals that the description of Laleh Mehran’s  installation in this sentence is the next step in a process. Rather, it supports the previous sentence’s claim  about Mehran’s installation. Choice B is incorrect because \"nevertheless\" illogically signals that the  information in this sentence is true despite the claim about Laleh Mehran’s installation in the previous  sentence. Rather, it supports that claim. Choice D is incorrect because \"instead\" illogically signals that  this sentence presents an alternative to the previous sentence’s claim about Laleh Mehran’s installation.  Rather, it supports that claim."}, {"id": 59, "question": "With its clichéd imagery of suburban lawns and power lines, John Ashbery’s 2004 poem “Ignorance  of the Law Is No Excuse” may seem barren terrain for critical analysis. ______ cultural critic Lauren  Berlant finds fertile ground in just its first two stanzas, devoting most of a book chapter to deciphering  the “weight of the default space” Ashbery creates in this poem.  Which choice completes the text with the most logical transition?", "options": {"A": "Likewise,", "B": "Nonetheless,", "C": "In turn,", "D": "That is,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “Nonetheless” is a transition that indicates disagreement. The first sentence  describes the unlikelihood of finding much for critical analysis in Ashbery’s poem (“barren terrain”),  while the second sentence describes how Berlant did in fact find much to analyze in Ashbery’s poem  (“fertile ground”), so the transition “nonetheless” fits perfectly.    Choice A is incorrect. This choice uses a transition that indicates the addition of a new but similar idea,  which doesn’t make sense here. The idea in this sentence directly contradicts the idea in the previous  sentence. Choice C is incorrect. This choice uses a cause-and-effect transition, which doesn’t make  sense in this context—a poem seemingly having little opportunity for critical analysis would not cause  someone to write an extensive critical analysis (in fact, we might expect the opposite). Choice D is  incorrect. This choice uses a transition that indicates a restatement of the same idea in other words. But  the text isn’t restating the first idea here. Instead, it’s offering a contradiction to the idea expressed in the  first sentence."}, {"id": 60, "question": "In the 1850s, William Still was instrumental in helping nearly 1,000 people escape from slavery,  earning him the moniker “the Father of the Underground Railroad.” ______ despite the fame of his  contributions during his lifetime, Still is discussed far less today than other prominent Black  abolitionists from his era, such as Frederick Douglass and Harriet Tubman.     Which choice completes the text with the most logical transition?", "options": {"A": "For example,", "B": "However,", "C": "Specifically,", "D": "Similarly,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. \"However\" is used to indicate a contrast between two ideas. The first  sentence describes how Still used to be famous. This sentence describes how Still is not very famous  today, so the transition \"however\" fits perfectly.    Choice A is incorrect. This choice uses a transition that introduces an example. But the second sentence  doesn’t provide a specific example of Still’s famous contributions to the Underground Railroad. Instead,  it changes the subject to how his fame has faded over time. Choice C is incorrect. This choice uses a  transition that introduces an example or continuation of a previous idea. But the second sentence doesn’t  provide a specific example of Still’s famous contributions to the Underground Railroad. Instead, it  changes the subject to how his fame has faded over time. Choice D is incorrect. This choice uses a  transition that indicates the agreement between two ideas. But this sentence shows a contrast with the  first sentence—namely, that Still used to be very famous but now isn’t very famous."}, {"id": 61, "question": "Researchers Helena Mihaljević-Brandt, Lucía Santamaría, and Marco Tullney report that while  mathematicians may have traditionally worked alone, evidence points to a shift in the opposite  direction. ______ mathematicians are choosing to collaborate with their peers—a trend illustrated by a  rise in the number of mathematics publications credited to multiple authors.  Which choice completes the text with the most logical transition?", "options": {"A": "Similarly,", "B": "For this reason,", "C": "Furthermore,", "D": "Increasingly,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “Increasingly” logically signals that the claim in this sentence—that  mathematicians are collaborating with their peers—marks a change relative to what was traditionally  done. As the previous sentence explains, while mathematicians may have traditionally worked alone,  evidence points to a shift in the opposite direction. The claim describes the shift: a rise in collaboration.    Choice A is incorrect because “similarly” illogically signals that the claim in this sentence is similar to,  but separate from, the previous claim about the shift away from mathematicians working alone. Instead,  the claim about the rise in collaboration elaborates on the previous claim, describing the shift. Choice B  is incorrect because “for this reason” illogically signals that the claim in this sentence is caused by the  previous claim about the shift away from mathematicians working alone. Instead, the claim about the  rise in collaboration elaborates on the previous claim, describing the shift. Choice C is incorrect because  “furthermore” illogically signals that the claim in this sentence is in addition to the previous claim about  the shift away from mathematicians working alone. Instead, the claim about the rise in collaboration  elaborates on the previous claim, describing the shift."}, {"id": 62, "question": "Although those who migrated to California in 1849 dreamed of finding gold nuggets in streambeds,  the state’s richest deposits were buried deeply in rock, beyond the reach of individual  prospectors. ______ by 1852, many had given up their fortune-hunting dreams and gone to work for one  of the large companies capable of managing California’s complex mining operations.    Which choice completes the text with the most logical transition?", "options": {"A": "Furthermore,", "B": "Still,", "C": "Consequently,", "D": "Next,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Consequently” logically signals that the information in this sentence—that  many individual gold prospectors gave up their fortune-hunting dreams and became employees of  mining companies—is a result or consequence of the previous information about the inaccessibility of  the state’s gold deposits.     Choice A is incorrect because “furthermore” illogically signals that the information in this sentence  merely adds to the previous information about the inaccessibility of the state’s gold deposits. Instead, it’s  a result or consequence of that information. Choice B is incorrect because “still” illogically signals that  the information in this sentence offers a contrast or exception to the previous information about the  inaccessibility of the state’s gold deposits. Instead, it’s a result or consequence of that information.  Choice D is incorrect because “next” illogically signals that the information in this sentence is the next  step in a process. Instead, it’s a result or consequence of the previous information about the  inaccessibility of the state’s gold deposits."}, {"id": 63, "question": "In 2018, Kurt Luther and Vikram Mohanty created the web-based tool Civil War Photo Sleuth  (CWPS). A user uploading an unknown Civil War soldier’s photograph to CWPS first tags the photo  with all known information. ______ CWPS’s facial-recognition software analyzes twenty-seven  different physical features and looks for matches to tagged images already in the database.  Which choice completes the text with the most logical transition?", "options": {"A": "Then,", "B": "In fact,", "C": "Likewise,", "D": "For example,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Then” indicates that the events in this sentence took place after the events  in the previous sentence. Only after users upload images of unknown soldiers can those images be  analyzed.    Choice B is incorrect. This transition is used to emphasize the truth of a statement that modifies the  previous statement. But this sentence doesn’t modify the step described in the previous statement:  instead, it introduces an entirely new step in the process. So “in fact” wouldn’t make sense here. Choice  C is incorrect. This choice uses a transition that indicates the addition of a new but related idea, which  doesn’t make sense here. Analyzing the physical features in the uploaded photographs isn’t a similar  idea, but rather the next step in the process. Choice D is incorrect. This choice uses an exemplification  transition, which doesn’t make sense here. Analyzing physical features is not an example of uploading  and tagging an image."}, {"id": 64, "question": "Arkansas aviator Louise Thaden was already a record breaker when she won the inaugural National  Women’s Air Derby, a race from California to Ohio, in August of 1929. ______ in December of 1928,  Thaden had set an aviation record when she reached an altitude of 20,269 feet in a Travel Air biplane.  Which choice completes the text with the most logical transition?", "options": {"A": "Earlier,", "B": "However,", "C": "Next,", "D": "As a result,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. This choice uses a transition that indicates a shift back in time. Since the  first sentence talks about Thaden’s race win in 1929 and the second shifts back to talking about her  record in 1928, this makes the most sense here.    Choice B is incorrect. This choice uses a disagreement transition. But this sentence actually agrees with  and expands on the previous sentence by describing the earlier record that Thaden had \"already\" held.  Choice C is incorrect. This choice uses a transition that indicates a shift forward in time, which doesn’t  make sense here. A record in 1928 didn’t come after Thaden’s race win in 1929. Choice D is incorrect.  This choice uses a cause-and-effect transition, which doesn’t make sense in this context—an event in  1929 can’t cause something in 1928."}, {"id": 65, "question": "With darkness falling, a mother elephant loses sight of her calf and wants to make sure it is  safe. ______ she releases an infrasonic call for the calf to hear. Infrasonic sound is below the range of  human hearing, but many animals can hear these sounds from several miles away.  Which choice completes the text with the most logical transition?", "options": {"A": "For example,", "B": "For this reason,", "C": "Nowadays,", "D": "Similarly,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. \"For this reason\" is a cause-and-effect transition. The cause in this case is  that the mother elephant wants to know that her calf is safe, so the effect is that she lets out an infrasonic  call for the calf to hear. Therefore, \"for this reason\" fits perfectly in this context.    Choice A is incorrect. This choice uses a transition that introduces an example of a previous idea. But  the second sentence doesn’t provide an example of the events described in the first sentence. Instead, it  describes what happens next: the mother elephant calls for her calf. Choice C is incorrect. This choice  uses a transition that indicates a shift from the past to the current time, which doesn’t make sense here.  Both sentences use the present tense, as they’re describing the same time period. Choice D is incorrect.  This choice uses a transition that indicates commonality or agreement between two ideas. But this  sentence isn’t similar to the events in the first sentence. Instead, it describes the events that happen next."}, {"id": 66, "question": "The number of dark spots that appear on the Sun, known as sunspots, can vary greatly. For example,  there were about 180 sunspots in November 2001. ______blank there were only about 2 sunspots in  December 2008.     Which choice completes the text with the most logical transition?", "options": {"A": "In other words,", "B": "Similarly,", "C": "Therefore,", "D": "By comparison,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. The first sentence claims that the number of sunspots can vary greatly. To  support this claim, the next two sentences compare two examples: one time when there were 180  sunspots and one time when there were only 2 sunspots. So the transition “by comparison” fits perfectly.    Choice A is incorrect. This choice uses a transition that indicates a restatement of the same idea, which  doesn’t make sense here. This sentence doesn’t restate the first example—it describes a totally different  example. Choice B is incorrect. This choice uses a transition that indicates the addition of a similar idea,  which doesn’t make sense here. This sentence describes a second example that is very different from the  first example. Choice C is incorrect. This choice uses a cause-and-effect transition, which doesn’t make  sense here. The first example didn’t result in the second example."}, {"id": 67, "question": "Archaeologist Sue Brunning explains why the seventh-century ship burial site at Sutton Hoo in  England was likely the tomb of a king. First, the gold artifacts inside the ship suggest that the person  buried with them was a wealthy and respected leader. ______ the massive effort required to bury the  ship would likely only have been undertaken for a king.  Which choice completes the text with the most logical transition?", "options": {"A": "Instead,", "B": "Still,", "C": "Specifically,", "D": "Second,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “Second” logically signals that the information in this sentence—that the  effort to bury the ship would likely only have been made for a king—joins the information in the  previous sentence (“first…”) in supporting Brunning’s claim that the burial site was likely the tomb of a  king.    Choice A is incorrect because “instead” illogically signals that the information in this sentence presents  an alternative or substitute to the previous information about the gold artifacts inside the ship. Rather,  this sentence presents a second piece of information that supports Brunning’s claim. Choice B is  incorrect because “still” illogically signals that the information in this sentence exists in contrast to or  despite the previous information about the gold artifacts inside the ship. Instead, this sentence presents a  second piece of information that supports Brunning’s claim. Choice C is incorrect because “specifically”  illogically signals that the information in this sentence specifies or elaborates on the previous  information about the gold artifacts inside the ship. Instead, this sentence presents a second piece of  information that supports Brunning’s claim."}, {"id": 68, "question": "Organisms have evolved a number of surprising adaptations to ensure their survival in adverse  conditions. Tadpole shrimp (Triops longicaudatus) embryos, ______ can pause development for over ten  years during extended periods of drought.  Which choice completes the text with the most logical transition?", "options": {"A": "in contrast,", "B": "for example,", "C": "meanwhile,", "D": "consequently,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “For example” logically signals that the information in this sentence—that  tadpole shrimp embryos can pause development during extended periods of drought—exemplifies the  previous sentence’s claim that organisms have evolved surprising adaptations to survive in adverse  conditions.      Choice A is incorrect because “in contrast” illogically signals that the information in this sentence  contrasts with the claim about organisms in the previous sentence. Instead, it exemplifies this claim.  Choice C is incorrect because “meanwhile” illogically signals that the information in this sentence is  separate from (while occurring simultaneously with) the claim about organisms in the previous sentence.  Instead, it exemplifies this claim. Choice D is incorrect because “consequently” illogically signals that  the information in this sentence is a consequence, or result, of the claim about organisms in the previous  sentence. Instead, it exemplifies this claim."}, {"id": 69, "question": "In response to adverse environmental conditions, many plants produce abscisic acid (ABA), a stress  hormone. ABA triggers a slowdown in the biological processes of most plants. ______ when the  mustard plant Schrenkiella parvula produces ABA in response to an environmental stressor, the hormone  triggers accelerated growth.    Which choice completes the text with the most logical transition?", "options": {"A": "Moreover,", "B": "In contrast,", "C": "For example,", "D": "Thus,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “In contrast” logically signals that the information in this sentence—that  ABA triggers accelerated growth in the mustard plant Schrenkiella parvula—contrasts with the previous  information about ABA triggering a slowdown in most plants’ biological processes.    Choice A is incorrect because “moreover” illogically signals that the information in this sentence about  the mustard plant merely adds to the previous information about the effects of ABA. Instead, it contrasts  with that information. Choice C is incorrect because “for example” illogically signals that the  information in this sentence about the mustard plant provides an example consistent with the previous  information about the effects of ABA. Instead, it contrasts with that information.  Choice D is incorrect  because “thus” illogically signals that the information in this sentence about the mustard plant is a  consequence, or result, of the previous information about the effects of ABA. Instead, it contrasts with  that information."}, {"id": 70, "question": "By 1936, Spanish Romani dancer Carmen Amaya was known all over Spain for her powerful style  of flamenco dancing. However, in July of that year, the outbreak of the Spanish Civil War made it  difficult for her to perform in her home country. ______ Amaya left Spain to perform abroad, dancing  for audiences across North and South America.  Which choice completes the text with the most logical transition?", "options": {"A": "In comparison,", "B": "As a result,", "C": "First of all,", "D": "For example,"}, "correctAnswer": "B", "explanation": "Choice B is the best answer. “As a result” logically signals that the information in this sentence about  Amaya leaving Spain to perform abroad is a result of the previous information about the Spanish Civil  War.    Choice A is incorrect because “in comparison” illogically signals that the information in this sentence is  being compared to the previous information about the Spanish Civil War. Instead, Amaya leaving Spain  is a result of that war. Choice C is incorrect because “first of all” illogically signals that the information  in this sentence is the beginning of a sequence of events. Instead, Amaya leaving Spain is a result of the  event (the outbreak of war) described in the previous sentence. Choice D is incorrect because “for  example” illogically signals that the information in this sentence is an example supporting the previous  statement about the Spanish Civil War. Instead, Amaya leaving Spain is a result of that war."}, {"id": 71, "question": "“O2 Arena,” an award-winning science fiction story by Nigerian author Oghenechovwe Donald  Ekpeki, takes place in an alternate version of Nigeria where breathable air is a rare commodity that is  owned and sold by companies. ______ people must purchase it with currency called O2 credits.  Which choice completes the text with the most logical transition?", "options": {"A": "As a result,", "B": "In any case,", "C": "Nevertheless,", "D": "Earlier,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. The second sentence describes a consequence of the system laid out in the  first sentence: because air is owned and sold by companies in this world, people have to buy it.    Choice B is incorrect. This choice uses a transition that means “no matter what happens” or “whatever  the situation is,” which doesn’t make sense here. There’s only one situation described in the text: a  fictional world in which companies own all the breathable air, forcing people to buy it. Choice C is  incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with the  previous sentence. They both describe the same fictional situation. Choice D is incorrect. This choice  uses a transition that indicates a shift back in time, which doesn’t make sense here. Both sentences use  the present tense, as they’re describing the same fictional time period."}, {"id": 72, "question": "As biologist Terrie Williams has documented, deep dives present a challenge for seals and other  marine mammals. A seal must exert enough energy to propel itself hundreds of meters downward, while  keeping its heart rate low enough that it doesn’t run out of oxygen while underwater. ______ a seal  moves its flippers as little as possible on a deep dive, gliding to conserve energy.  Which choice completes the text with the most logical transition?", "options": {"A": "In the first place,", "B": "On the other hand,", "C": "For this reason,", "D": "In comparison,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “For this reason” logically signals that the behavior described in this  sentence is a consequence of the information about seals in the previous sentence. That is, a seal moves  its flippers as little as possible during a deep dive because it needs to keep its heart rate low enough that  it does not run out of oxygen.     Choice A is incorrect because “in the first place” illogically signals that this sentence is the first point in  a discussion. Instead, the sentence describes a behavior that is a consequence of the previous  information about seals.  Choice B is incorrect because “on the other hand” illogically signals that the  behavior described in this sentence contrasts with the previous information about seals. Instead, it is a  consequence of that information. Choice D is incorrect because “in comparison” illogically signals that  the behavior described in this sentence is being compared to the previous information about seals.  Instead, it is a consequence of that information."}, {"id": 73, "question": "In the early 1900s, Jovita Idár fought injustice on both sides of the Mexico–United States border. As  a reporter for the Texas newspaper La Crónica, she voiced support for the Mexican people’s revolt  against authoritarian rule. ______ she founded the League of Mexican Women, a group that advocated  for the rights of Mexican Americans.  Which choice completes the text with the most logical transition?", "options": {"A": "Additionally,", "B": "In conclusion,", "C": "For example,", "D": "Rather,"}, "correctAnswer": "A", "explanation": ""}, {"id": 74, "question": "To explore how blinking affects social interactions, Dutch researchers observed interactions  between human speakers and “listeners” (animated human faces on a screen). The researchers found that  when the listeners blinked slowly, the speakers tended to talk for less time. ______ quicker blinks were  associated with longer talking times.  Which choice completes the text with the most logical transition?", "options": {"A": "For example,", "B": "Specifically,", "C": "Firstly,", "D": "By contrast,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “By contrast” logically signals that the finding described in this sentence  contrasts with the finding described in the previous sentence. That is, quicker blinks were associated  with longer talking times, whereas slower blinks were associated with shorter talking times.     Choice A is incorrect because “for example” illogically signals that the finding described in this sentence  is an example of the finding described in the previous sentence. Instead, it contrasts with that finding.  Choice B is incorrect because “specifically” illogically signals that this sentence provides specific,  precise details about the finding described in the previous sentence. Instead, it presents information that  contrasts with that finding. Choice C is incorrect because “firstly” illogically signals that the finding  described in this sentence is a first point or occurs first in a chronological sequence of events. Instead, it  contrasts with the finding described in the previous sentence."}, {"id": 75, "question": "In November 1934, Amrita Sher-Gil was living in what must have seemed like the ideal city for a  young artist: Paris. She was studying firsthand the color-saturated style of France’s modernist masters  and beginning to make a name for herself as a painter. ______ Sher-Gil longed to return to her childhood  home of India; only there, she believed, could her art truly flourish.  Which choice completes the text with the most logical transition?", "options": {"A": "Still,", "B": "Therefore,", "C": "Indeed,", "D": "Furthermore,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Still” logically signals that the information about Sher-Gil in this  sentence—that she longed to leave Paris and return to India—contrasts with what one would expect after  reading about Sher-Gil’s experiences in Paris in the previous sentences.     Choice B is incorrect because “therefore” illogically signals that the information about Sher-Gil in this  sentence is a result or consequence of the descriptions in the previous sentences. Instead, this  information contrasts with what one would expect after reading about Sher-Gil’s experiences in Paris.  Choice C is incorrect because “indeed” illogically signals that the information about Sher-Gil in this  sentence offers additional emphasis in support of the descriptions in the previous sentences. Instead, this  information contrasts with what one would expect after reading about Sher-Gil’s experiences in Paris.  Choice D is incorrect because “furthermore” illogically signals that the information about Sher-Gil in  this sentence offers additional support for or confirmation of the descriptions in the previous sentences.  Instead, this information contrasts with what one would expect after reading about Sher-Gil’s  experiences in Paris."}, {"id": 76, "question": "In 1885, Chinese-born California resident Mary Tape became a hero of the Asian American civil  rights movement. In January of that year, she won an antidiscrimination case in the California Supreme  Court. ______ in April, she wrote an open letter criticizing her local board of education for  discrimination. Both actions are remembered today as historic stands against racism.  Which choice completes the text with the most logical transition?", "options": {"A": "Later,", "B": "For instance,", "C": "In other words,", "D": "Rather,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Later” logically signals that the letter-writing discussed in this sentence  occurred later in a chronological sequence of events than did the antidiscrimination case discussed in the  previous sentence.    Choice B is incorrect because “for instance” illogically signals that the letter-writing discussed in this  sentence is an example of the antidiscrimination case discussed in the previous sentence. Instead, the  letter-writing is an event that occurred after the court case. Choice C is incorrect because “in other  words” illogically signals that the letter-writing discussed in this sentence is a paraphrase or restatement  of the antidiscrimination case discussed in the previous sentence. Instead, the letter-writing is an event  that occurred after the court case. Choice D is incorrect because “rather” illogically signals that the  letter-writing discussed in this sentence is an alternative to the antidiscrimination case discussed in the  previous sentence. Instead, the letter-writing is an event that occurred after the court case."}, {"id": 77, "question": "When designing costumes for film, American artist Suttirat Larlarb typically custom fits the  garments to each actor. ______ for the film Sunshine, in which astronauts must reignite a dying Sun, she  designed a golden spacesuit and had a factory reproduce it in a few standard sizes; lacking a tailor-made  quality, the final creations reflected the ungainliness of actual spacesuits.  Which choice completes the text with the most logical transition?", "options": {"A": "Nevertheless,", "B": "Thus,", "C": "Likewise,", "D": "Moreover,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Nevertheless” logically signals that the information in this sentence—that  the spacesuits Suttirat Larlarb designed for the film Sunshine were made in standard sizes in a factory— presents a notable exception to Larlarb’s typical approach of custom-fitting garments to actors, which is  described in the previous sentence.     Choice B is incorrect because “thus” illogically signals that the information in this sentence is a result or  consequence of the previous information about Larlarb’s typical approach of custom-fitting garments to  actors. Instead, it presents a notable exception to Larlarb’s typical approach. Choice C is incorrect  because “likewise” illogically signals that the information in this sentence is similar to the previous  information about Larlarb’s typical approach of custom-fitting garments to actors. Instead, it presents a  notable exception to Larlarb’s typical approach. Choice D is incorrect because “moreover” illogically  signals that the information in this sentence merely adds to the previous information about Larlarb’s  typical approach of custom-fitting garments to actors. Instead, it presents a notable exception to  Larlarb’s typical approach."}, {"id": 78, "question": "During a 2021 launch, Rocket Labs’ Electron rocket experienced an unexpected failure: its second- stage booster shut down suddenly after ignition. ______ instead of downplaying the incident, Rocket  Labs’ CEO publicly acknowledged what happened and apologized for the loss of the rocket’s payload,  which had consisted of two satellites.  Which choice completes the text with the most logical transition?", "options": {"A": "Afterward,", "B": "Additionally,", "C": "Indeed,", "D": "Similarly,"}, "correctAnswer": "A", "explanation": "Choice A is the best answer. “Afterward” logically signals that the events described in this sentence—the  CEO’s public acknowledgment and apology—occurred after the rocket booster’s failure and are part of a  chronological sequence of events.    Choice B is incorrect because “additionally” illogically signals that the events described in this sentence  merely occurred in addition to the rocket booster’s failure. Instead, they occurred after the rocket  booster’s failure and are part of a chronological sequence of events. Choice C is incorrect because  “indeed” illogically signals that the events described in this sentence emphasize or strengthen a  statement made in the previous sentence. Instead, they occurred after the rocket booster’s failure and are  part of a chronological sequence of events. Choice D is incorrect because “similarly” illogically signals  that the events described in this sentence are similar to the rocket booster’s failure. Instead, they  occurred after the rocket booster’s failure and are part of a chronological sequence of events."}, {"id": 79, "question": "In 1891, dancer and choreographer Loie Fuller first performed her celebrated Serpentine Dance,  artfully twirling her long, flowing skirt to create striking visual effects. ______ in 1896, cinema pioneers  Auguste and Louis Lumière made a groundbreaking short film of Fuller’s dance.   Which choice completes the text with the most logical transition?", "options": {"A": "However,", "B": "In conclusion,", "C": "Later,", "D": "In other words,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “Later” logically signals that the event discussed in this sentence—the  creation of the short film featuring Fuller’s dance—is a related event that occurred after the event  discussed in the previous sentence (the 1891 debut of the dance).    Choice A is incorrect because “however” illogically signals that the information in this sentence  contrasts with the information in the previous sentence. Instead, the creation of the short film is a related  event that followed the event discussed in the previous sentence. Choice B is incorrect because “in  conclusion” illogically signals that the information in this sentence concludes or summarizes the  information in the previous sentence. Instead, the creation of the short film is a related event that  followed the event discussed in the previous sentence. Choice D is incorrect because “in other words”  illogically signals that the information in this sentence is a paraphrase or restatement of the information  in the previous sentence. Instead, the creation of the short film is a related event that followed the event  discussed in the previous sentence."}, {"id": 80, "question": "Phytoplankton play a crucial role in the ocean’s uptake of carbon from the atmosphere. When alive,  these tiny marine organisms absorb atmospheric carbon via photosynthesis. ______ after they die, the  phytoplankton sink to the seafloor, where the carbon in their cells gets stored in sediment, preventing it  from cycling back into the atmosphere.  Which choice completes the text with the most logical transition?", "options": {"A": "Specifically,", "B": "By contrast,", "C": "Nevertheless,", "D": "Then,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “Then” logically signals that the event described in this sentence—carbon  in phytoplankton cells being trapped in sediment after the organisms have died—occurs later in a  chronological sequence than the event described in the previous sentence (phytoplankton absorbing  carbon while alive).  Choice A is incorrect because “specifically” illogically signals that the information that follows provides  specific, precise details elaborating on the previous information about what phytoplankton do when  alive. Instead, this sentence explains what happens after phytoplankton die—a later step in the  chronological sequence of events. Choice B is incorrect because “by contrast” illogically signals that the  information that follows contrasts with the previous information about what phytoplankton do when  alive. Instead, this sentence explains what happens after phytoplankton die—a later step in the  chronological sequence of events. There is no contrast: in both life and death, phytoplankton contribute  to the ocean’s carbon uptake. Choice C is incorrect because “nevertheless” illogically signals that the  information that follows is in spite of the previous information about what phytoplankton do when alive.  Instead, this sentence explains what happens after phytoplankton die—a later step in the chronological  sequence of events. There is no contrast: in both life and death, phytoplankton contribute to the ocean’s  carbon uptake."}, {"id": 81, "question": "Riley Black—the author of critically acclaimed books such as My Beloved Brontosaurus (2013)—is  best known for writing about dinosaurs, but she has also conducted hands-on fieldwork. ______ her  fieldwork has included paleontological digs in Utah, Montana, and Wyoming, and her dinosaur fossil  discoveries can be seen at places such as the Carnegie Museum of Natural History.  Which choice completes the text with the most logical transition?", "options": {"A": "Regardless,", "B": "Subsequently,", "C": "Specifically,", "D": "Conversely,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. The second sentence provides more specific information about the  fieldwork mentioned in the first sentence—that the paleontological digs took place in Utah, Montana,  and Wyoming. Therefore, “specifically” fits perfectly in this context.    Choice A is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree with  the previous sentence. Rather, this sentence agrees with and elaborates on the last sentence by providing  more specifics about the fieldwork Black does. Choice B is incorrect. This choice uses a transition that  indicates that an event took place after another event. But the two sentences are not describing different  events—instead, this sentence gives more details about the fieldwork discussed in the first sentence.  Choice D is incorrect. This choice uses a disagreement transition. But this sentence doesn’t disagree  with the previous sentence. Rather, this sentence agrees with and elaborates on the last sentence by  providing more specifics about the fieldwork Black does."}, {"id": 82, "question": "The Sun and other stars are powered by nuclear fusion reactions, in which two atoms collide to  form a single heavier atom, releasing energy. Scientists have long believed that fusion has the potential  to meet humanity’s clean energy needs. ______ prior to December 2022, no fusion reaction in a  laboratory setting had ever generated a net energy gain.  Which choice completes the text with the most logical transition?", "options": {"A": "For this reason,", "B": "Moreover,", "C": "Specifically,", "D": "That said,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. Scientists believe in fusion’s potential as an energy source, but have  struggled to actually make it work—in other words, there is a contradiction between scientists’ beliefs  and their reality. “That said” is a disagreement transition that works perfectly in this context.    Choice A is incorrect. This choice uses a cause-and-effect transition, which doesn’t make sense here.  Scientists not being able to generate extra energy from lab fusion reactions isn’t an effect of them  believing in fusion’s potential. Choice B is incorrect. This transition indicates the addition of another  supporting point. But this sentence is not adding a supporting point to the previous sentence—scientists  not being able to successfully generate energy from fusion isn’t another point in favor of fusion meeting  humanity’s clean energy needs. Choice C is incorrect. This choice uses a transition that introduces or  elaborates on a particular example. But this sentence doesn’t give an example of scientists’ belief in  fusion’s potential to meet humanity’s clean energy needs—in fact, it contrasts that optimistic belief with  the reality of past failures to successfully employ fusion for energy production."}, {"id": 83, "question": "“Wishcycling”—putting nonrecyclable items into recycling bins under the mistaken belief that  those items can be recycled—ultimately does more harm than good. Nonrecyclable items, such as greasy  pizza boxes, can contaminate recyclable materials, rendering entire batches unusable. ______  nonrecyclable products can damage recycling plants’ machinery.   Which choice completes the text with the most logical transition?", "options": {"A": "Fittingly,", "B": "On the contrary,", "C": "Moreover,", "D": "Nevertheless,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. The first sentence tells us that “wishcycling” is harmful, the previous  sentence gives us an example, and this sentence gives us another example. So “moreover”—a transition  that indicates the addition of another supporting point—fits perfectly here.    Choice A is incorrect. This choice uses a transition that means “appropriately” or “suitably,” which  doesn’t make sense in context. This sentence adds another example of how “wishcycling” is harmful, so  we’re looking for an addition transition. Choice B is incorrect. This choice uses a disagreement  transition. But this sentence actually agrees with the previous sentence. Both provide examples of how  “wishcycling” is harmful. Choice D is incorrect. This choice uses a disagreement transition. But this  sentence actually agrees with the previous sentence. Both provide examples of how “wishcycling” is  harmful."}, {"id": 84, "question": "At two weeks old, the time their critical socialization period begins, wolves can smell but cannot yet  see or hear. Domesticated dogs, ______ can see, hear, and smell by the end of two weeks. This relative  lack of sensory input may help explain why wolves behave so differently around humans than dogs do:  from a very young age, wolves are more wary and less exploratory.  Which choice completes the text with the most logical transition?", "options": {"A": "in other words,", "B": "for instance,", "C": "by contrast,", "D": "accordingly,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “By contrast” logically signals that the information in this sentence—that  dogs can see, hear, and smell by the end of two weeks—contrasts with the preceding information (that  wolves can smell but not see or hear at the same age).    Choice A is incorrect because “in other words” illogically signals that the information about  domesticated dogs in this sentence paraphrases the information about wolves in the previous sentence.  Instead, the information about dogs contrasts with what came before. Choice B is incorrect because “for  instance” illogically signals that the information about domesticated dogs in this sentence exemplifies  the information about wolves in the previous sentence. Instead, the information about dogs contrasts  with what came before. Choice D is incorrect because “accordingly” illogically signals that the  information about domesticated dogs in this sentence is in accordance with, or results from, the  information about wolves in the previous sentence. Instead, the information about dogs contrasts with  what came before."}, {"id": 85, "question": "To discover which fruit varieties were grown in Italy’s Umbria region before the introduction of  industrial farming, botanist Isabella Dalla Ragione often turns to centuries-old lists of cooking  ingredients. ______ she analyzes Renaissance paintings of Umbria, as they can provide accurate  representations of fruits that were grown there long ago.  Which choice completes the text with the most logical transition?", "options": {"A": "In sum,", "B": "Instead,", "C": "Thus,", "D": "Additionally,"}, "correctAnswer": "D", "explanation": "Choice D is the best answer. “Additionally” logically signals that the painting analysis discussed in this  sentence is an additional part of the botany research discussed in the previous sentence. That is, to  research which fruits Umbrians grew in the past, the botanist analyzes old paintings in addition to  looking at old lists of ingredients.     Choice A is incorrect because “in sum” illogically signals that the painting analysis discussed in this  sentence is a concluding summary of the botany research discussed in the previous sentence. Instead, the  painting analysis is an additional part of that research. Choice B is incorrect because “instead” illogically  signals that the painting analysis discussed in this sentence is an alternative to the botany research  discussed in the previous sentence. Rather, the painting analysis is an additional part of that research.  Choice C is incorrect because “thus” illogically signals that the painting analysis discussed in this  sentence is a result of the botany research discussed in the previous sentence. Instead, the painting  analysis is an additional part of that research."}, {"id": 86, "question": "Laetitia Ky’s hair is her art. Inspired by hairstyles from various African tribes, the Ivorian artist uses  wire and thread to sculpt her hair into all kinds of shapes. ______ she once made her hair into the shape  of the continent of Africa—including the island of Madagascar!  Which choice completes the text with the most logical transition?", "options": {"A": "Soon,", "B": "Elsewhere,", "C": "For example,", "D": "However,"}, "correctAnswer": "C", "explanation": "Choice C is the best answer. “For example” logically signals that the following information about Ky— that she once shaped her hair to look like Africa—is an example supporting the previous statement that  she makes different shapes with her hair.    Choice A is incorrect because “soon” illogically signals that the event described in this sentence  occurred soon after the statement about Ky making different shapes with her hair. Instead, the sentence  provides an example of one of these shapes. Choice B is incorrect because “elsewhere” illogically  signals that the event described in this sentence occurred in a different place than the statement about Ky  making different shapes with her hair. Instead, the sentence provides an example of one of these shapes.  Choice D is incorrect because “however” illogically signals that the information in this sentence  contrasts with the statement that Ky makes different shapes with her hair. Instead, the sentence provides  an example of one of these shapes."}];
 const quizContainer = document.getElementById('quiz');
    let currentScore = 0;
    let answeredCount = 0;
    const totalQuestions = quizData.length;

    // 🕒 GHI NHẬN THỜI GIAN BẮT ĐẦU LÀM BÀI
    const startTime = new Date();

    const STUDENT_ID = sessionStorage.getItem('studentId') || sessionStorage.getItem('studentName') || 'guest';
    const QUIZ_STORAGE_KEY = `quiz_draft_${STUDENT_ID}_${document.title}`;

    function buildQuiz() {
        quizContainer.innerHTML = '';
        
        // 📌 1. TỰ ĐỘNG TẠO HỘP NAVIGATOR CHỌN CÂU CỐ ĐỊNH GÓC PHẢI
        createNavigatorBox();

        quizData.forEach((data, index) => {
            const questionBlock = document.createElement('div');
            questionBlock.classList.add('question-block');
            questionBlock.id = `question-${data.id}`;
            questionBlock.dataset.locked = "false";
            questionBlock.style.scrollMarginTop = "80px";

            let optionsHtml = '';
            for (const [key, value] of Object.entries(data.options)) {
                optionsHtml += `
                    <li>
                        <label id="label-${data.id}-${key}">
                            <input type="radio" name="question${data.id}" value="${key}">
                            <strong>${key}.</strong> ${value}
                        </label>
                    </li>
                `;
            }

            questionBlock.innerHTML = `
                <div class="question-text">Câu ${index + 1}: ${data.question}</div>
                <ul class="options">
                    ${optionsHtml}
                </ul>
                <div class="explanation" id="explanation-${data.id}">${data.explanation}</div>
            `;
            quizContainer.appendChild(questionBlock);
        });
        
        // Lắng nghe sự kiện chọn đáp án để lưu bản nháp & đổi màu Navigator
        quizContainer.addEventListener('change', (e) => {
            saveProgress();
            updateNavigatorState();
        });
        
        const progressEl = document.getElementById('progressText');
        if (progressEl) progressEl.innerText = `0/${totalQuestions}`;
    }

    // 🛠️ HÀM TẠO HỘP NAVIGATOR DẠNG LƯỚI
    function createNavigatorBox() {
        let oldBox = document.getElementById('quizNavBox');
        if (oldBox) oldBox.remove();

        const navBox = document.createElement('div');
        navBox.id = 'quizNavBox';
        navBox.style.cssText = `
            position: fixed; top: 20px; right: 20px; width: 210px; max-height: 75vh;
            background: #ffffff; border: 2px solid #3498db; border-radius: 10px; padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 9999; overflow-y: auto;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        `;

        const title = document.createElement('div');
        title.innerText = '📌 Danh Sách Câu Hỏi';
        title.style.cssText = 'font-weight: bold; color: #2c3e50; font-size: 0.9em; text-align: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 5px;';
        navBox.appendChild(title);

        const grid = document.createElement('div');
        grid.style.cssText = 'display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;';

        quizData.forEach((data, index) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.id = `nav_btn_${data.id}`;
            btn.innerText = index + 1;
            btn.style.cssText = `
                width: 100%; height: 32px; border: 1px solid #bdc3c7; background: #f8f9fa;
                color: #2c3e50; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em;
            `;

            btn.onclick = () => {
                const targetBlock = document.getElementById(`question-${data.id}`);
                if (targetBlock) targetBlock.scrollIntoView({ behavior: 'smooth' });
            };
            grid.appendChild(btn);
        });

        navBox.appendChild(grid);
        document.body.appendChild(navBox);
    }

    // 🔄 ĐỔI MÀU Ô NAVIGATOR KHI ĐÃ CHỌN CÂU HỎI
    function updateNavigatorState() {
        quizData.forEach((data) => {
            const selected = document.querySelector(`input[name="question${data.id}"]:checked`);
            const btn = document.getElementById(`nav_btn_${data.id}`);
            if (btn && selected) {
                btn.style.background = '#2ecc71';
                btn.style.color = '#ffffff';
                btn.style.borderColor = '#27ae60';
            }
        });
    }

    function saveProgress() {
        let userAnswers = {};
        quizData.forEach(data => {
            const selectedOption = document.querySelector(`input[name="question${data.id}"]:checked`);
            if (selectedOption) {
                userAnswers[data.id] = selectedOption.value;
            }
        });
        localStorage.setItem(QUIZ_STORAGE_KEY, JSON.stringify(userAnswers));
    }

    function checkAndRestoreProgress() {
        const savedDraft = localStorage.getItem(QUIZ_STORAGE_KEY);
        if (!savedDraft) return;

        const userAnswers = JSON.parse(savedDraft);
        const count = Object.keys(userAnswers).length;

        if (count > 0) {
            const confirmResume = confirm(
                `Em đang làm dở ${count}/${totalQuestions} câu ở lần trước.\n\n` +
                `• Bấm [OK] để LÀM TIẾP bài đang dở.\n` +
                `• Bấm [Hủy (Cancel)] để LÀM LẠI TỪ ĐẦU.`
            );

            if (confirmResume) {
                let lastAnsweredId = null;
                Object.entries(userAnswers).forEach(([qId, value]) => {
                    const radio = document.querySelector(`input[name="question${qId}"][value="${value}"]`);
                    if (radio) {
                        radio.checked = true;
                        lastAnsweredId = qId;
                    }
                });

                updateNavigatorState();

                if (lastAnsweredId) {
                    const targetBlock = document.getElementById(`question-${lastAnsweredId}`);
                    if (targetBlock) {
                        targetBlock.scrollIntoView({ behavior: 'smooth' });
                    }
                }
            } else {
                localStorage.removeItem(QUIZ_STORAGE_KEY);
            }
        }
    }

    function checkCurrentAnswers() {
        let checkedAny = false;

        quizData.forEach(data => {
            const block = document.getElementById(`question-${data.id}`);
            if (block.dataset.locked === "true") return;

            const selectedOption = document.querySelector(`input[name="question${data.id}"]:checked`);
            
            if (selectedOption) {
                checkedAny = true;
                const userAnswer = selectedOption.value;
                const correctAnswer = data.correctAnswer;
                
                if (userAnswer === correctAnswer) {
                    document.getElementById(`label-${data.id}-${userAnswer}`).classList.add('correct-answer-label');
                    currentScore++;
                } else {
                    document.getElementById(`label-${data.id}-${userAnswer}`).classList.add('wrong-answer-label');
                    document.getElementById(`label-${data.id}-${correctAnswer}`).classList.add('correct-answer-label');
                }

                const explanationEl = document.getElementById(`explanation-${data.id}`);
                if (explanationEl) explanationEl.style.display = 'block';

                const radios = document.querySelectorAll(`input[name="question${data.id}"]`);
                radios.forEach(radio => radio.disabled = true);
                block.dataset.locked = "true";
                
                answeredCount++;
            }
        });

        if (!checkedAny) {
            alert('Bạn chưa chọn đáp án nào để kiểm tra!');
        } else {
            updateScoreBoard();
            
            // 📊 2. LƯU DỮ LIỆU CHI TIẾT SANG DÀNH CHO ADMIN
            saveAdminResultData();

            if (typeof saveScoreToFirebase === 'function') {
                saveScoreToFirebase(currentScore, answeredCount);
            }

            if (answeredCount === totalQuestions) {
                alert(`Chúc mừng! Bạn đã hoàn thành toàn bộ ${totalQuestions} câu hỏi. Tổng điểm: ${currentScore}/${totalQuestions}.`);
                localStorage.removeItem(QUIZ_STORAGE_KEY);
            }
        }
    }

    // 📤 HÀM TỔNG HỢP & GỬI DỮ LIỆU KẾT QUẢ SANG TRANG ADMIN
    function saveAdminResultData() {
        const endTime = new Date();
        const durationSec = Math.round((endTime - startTime) / 1000);
        const durationMin = (durationSec / 60).toFixed(1);

        const quizTitle = document.title || 'Bài tập SAT';
        let studentAnswers = {};

        quizData.forEach((data, index) => {
            const selected = document.querySelector(`input[name="question${data.id}"]:checked`);
            studentAnswers[`Câu ${index + 1}`] = selected ? selected.value : 'Bỏ trống';
        });

        let history = JSON.parse(localStorage.getItem('sat_results') || '[]');
        const attemptCount = history.filter(h => h.studentName === STUDENT_ID && h.quizTitle === quizTitle).length + 1;

        const resultData = {
            id: Date.now(),
            studentName: STUDENT_ID,
            quizTitle: quizTitle,
            attempt: attemptCount,
            score: `${currentScore}/${totalQuestions}`,
            percentage: Math.round((currentScore / totalQuestions) * 100) + '%',
            answers: studentAnswers,
            startTime: startTime.toLocaleTimeString('vi-VN') + ' ' + startTime.toLocaleDateString('vi-VN'),
            endTime: endTime.toLocaleTimeString('vi-VN') + ' ' + endTime.toLocaleDateString('vi-VN'),
            duration: `${durationMin} phút (${durationSec}s)`
        };

        history.push(resultData);
        localStorage.setItem('sat_results', JSON.stringify(history));

        // Bắn dữ liệu ra ngoài iframe nếu có
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'SAT_SUBMIT_RESULT', data: resultData }, '*');
        }
    }

    function resetQuiz() {
        if (!confirm('Bạn có muốn làm lại từ đầu không?')) return;
        
        currentScore = 0;
        answeredCount = 0;
        
        localStorage.removeItem(QUIZ_STORAGE_KEY);
        
        quizData.forEach(data => {
            const block = document.getElementById(`question-${data.id}`);
            if (block) {
                block.dataset.locked = "false";
                
                const radios = document.querySelectorAll(`input[name="question${data.id}"]`);
                radios.forEach(radio => {
                    radio.disabled = false;
                    radio.checked = false;
                });

                const explanationEl = document.getElementById(`explanation-${data.id}`);
                if (explanationEl) explanationEl.style.display = 'none';
                
                for (const key of Object.keys(data.options)) {
                    const lbl = document.getElementById(`label-${data.id}-${key}`);
                    if (lbl) {
                        lbl.classList.remove('correct-answer-label', 'wrong-answer-label');
                    }
                }

                // Đặt lại màu ô Navigator
                const navBtn = document.getElementById(`nav_btn_${data.id}`);
                if (navBtn) {
                    navBtn.style.background = '#f8f9fa';
                    navBtn.style.color = '#2c3e50';
                    navBtn.style.borderColor = '#bdc3c7';
                }
            }
        });
        
        updateScoreBoard();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateScoreBoard() {
        const progressEl = document.getElementById('progressText');
        const scoreEl = document.getElementById('scoreText');
        if (progressEl) progressEl.innerText = `${answeredCount}/${totalQuestions}`;
        if (scoreEl) scoreEl.innerText = currentScore;
    }

    document.getElementById('checkBtn').addEventListener('click', checkCurrentAnswers);
    document.getElementById('resetBtn').addEventListener('click', resetQuiz);

    buildQuiz();
    checkAndRestoreProgress();
</script>
