<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Lý Chi Tiết Kết Quả SAT</title>
    <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; font-size: 14px; }
    .admin-container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-top: 0; font-size: 1.5em; }
    
    .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
    .stat-card { flex: 1; background: #eef6fc; padding: 12px 18px; border-radius: 8px; border-left: 4px solid #3498db; }
    .stat-card div:first-child { font-size: 0.8em; color: #666; font-weight: bold; text-transform: uppercase; }
    .stat-card div:last-child { font-size: 1.5em; font-weight: bold; color: #2c3e50; margin-top: 2px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: auto; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e1e8ed; vertical-align: middle; }
    th { background: #f8f9fa; color: #2c3e50; font-weight: 600; font-size: 0.9em; white-space: nowrap; }
    tr:hover { background: #f1f7fc; }

    /* Cân chỉnh lại kích thước các thẻ hiển thị */
    .badge-score { background: #e8f8f5; color: #27ae60; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85em; white-space: nowrap; display: inline-block; }
    
    /* SỬA LỖI HỘP "LƯỢT LÀM": Dùng inline-flex và white-nowrap để không bị vỡ/xuống dòng */
    .badge-attempt { 
        background: #fef9e7; 
        color: #d35400; 
        padding: 4px 8px; 
        border-radius: 4px; 
        font-weight: bold; 
        border: 1px solid #fecd56; 
        font-size: 0.85em;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
    }

    .badge-id { background: #f8f9fa; color: #7f8c8d; padding: 2px 6px; border-radius: 4px; border: 1px solid #ddd; font-size: 0.75em; display: inline-block; margin-top: 3px; }
    
    /* Sửa nút bấm nhỏ gọn lại */
    .btn-detail { background: #3498db; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8em; white-space: nowrap; }
    .btn-detail:hover { background: #2980b9; }

    /* Modal Chi Tiết Bài Làm */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 20px; border-radius: 10px; position: relative; }
    .close-btn { position: absolute; top: 12px; right: 18px; font-size: 22px; cursor: pointer; font-weight: bold; color: #888; }
    .answer-row { padding: 8px 12px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #eee; background: #fafafa; font-size: 0.9em; }
    .status-correct { color: #27ae60; font-weight: bold; }
    .status-wrong { color: #e74c3c; font-weight: bold; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWAaxOqQHJQTFjp2hxkWwDCSvagb6KvSg",
            authDomain: "saturnifyllm.firebaseapp.com",
            projectId: "saturnifyllm",
            storageBucket: "saturnifyllm.firebasestorage.app",
            messagingSenderId: "679587062435",
            appId: "1:679587062435:web:f10555b0cbbdb9fb89d516",
            measurementId: "G-YV0NEJKNNH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const resultsTable = document.getElementById('resultsBody');
        const totalSubmissionsEl = document.getElementById('totalSubmissions');
        const totalStudentsEl = document.getElementById('totalStudents');

        let globalDataStore = {};

        const q = query(collection(db, "results"), orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            resultsTable.innerHTML = '';

            if (snapshot.empty) {
                resultsTable.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px; color: #888;">Chưa có lượt nộp bài nào trên hệ thống.</td></tr>';
                totalSubmissionsEl.innerText = '0';
                totalStudentsEl.innerText = '0';
                return;
            }

            totalSubmissionsEl.innerText = snapshot.size;
            const uniqueStudents = new Set();
            const studentAttemptTracker = {};

            // Chuyển dữ liệu sang Mảng để tính toán lượt làm (Lần 1, Lần 2...)
            const rawDocs = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));

            // Sắp xếp xuôi thời gian để đếm lượt chính xác
            const sortedAsc = [...rawDocs].sort((a, b) => {
                const tA = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp || 0);
                const tB = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp || 0);
                return tA - tB;
            });

            // Gán số lượt làm bài
            sortedAsc.forEach(item => {
                const trackerKey = `${item.name}_${item.quizTitle}`;
                studentAttemptTracker[trackerKey] = (studentAttemptTracker[trackerKey] || 0) + 1;
                item.attemptNumber = studentAttemptTracker[trackerKey];
            });

            // Đưa lại thứ tự mới nhất lên đầu
            rawDocs.reverse().forEach(data => {
                globalDataStore[data.docId] = data;
                if (data.name) uniqueStudents.add(data.name);

                const scoreText = (data.score !== undefined && data.total) 
                    ? `${data.score}/${data.total} (${data.percentage || Math.round((data.score / data.total) * 100) + '%'})`
                    : `${data.score || 0} điểm`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <strong>${escapeHtml(data.name || 'Học sinh')}</strong>
                        <br><span class="badge-id">ID: ${escapeHtml(data.id || 'N/A')}</span>
                    </td>
                    <td>${escapeHtml(data.quizTitle || 'Bài tập')}</td>
                    <td><span class="badge-attempt">Lần ${data.attemptNumber}</span></td>
                    <td><span class="badge-score">${scoreText}</span></td>
                    <td><small><b>Bắt đầu:</b> ${data.startTime || 'N/A'}<br><b>Kết thúc:</b> ${data.endTime || 'N/A'}</small></td>
                    <td><small>${data.duration || 'N/A'}</small></td>
                    <td>
                        <button class="btn-detail" onclick="openDetail('${data.docId}')">🔍 Xem Chi Tiết</button>
                    </td>
                `;
                resultsTable.appendChild(tr);
            });

            totalStudentsEl.innerText = uniqueStudents.size;
        }, (error) => {
            console.error("Lỗi Firestore:", error);
            resultsTable.innerHTML = `<tr><td colspan="7" style="color:red; text-align:center;">Lỗi kết nối: ${error.message}</td></tr>`;
        });

        // Hàm mở Popup Chi Tiết Bài Làm
        window.openDetail = function(docId) {
            const record = globalDataStore[docId];
            if (!record) return;

            document.getElementById('modalStudent').innerText = `${record.name} (Lần ${record.attemptNumber})`;
            document.getElementById('modalQuiz').innerText = record.quizTitle;
            document.getElementById('modalTime').innerText = `Làm từ ${record.startTime || 'N/A'} đến ${record.endTime || 'N/A'} (Tổm thời gian: ${record.duration || 'N/A'})`;

            const listContainer = document.getElementById('modalAnswersList');
            listContainer.innerHTML = '';

            if (record.answers && Object.keys(record.answers).length > 0) {
                Object.entries(record.answers).forEach(([qNum, ans]) => {
                    let statusHtml = ans.isCorrect 
                        ? `<span class="status-correct">✓ ĐÚNG (Đã chọn: ${ans.userChoice})</span>`
                        : `<span class="status-wrong">✗ SAI (Đã chọn: ${ans.userChoice} | Đáp án đúng: ${ans.correctAnswer})</span>`;

                    const row = document.createElement('div');
                    row.className = 'answer-row';
                    row.innerHTML = `
                        <div style="font-weight:bold; margin-bottom: 4px;">${qNum}</div>
                        <div>${statusHtml}</div>
                    `;
                    listContainer.appendChild(row);
                });
            } else {
                listContainer.innerHTML = '<p style="color:#e74c3c; text-align:center;">Bài làm này thuộc phiên bản cũ (chưa lưu chi tiết câu hỏi).</p>';
            }

            document.getElementById('detailModal').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('detailModal').style.display = 'none';
        };

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</head>
<body>

<div class="admin-container">
    <h1>📊 Bảng Quản Lý Chi Tiết Kết Quả SAT</h1>

    <div class="stats-bar">
        <div class="stat-card">
            <div>TỔNG LƯỢT NỘP BÀI</div>
            <div id="totalSubmissions">0</div>
        </div>
        <div class="stat-card">
            <div>SỐ HỌC SINH ĐÃ LÀM</div>
            <div id="totalStudents">0</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Học Sinh</th>
                <th>Bài Kiểm Tra</th>
                <th>Lượt Làm</th>
                <th>Điểm Số</th>
                <th>Thời Gian (Bắt Đầu - Kết Thúc)</th>
                <th>Thời Gian Làm</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody id="resultsBody">
            <tr>
                <td colspan="7" style="text-align: center; color: #888;">Đang tải dữ liệu kết quả...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal xem chi tiết -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="margin-top:0; color:#2c3e50;">📋 Chi Tiết Bài Làm</h2>
        <p><strong>Học sinh:</strong> <span id="modalStudent"></span></p>
        <p><strong>Đề thi:</strong> <span id="modalQuiz"></span></p>
        <p style="font-size: 0.9em; color: #666;"><span id="modalTime"></span></p>
        <hr style="border:0; border-top:1px solid #eee; margin: 15px 0;">
        <div id="modalAnswersList"></div>
    </div>
</div>

</body>
</html>
