<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Lý Kết Quả SAT</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .admin-container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #1a2a3a; margin-bottom: 20px; border-bottom: 3px solid #3498db; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .stats-bar { display: flex; gap: 15px; margin-bottom: 25px; }
        .stat-card { flex: 1; background: #eef6fc; padding: 15px; border-radius: 8px; border-left: 5px solid #3498db; }
        .stat-card div:first-child { font-size: 0.85em; color: #666; text-transform: uppercase; font-weight: bold; }
        .stat-card div:last-child { font-size: 1.8em; font-weight: bold; color: #2c3e50; margin-top: 5px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e1e8ed; }
        th { background-color: #f8f9fa; color: #2c3e50; font-weight: 600; }
        tr:hover { background-color: #f1f7fc; }

        .badge-score { background: #e8f8f5; color: #27ae60; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-attempt { background: #fef9e7; color: #f39c12; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .btn-detail { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
        .btn-detail:hover { background: #2980b9; }

        /* Modal Chi Tiết Bài Làm */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; padding: 25px; border-radius: 10px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; font-weight: bold; color: #888; }
        .answer-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; }
        .status-correct { color: #27ae60; font-weight: bold; }
        .status-wrong { color: #e74c3c; font-weight: bold; }
        .status-empty { color: #7f8c8d; font-style: italic; }
    </style>

    <!-- FIREBASE SDK V9 MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWAaxOqQHJQTFjp2hxkWwDCSvagb6KvSg",
            authDomain: "saturnifyllm.firebaseapp.com",
            databaseURL: "https://saturnifyllm-default-rtdb.firebaseio.com",
            projectId: "saturnifyllm",
            storageBucket: "saturnifyllm.firebasestorage.app",
            messagingSenderId: "679587062435",
            appId: "1:679587062435:web:f10555b0cbbdb9fb89d516",
            measurementId: "G-YV0NEJKNNH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const resultsTable = document.getElementById('resultsBody');
        const totalSubmissionsEl = document.getElementById('totalSubmissions');
        const totalStudentsEl = document.getElementById('totalStudents');

        let globalDataStore = {};

        // Lắng nghe dữ liệu theo thời gian thực (Real-time Listener)
        const resultsRef = ref(db, 'sat_results');
        onValue(resultsRef, (snapshot) => {
            resultsTable.innerHTML = '';
            
            if (!snapshot.exists()) {
                resultsTable.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px; color: #888;">Chưa có lượt nộp bài nào trên hệ thống.</td></tr>';
                totalSubmissionsEl.innerText = '0';
                totalStudentsEl.innerText = '0';
                return;
            }

            const data = snapshot.val();
            globalDataStore = data;

            const itemsArray = Object.entries(data).map(([key, val]) => ({ id: key, ...val }));
            
            // Sắp xếp bài mới nộp lên đầu
            itemsArray.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            // Thống kê tổng quan
            totalSubmissionsEl.innerText = itemsArray.length;
            const uniqueStudents = new Set(itemsArray.map(item => item.studentName));
            totalStudentsEl.innerText = uniqueStudents.size;

            // Đổ dữ liệu vào Bảng
            itemsArray.forEach((item) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(item.studentName || 'Chưa rõ')}</strong></td>
                    <td>${escapeHtml(item.quizTitle || 'Bài SAT')}</td>
                    <td><span class="badge-attempt">Lần ${item.attempt || 1}</span></td>
                    <td><span class="badge-score">${item.score || '0/0'} (${item.percentage || '0%'})</span></td>
                    <td>${item.duration || 'N/A'}</td>
                    <td><small>${item.endTime || 'N/A'}</small></td>
                    <td>
                        <button class="btn-detail" onclick="showDetail('${item.id}')">Xem Chi Tiết</button>
                    </td>
                `;
                resultsTable.appendChild(tr);
            });
        }, (error) => {
            console.error("Lỗi khi tải kết quả:", error);
            resultsTable.innerHTML = `<tr><td colspan="7" style="text-align:center; color: red;">Lỗi đọc dữ liệu: ${error.message}</td></tr>`;
        });

        // Hàm mở Popup xem chi tiết các câu làm đúng/sai
        window.showDetail = function(keyId) {
            const record = globalDataStore[keyId];
            if (!record) return;

            document.getElementById('modalStudent').innerText = record.studentName || 'Học Sinh';
            document.getElementById('modalQuiz').innerText = record.quizTitle || 'Bài tập';
            
            const detailsContainer = document.getElementById('modalAnswersList');
            detailsContainer.innerHTML = '';

            if (record.answers) {
                Object.entries(record.answers).forEach(([qNum, ans]) => {
                    let statusHtml = '';
                    if (ans.status === 'correct') {
                        statusHtml = `<span class="status-correct">✓ Đúng (${ans.userChoice})</span>`;
                    } else if (ans.status === 'wrong') {
                        statusHtml = `<span class="status-wrong">✗ Sai (${ans.userChoice} - Đ.Án: ${ans.correctAnswer})</span>`;
                    } else {
                        statusHtml = `<span class="status-empty">- Bỏ trống</span>`;
                    }

                    const row = document.createElement('div');
                    row.className = 'answer-row';
                    row.innerHTML = `<span><strong>${qNum}:</strong></span> <span>${statusHtml}</span>`;
                    detailsContainer.appendChild(row);
                });
            } else {
                detailsContainer.innerHTML = '<p>Không có thông tin chi tiết từng câu.</p>';
            }

            document.getElementById('detailModal').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('detailModal').style.display = 'none';
        };

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</head>
<body>

<div class="admin-container">
    <h1>
        📊 Bảng Quản Lý Kết Quả SAT 
    </h1>

    <div class="stats-bar">
        <div class="stat-card">
            <div>Tổng Lượt Nộp Bài</div>
            <div id="totalSubmissions">0</div>
        </div>
        <div class="stat-card">
            <div>Số Học Sinh Đã Làm</div>
            <div id="totalStudents">0</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Tên Học Sinh</th>
                <th>Tên Bài Tập</th>
                <th>Lượt Thi</th>
                <th>Kết Quả</th>
                <th>Thời Gian Làm</th>
                <th>Thời Điểm Nộp</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody id="resultsBody">
            <tr>
                <td colspan="7" style="text-align: center; color: #888;">Đang kết nối dữ liệu Firebase...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal Chi Tiết Bài Làm -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="margin-top:0; color:#2c3e50;">Chi Tiết Bài Làm</h2>
        <p><strong>Học sinh:</strong> <span id="modalStudent"></span></p>
        <p><strong>Đề thi:</strong> <span id="modalQuiz"></span></p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        <div id="modalAnswersList"></div>
    </div>
</div>

</body>
</html>
