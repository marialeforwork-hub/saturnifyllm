<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Điểm Học Sinh</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f4f7f6; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #3498db; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .score-badge { font-weight: bold; color: #27ae60; background: #e8f8f5; padding: 4px 8px; border-radius: 4px; }
    </style>
    <script type="module">
        // Kiểm tra quyền Admin
if (sessionStorage.getItem('userRole') !== 'admin') {
    const adminPass = prompt("Trang này bảo mật. Nhập Passcode Admin:");
    if (adminPass !== "6868") {
        alert("Passcode không đúng!");
        window.location.href = "index.html";
    } else {
        sessionStorage.setItem('userRole', 'admin');
    }
}
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWAaxOqQHJQTFjp2hxkWwDCSvagb6KvSg",
            authDomain: "saturnifyllm.firebaseapp.com",
            projectId: "saturnifyllm",
            storageBucket: "saturnifyllm.firebasestorage.app",
            messagingSenderId: "679587062435",
            appId: "1:679587062435:web:f10555b0cbbdb9fb89d516"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lắng nghe dữ liệu real-time từ Firestore
        const q = query(collection(db, "results"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const tbody = document.getElementById('scoreTableBody');
            tbody.innerHTML = '';
            
            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Chưa có dữ liệu nộp bài.</td></tr>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString('vi-VN') : 'N/A';
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${data.name || 'Học sinh ẩn danh'}</strong></td>
                        <td>${data.id || 'N/A'}</td>
                        <td>${data.quizTitle || 'Bài kiểm tra'}</td>
                        <td><span class="score-badge">${data.score} / ${data.total}</span></td>
                        <td>${date}</td>
                    </tr>
                `;
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <h2>📊 Bảng Điểm Học Sinh (Cập nhật Thời gian thực)</h2>
        <table>
            <thead>
                <tr>
                    <th>Họ và Tên</th>
                    <th>Mã Học Sinh</th>
                    <th>Bài Kiểm Tra</th>
                    <th>Kết Quả</th>
                    <th>Thời Gian Nộp</th>
                </tr>
            </thead>
            <tbody id="scoreTableBody">
                <tr><td colspan="5" style="text-align:center;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
