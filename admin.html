<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACKING SATURNIFY</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; font-size: 14px; }
        .admin-container { max-width: 1250px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-top: 0; font-size: 1.5em; }
        
        .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #eef6fc; padding: 12px 18px; border-radius: 8px; border-left: 4px solid #3498db; }
        .stat-card div:first-child { font-size: 0.8em; color: #666; font-weight: bold; text-transform: uppercase; }
        .stat-card div:last-child { font-size: 1.5em; font-weight: bold; color: #2c3e50; margin-top: 2px; }

        /* Thanh Lọc Học Sinh */
        .filter-container { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e1e8ed; }
        .filter-box { display: flex; align-items: center; gap: 10px; }
        .filter-box label { font-weight: bold; color: #2c3e50; }
        .filter-box select { padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.95em; outline: none; background: white; cursor: pointer; }
        .filter-box select:focus { border-color: #3498db; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: auto; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e1e8ed; vertical-align: middle; }
        th { background: #f8f9fa; color: #2c3e50; font-weight: 600; font-size: 0.9em; white-space: nowrap; }
        tr:hover { background: #f1f7fc; }

        .badge-score { background: #e8f8f5; color: #27ae60; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85em; white-space: nowrap; display: inline-block; }
        .badge-total { background: #eef2ff; color: #4f46e5; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85em; white-space: nowrap; display: inline-block; border: 1px solid #c7d2fe; }
        .badge-attempt { 
            background: #fef9e7; color: #d35400; padding: 4px 8px; border-radius: 4px; font-weight: bold; 
            border: 1px solid #fecd56; font-size: 0.85em; white-space: nowrap; display: inline-flex; 
            align-items: center; justify-content: center; line-height: 1;
        }
        .badge-id { background: #f8f9fa; color: #7f8c8d; padding: 2px 6px; border-radius: 4px; border: 1px solid #ddd; font-size: 0.75em; display: inline-block; margin-top: 3px; }
        
        .action-btns { display: flex; gap: 6px; align-items: center; }
        .btn-detail { background: #3498db; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8em; white-space: nowrap; }
        .btn-detail:hover { background: #2980b9; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8em; white-space: nowrap; }
        .btn-delete:hover { background: #c0392b; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 20px; border-radius: 10px; position: relative; }
        .close-btn { position: absolute; top: 12px; right: 18px; font-size: 22px; cursor: pointer; font-weight: bold; color: #888; }
        .answer-row { padding: 8px 12px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #eee; background: #fafafa; font-size: 0.9em; }
        .status-correct { color: #27ae60; font-weight: bold; }
        .status-wrong { color: #e74c3c; font-weight: bold; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWAaxOqQHJQTFjp2hxkWwDCSvagb6KvSg",
            authDomain: "saturnifyllm.firebaseapp.com",
            projectId: "saturnifyllm",
            storageBucket: "saturnifyllm.firebasestorage.app",
            messagingSenderId: "679587062435",
            appId: "1:679587062435:web:f10555b0cbbdb9fb89d516",
            measurementId: "G-YV0NEJKNNH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const resultsTable = document.getElementById('resultsBody');
        const totalSubmissionsEl = document.getElementById('totalSubmissions');
        const totalStudentsEl = document.getElementById('totalStudents');
        const studentSelectEl = document.getElementById('studentSelect');

        let globalDataStore = {};
        let currentSortedDocs = [];
        let studentTotalCorrectMap = {};
        let studentTotalQuestionsMap = {};

        // Lắng nghe dữ liệu Realtime
        onSnapshot(collection(db, "results"), (snapshot) => {
            if (snapshot.empty) {
                resultsTable.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 20px; color: #888;">Chưa có lượt nộp bài nào trên hệ thống.</td></tr>';
                totalSubmissionsEl.innerText = '0';
                totalStudentsEl.innerText = '0';
                studentSelectEl.innerHTML = '<option value="all">-- Tất cả học sinh --</option>';
                return;
            }

            totalSubmissionsEl.innerText = snapshot.size;
            const uniqueStudents = new Set();
            const studentAttemptTracker = {};
            studentTotalCorrectMap = {};
            studentTotalQuestionsMap = {};

            const rawDocs = snapshot.docs.map(d => ({ docId: d.id, ...d.data() }));

            // 1. Sắp xếp xuôi thời gian để tính lượt làm bài & cộng dồn tổng điểm chính xác
            currentSortedDocs = [...rawDocs].sort((a, b) => {
                const tA = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp || 0);
                const tB = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp || 0);
                return tA - tB;
            });

            currentSortedDocs.forEach(item => {
                const displayName = item.name || item.studentName || 'Học sinh ẩn danh';
                item.displayName = displayName;
                uniqueStudents.add(displayName);

                // Tính tổng câu đúng tích lũy cho học sinh
                const scoreNum = Number(item.score) || 0;
                const totalNum = Number(item.total) || 0;
                studentTotalCorrectMap[displayName] = (studentTotalCorrectMap[displayName] || 0) + scoreNum;
                studentTotalQuestionsMap[displayName] = (studentTotalQuestionsMap[displayName] || 0) + totalNum;

                const quizKey = item.quizTitle || 'Bài tập';
                const trackerKey = `${displayName}_${quizKey}`;
                studentAttemptTracker[trackerKey] = (studentAttemptTracker[trackerKey] || 0) + 1;
                item.attemptNumber = studentAttemptTracker[trackerKey];
            });

            totalStudentsEl.innerText = uniqueStudents.size;

            // 2. Cập nhật danh sách Học sinh vào ô Filter
            const selectedVal = studentSelectEl.value || 'all';
            studentSelectEl.innerHTML = '<option value="all">-- Tất cả học sinh --</option>';
            Array.from(uniqueStudents).sort().forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                if (name === selectedVal) opt.selected = true;
                studentSelectEl.appendChild(opt);
            });

            // 3. Hiển thị bảng kết quả
            renderTable();
        }, (error) => {
            console.error("Lỗi Firestore:", error);
            resultsTable.innerHTML = `<tr><td colspan="8" style="color:red; text-align:center;">Lỗi kết nối Firebase: ${error.message}</td></tr>`;
        });

        // Hàm render dữ liệu ra bảng có lọc
        function renderTable() {
            resultsTable.innerHTML = '';
            const selectedStudent = studentSelectEl.value;

            // Lấy mảng từ mới nhất đến cũ nhất
            let displayList = [...currentSortedDocs].reverse();

            if (selectedStudent !== 'all') {
                displayList = displayList.filter(item => item.displayName === selectedStudent);
            }

            if (displayList.length === 0) {
                resultsTable.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 20px; color: #888;">Không tìm thấy bài làm nào của học sinh này.</td></tr>';
                return;
            }

            displayList.forEach(data => {
                globalDataStore[data.docId] = data;

                let scoreText = '0/0';
                if (data.score !== undefined) {
                    if (data.total) {
                        const pct = data.percentage || Math.round((data.score / data.total) * 100) + '%';
                        scoreText = `${data.score}/${data.total} (${pct})`;
                    } else {
                        scoreText = `${data.score}`;
                    }
                }

                // Tính tổng câu đúng tích lũy hiển thị
                const totalCorrect = studentTotalCorrectMap[data.displayName] || 0;
                const totalQuestions = studentTotalQuestionsMap[data.displayName] || 0;
                const totalText = totalQuestions > 0 ? `${totalCorrect}/${totalQuestions} câu` : `${totalCorrect} câu`;

                let timeDisplay = 'N/A';
                if (data.startTime && data.endTime) {
                    timeDisplay = `<b>Bắt đầu:</b> ${data.startTime}<br><b>Kết thúc:</b> ${data.endTime}`;
                } else if (data.timestamp) {
                    const dateObj = data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
                    timeDisplay = dateObj.toLocaleTimeString('vi-VN') + ' - ' + dateObj.toLocaleDateString('vi-VN');
                } else if (data.displayTime) {
                    timeDisplay = data.displayTime;
                }

                const durationDisplay = data.duration || 'N/A';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <strong>${escapeHtml(data.displayName)}</strong>
                        <br><span class="badge-id">ID: ${escapeHtml(data.id || 'N/A')}</span>
                    </td>
                    <td>${escapeHtml(data.quizTitle || 'Bài tập SAT')}</td>
                    <td><span class="badge-attempt">Lần ${data.attemptNumber}</span></td>
                    <td><span class="badge-score">${scoreText}</span></td>
                    <td><span class="badge-total">${totalText}</span></td>
                    <td><small>${timeDisplay}</small></td>
                    <td><small>${durationDisplay}</small></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-detail" onclick="openDetail('${data.docId}')">🔍 Chi Tiết</button>
                            <button class="btn-delete" onclick="deleteResult('${data.docId}', '${escapeHtml(data.displayName)}')">🗑️ Xóa</button>
                        </div>
                    </td>
                `;
                resultsTable.appendChild(tr);
            });
        }

        studentSelectEl.addEventListener('change', renderTable);

        window.deleteResult = async function(docId, studentName) {
            if (confirm(`Bạn có chắc muốn xóa bài làm của "${studentName}" không?`)) {
                try {
                    await deleteDoc(doc(db, "results", docId));
                    alert("Đã xóa thành công!");
                } catch (error) {
                    alert("Lỗi khi xóa: " + error.message);
                }
            }
        };

        window.openDetail = function(docId) {
            const record = globalDataStore[docId];
            if (!record) return;

            document.getElementById('modalStudent').innerText = `${record.displayName} (Lần ${record.attemptNumber})`;
            document.getElementById('modalQuiz').innerText = record.quizTitle || 'Bài tập SAT';
            
            let timeInfo = (record.startTime && record.endTime) 
                ? `Từ ${record.startTime} đến ${record.endTime} (${record.duration || ''})`
                : `Thời điểm nộp: ${record.displayTime || 'N/A'}`;
            
            document.getElementById('modalTime').innerText = timeInfo;

            const listContainer = document.getElementById('modalAnswersList');
            listContainer.innerHTML = '';

            if (record.answers && Object.keys(record.answers).length > 0) {
                Object.entries(record.answers).forEach(([qNum, ans]) => {
                    let statusHtml = (typeof ans === 'object')
                        ? (ans.isCorrect 
                            ? `<span class="status-correct">✓ ĐÚNG (Chọn: ${ans.userChoice})</span>`
                            : `<span class="status-wrong">✗ SAI (Chọn: ${ans.userChoice} | Đáp án: ${ans.correctAnswer})</span>`)
                        : `<span>Đáp án: ${ans}</span>`;

                    const row = document.createElement('div');
                    row.className = 'answer-row';
                    row.innerHTML = `<div style="font-weight:bold; margin-bottom:2px;">${qNum}</div><div>${statusHtml}</div>`;
                    listContainer.appendChild(row);
                });
            } else {
                listContainer.innerHTML = '<p style="color:#7f8c8d; text-align:center;">Bài làm này chưa lưu chi tiết đáp án.</p>';
            }

            document.getElementById('detailModal').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('detailModal').style.display = 'none';
        };

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</head>
<body>

<div class="admin-container">
    <h1>📊 Bảng Quản Lý Chi Tiết Kết Quả SAT</h1>

    <div class="stats-bar">
        <div class="stat-card">
            <div>TỔNG LƯỢT NỘP BÀI</div>
            <div id="totalSubmissions">0</div>
        </div>
        <div class="stat-card">
            <div>SỐ HỌC SINH ĐÃ LÀM</div>
            <div id="totalStudents">0</div>
        </div>
    </div>

    <!-- Thanh bộ lọc học sinh -->
    <div class="filter-container">
        <div class="filter-box">
            <label for="studentSelect">🎯 Lọc theo Học Sinh:</label>
            <select id="studentSelect">
                <option value="all">-- Tất cả học sinh --</option>
            </select>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Học Sinh</th>
                <th>Bài Kiểm Tra</th>
                <th>Lượt Làm</th>
                <th>Điểm Lần Này</th>
                <th>Tổng Đúng (In Total)</th>
                <th>Thời Gian Làm Bài</th>
                <th>Tổng Thời Gian</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody id="resultsBody">
            <tr>
                <td colspan="8" style="text-align: center; color: #888;">Đang tải dữ liệu...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal xem chi tiết -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="margin-top:0; color:#2c3e50;">📋 Chi Tiết Bài Làm</h2>
        <p><strong>Học sinh:</strong> <span id="modalStudent"></span></p>
        <p><strong>Đề thi:</strong> <span id="modalQuiz"></span></p>
        <p style="font-size: 0.85em; color: #666;"><span id="modalTime"></span></p>
        <hr style="border:0; border-top:1px solid #eee; margin: 15px 0;">
        <div id="modalAnswersList"></div>
    </div>
</div>

</body>
</html>
