eflect a lack of change in human behavior with regard to time and therefore would not support the researchers’ conclusion involving a shift in human behavior that occurred in response to the spread of electric lighting.",

ys at 14°C to about 5.5 days at 20°C, with no exceptions to this trend. The graph therefore shows that differences in temperature were associated with absolute differences in ripening time, not that there was no association between differences in temperature and differences in ripening time. Choice C is incorrect because the graph shows that ripening times of ethylene-treated bananas at 14°C and 16°C were about 8 and 6 days, respectively, which is greater than, not less than, ripening times of ethylene-treated bananas at 18°C and 20°C, which were about 5.5 and 4 days, respectively. In other words, bananas treated with ethylene ripen more slowly, not faster, at 14°C and 16°C than at 18°C and 20°C.",

    "question": "Mosasaurs were large marine reptiles that lived in the Late Cretaceous period, approximately 100 million to 66 million years ago. Celina Suarez, Alberto Pérez-Huer ta, and T. Lynn Harrell Jr. examined oxygen-18 isotopes in mosasaur tooth enamel in order to calculate likely mosasaur body temperatures and determined that mosasaurs were endothermic—that is, they used internal metabolic processes to maintain a stable body temperature in a variety of ambient temperatures. Suarez, Pérez-Huer ta, and Harrell claim that endothermy would have enabled mosasaurs to include relatively cold polar waters in their range. Which finding, if true, would most directly support Suarez, Pérez-Huer ta, and Harrell’s claim?",

 researchers’ claim. Seawater in the Late Cretaceous could have been warmer than seawater today but still cold enough for endothermy to be advantageous to mosasaurs, so this finding wouldn’t provide enough information to either support or weaken the researchers’ claim.",

    "question": "Linguist Deborah Tannen has cautioned against framing contentious issues in terms of two highly competitive perspectives, such as pro versus con. According to Tannen, this debate-driven approach can strip issues of their complexity and, when used in front of an audience, can be less informative than the presentation of multiple perspectives in a noncompetitive format. To test Tannen’s hypothesis, students conducted a study in which they showed participants one of three different versions of local news commentary about the same issue. Each version featured a debate between two commentators with opposing views, a panel of three commentators with various views, or a single commentator. Which finding from the students’ study, if true, would most strongly support Tannen’s hypothesis?",

nnen’s hypothesis says nothing about how informative single commentators are.",

    "question": "O Pioneers! is a 1913 novel by Willa Cather. In the novel, Cather depicts Alexandra Bergson as a person who takes comfort in understanding the world around her: ______ Which quotation from O Pioneers! most effectively illustrates the claim?",

    "question": "Neural networks are computer models intended to reflect the organization of human brains and are often used in studies of brain function. According to an analysis of 11,000 such networks, Rylan Schaeffer and colleagues advise caution when drawing conclusions about brains from observations of neural networks. They found that when attempting to mimic grid cells (brain cells used in navigation), while 90% of the networks could accomplish navigation-related tasks, only about 10% of those exhibited any behaviors similarto those of grid cells. But even this approximation of grid-cell activity has less to do with similarity between the neural networks and biological brains than it does with the rules programmed into the networks. Which finding, if true, would most directly support the claim in the underlined sentence?",

      "C": "Neural networks can often accomplish tasks that biological brains do, but they are typically programmed with rules to model multiple types of brain cells simultaneously.",

  },

    "question": "As media consumption has become increasingly multiplatform and socially mediated, active news acquisition has diminished in favor of an attitude known as “news finds me” (NFM), in which people passively rely on their social networks and ambient media environments for information about current events. Homero Gil de Zúñiga and Trevor Diehl examined data on a representative group of adults in the United States to determine participants’ strength of NFM attitude, political knowledge, and political interest. Although no major election took place sufficiently nearthe study for Gil de Zúñiga and Diehl to identify causality between NFM and voting behavior, they did posit that NFM may reduce voting probability through an indirect effect. Which finding, if true, would most directly support the idea advanced by Gil de Zúñiga and Diehl?",

ical knowledge increases, nothing in the text suggests that the researchers’ idea hinges on the size of people’s social networks.",

ercentage of their ULE driven by GDP growth per capita and a lower percentage driven by urban population growth. For Region 2, the percentage of ULE attributed to GDP growth per capita increased from 1970–2000 (between 10 and 15%) to 2000–2014 (between 45 and 50%), but the opposite is true for Region 1, which saw the percentage of ULE attributed to GDP growth per capita decline over the same period. Thus, whereas the data suggest governments in Region 2 became more efficient, the data for Region 1 suggest that those governments became less efficient, not more.",

    "question": "Declining fishing technology costs and overexploitation of near-shore fishing grounds have made isolated oceanic reefs, which often lack regulatory protections, increasingly attractive to commercial and sport fishers. A team led by Octavio Abur to-Oropeza surveyed the biomass density and species composition of two isolated reefs: Alacranes, a protected (fishing prohibited) reef 135 kilometers from the Yucatan Peninsula, and Bajos del Nor te, an unprotected reef 25 kilometers farther out to sea. Species at the highest level of the trophic pyramid constituted 34% of the biomass at Alacranes and 10% of the biomass at Bajos del Nor te. Abur to-Oropeza and colleagues attribute this difference to the two reefs’ difference in regulatory status. Which finding, if true, would most directly support Abur to-Oropeza and colleagues’ explanation?",

lacranes is a larger reef, with more units at that density. Choice B is incorrect because the finding that there are species at the highest trophic level (top predators) at Bajos del Nor te that aren’t found at Alacranes would reveal only that there are some different species in the reefs’ total biomasses (total mass of living organisms) but wouldn’t explain why that’s the case; this finding wouldn’t be clearly connected to the role of fishing regulations, which is what, according to the researchers, accounts for the reefs having different proportions of top predators in their total masses. Choice C is incorrect. To support the researchers’ claim that the role of fishing regulations accounts for Alacranes having a greater proportion of species at the highest trophic level (top predators) than Bajos del Nor te does, a finding would need to help explain how fishing affects the presence of top predator species in particular, but different costs of reaching the two reefs wouldn’t affect fishing behavior at all because fishing isn’t even allowed on one of the reefs.",

r ts from 2000 to 2006, and an indication of a change in that period that might be related to the availability of assets is needed to support the assertion that the situation of having limited capital resolved during the 2000s. Choice D is incorrect because the fact that processing impor ts with assembly were greater at the end of the period from 2000 to 2006 than processing impor ts with inputs were at the start of the same period doesn’t address a change within either type of impor ts during the period, and an indication of such a change that might be related to the availability of assets is needed to support the assertion that the situation of having limited capital resolved during the 2000s.",

    "question": "Having demonstrated that the power conversion efficiency of new perovskite photovoltaic cells is nearly indistinguishable from that of cells recycled multiple times, Xun Xiao and colleagues evaluated the levelized cost of electricity (LCOE)—a measure of cost per produced electricity unit that incorporates materials acquisition costs as well as operating costs—for power plants utilizing each type of cell. With a modeled 15-year cell lifetime, the LCOE of plants using new cells was 4.99 cents per kilowatt-hour, whereas that of plants using cells recycled three times was 4.05 cents per kilowatt-hour. Moreover, the LCOE differential grew from 18.8% to 31.3% when the modeled cell lifetime was reduced by two- thirds. Based on the text, which choice, if true, most coherently and directly accounts for the observation presented in the underlined sentence?",

 15-yeartimeline. This choice doesn’t indicate whether the increased cumulative costs in question are those of recycled-cell plants or both types of plants; either way, an increase in cumulative costs isn’t a coherent or direct explanation for why the difference in costs between new-cell plants and recycled-cell plants increases when the cell lifetime is reduced by two-thirds. A coherent and direct explanation for growth in the cost difference between the two types of plants must focus on a disparate effect on the plants’ costs; choice B, however, presents information that could be but is not necessarily relevant to a disparate effect and then doesn’t draw the relevant conclusion from it, instead drawing a conclusion about cumulative costs that doesn’t entail a growing differential. Choice D is incorrect because even if plant operating costs increase as cell lifetime decreases, that would be true for plants using new cells and for plants using recycled cells and thus wouldn’t be responsible for a divergence; therefore, the finding wouldn’t coherently and directly explain the observation that the gap between the LCOEs of the two types of plants widens as cell lifetimes are reduced.",

ttle’s diets are found to have different requirements than the diets of sheep and goats, the cattle could have met those requirements from food located far from human settlements. Choice D is incorrect because if it were true that the diets of sheep, goats, and cattle varied based on what the farmers in each Bronze Age settlement could grow, the finding would weaken the team’s conclusion that cattle were likely raised closer to human settlements than sheep and goats were, suggesting instead that all three types of animals were raised close enough to human settlements to feed on those settlements’ crops.",

ity as adults who didn’t attend the school wouldn’t support the researchers’ prediction that former students will be more likely to share their knowledge with younger generations. This finding would identify a similarity between the groups rather than a factor that might make former students more likely than other adults to transmit the language to younger people.",

he damage that otters cause to eelgrass roots ultimately benefits eelgrass meadows. Choice D is incorrect because the health of plants other than eelgrass would have no bearing on Foster’s hypothesis that damage to eelgrass roots leads to greater genetic diversity and meadow health. It would be possible for otters to have a negative effect on other plants while never theless improving the health of eelgrass meadows by damaging eelgrass roots.",

xt states, honeybee species deposit their eggs in hexagonal cells, not in nonhexagonal ones. Thus, the western honeybee and black dwarf honeybee wouldn’t deposit drone eggs in eight-sided cells, and the dwarf honeybee wouldn’t deposit drone eggs in seven-sided cells. Choice C is incorrect. The text explains that honeybees rely mainly on one geometric shape, the hexagon, when constructing their hives, and the graph shows that the western honeybee relies on the same nonhexagonal shapes as the dwarf honeybee does: five-sided, seven-sided, and eight-sided cells. In other words, the western honeybee and dwarf honeybee rely on the same number of geometric shapes. For the black dwarf honeybee, the graph displays data only for five-sided and seven-sided cells, which suggests a total absence of eight- sided cells. Yet this would be only one less nonhexagonal shape than is seen in the western honeybee. Thus, based on the graph, it would be inaccurate to say that the western honeybee relies on \"many more\" geometrical shapes than the other two species do. Choice D is incorrect. As the text explains, honeybee hives consist mainly of hexagonal cells, and sections of nonhexagonal cells are used to connect sections of hexagonal cells of different sizes. Since the graph indicates that the percentage of nonhexagonal cells is lower for the western honeybee than it is for the dwarf honeybee or black dwarf honeybee, the western honeybee would conversely have a higher percentage of hexagonal cells than the either the dwarf honeybee or black dwarf honeybee does, not a lower percentage.",

    "question": "Several studies of sediment (e.g., dirt, pieces of rock, etc.) in streams have shown an inverse correlation between sediment grain size and downstream distance from the primary sediment source, suggesting that stream length has a sorting effect on sediment. In a study of sediment sampled at more than a dozen sites in Alpine streams, however, geologists Camille Litty and Fritz Schlunegger found that cross-site variations in grain size were not associated with differences in downstream distance, though they did not conclude that downstream distance is irrelevant to grain size. Rather, they concluded that sediment influx in these streams may have been sufficiently spatially diffuse to prevent the typical sorting effect from being observed. Which finding about the streams in the study, if true, would most directly support Litty and Schlunegger’s conclusion?",

hitefly herbivory relative to baseline levels and redirect their defenses toward microbial infection, thereby supporting the researchers’ conclusion that whiteflies cause tomato plants to emit airborne chemical signals that induce nearby plants to preferentially defend against microbes even when experiencing herbivory from whiteflies. Choice B is incorrect. Although the graph shows that tomato plants exposed to whitefly-infested plants produced less jasmonic acid than salicylic acid (about 100 nanograms of jasmonic acid per gram of dry weight vs. about 175 nanograms of salicylic acid per gram of dry weight), and although this might suggest that those plants are therefore better defended against microbial attack than against herbivory, this wouldn’t be sufficient to conclude that this is the case: without reference to the relative levels of defensive chemicals produced by the plants in the other experimental conditions, it would be impossible to conclude that exposure to air from whitefly-infested plants either induces or diminishes these plants’ defenses to different kinds of threats. Fur thermore, the graph shows that plants exposed to air from whitefly-free plants produced about 205 nanograms of jasmonic acid per gram of dry weight and about 130 nanograms of salicylic acid per gram of dry weight, not that they produced the same amount of the two acids. Choice C is incorrect because it inaccurately describes the data in the graph. The graph shows that plants in all three conditions produced both jasmonic and salicylic acid, not that plants exposed to air from whitefly-infested plants produce no jasmonic acid at all. Choice D is incorrect. Although the graph shows that plants exposed to air from whitefly-infested plants produced about 100 nanograms of jasmonic acid per gram of dry weight when infested, which is less than the amount produced by control plants (about 140 nanograms per gram of dry weight), and although the graph shows that plants exposed to air from whitefly-free plants produced about 205 nanograms of jasmonic acid per gram of dry weight when infested (which is more than the amount produced by control plants) and about 130 nanograms of salicylic acid per gram of dry weight (which is more than the approximately 120 nanograms per gram of dry weight produced by control plants), this wouldn’t support the researchers’ conclusion that plants exposed to air from whitefly-infested plants preferentially defend against microbial infection—that is, that they increase their levels of salicylic acid and decrease their levels of jasmonic acid relative to control plants. Rather, the data would suggest that exposure to air from whitefly-infested plants reduces plants’ defenses against herbivory, but these data wouldn’t indicate that whiteflies induce plants to redirect their defenses to guard against microbial infection. Fur thermore, the data concerning plants exposed to air from whitefly-free plants merely indicate that these plants increase their defenses against both herbivory and microbial infection when infested by whiteflies.",

iameters. The table does show that Spanish Merino outer fibers are finer, and thus softer, than mouflon outer fibers and that at their finest, Navajo-Churro outer fibers are softer than mouflon outer fibers, but it also shows that Spanish Merino inner fibers are less soft than mouflon inner fibers, since their minimum diameter is greater than 15 microns, and that Navajo-Churro inner fibers can be less soft than mouflon inner fibers, since the diameter ranges up to 35 microns.",

en the claim that voting in an election doesn’t change a voter’s attitude toward the candidates.",

on of eastern oysters by cownose rays increased substantially before dusky sharks declined in regional abundance wouldn’t support the researchers’ hypothesis that the decline in dusky sharks has led to a decline in eastern oysters in the region. Such a finding would suggest that some factor other than shark abundance led to an increase in rays’ consumption of oysters and thus to a decrease in oyster abundance, thereby weakening the researchers’ hypothesis.",

    "question": "In the twentieth century, ethnographers made a concerted effort to collect Mexican American folklore, but they did not always agree about that folklore’s origins. Scholars such as Aurelio Espinosa claimed that Mexican American folklore derived largely from the folklore of Spain, which ruled Mexico and what is now the southwestern United States from the sixteenth to early nineteenth centuries. Scholars such as Américo Paredes, by contrast, argued that while some Spanish influence is undeniable, Mexican American folklore is mainly the product of the ongoing interactions of various cultures in Mexico and the United States. Which finding, if true, would most directly support Paredes’s argument?",

gional variations in folklore as different cultures have interacted in different places. Choice C is incorrect because scholars’ previous ignorance of the folklore would have no bearing on Paredes’s argument that Mexican-American folklore mostly reflects cultural interactions in Mexico and the United States. The folklore’s origins are independent of scholars’ knowledge of the folklore.",

alue for the efficiency of the highest-performing ETL applied through spray coating as approximately 13%, instead of a value between 14% and 16%, and the value for the efficiency of the highest-performing ETL applied through spin coating as approximately 11%, instead of a value between 12% and 14%, as shown in the graph. Choice D is incorrect because Taylor and colleagues’ conclusion is based on the difference in the power conversion efficiency of ETLs applied through spray coating and that of ETLs applied through spin coating, not on the difference between the highest- and lowest-performing ETLs applied through just spray coating.",

on, which means the second part of the example must also be about the ablation rate of iron, not the ablation rate of sodium. Additionally, any ablation rate from AST dust would be ineffective in this example since AST dust is referenced in the first part of the example and thus additional data focused on AST dust would not illustrate a variation across dust types.",

    "question": "The linguistic niche hypothesis (LNH) posits that the exotericity of languages (how prevalent non-native speakers are) and grammatical complexity are inversely related, which the LNH ascribes to attrition of complex grammatical rules as more non-native speakers adopt the language but fail to acquire those rules. Focusing on two characteristics that are positive indices of grammatical complexity, fusion (when new phonemes arise from the merger of previously distinct ones) and informativity (languages’ capacity for meaningful variation), Olena Shcherbakova and colleagues conducted a quantitative analysis for more than 1,300 languages and claim the outcome is inconsistent with the LNH. Which finding, if true, would most directly support Shcherbakova and colleagues’ claim?",

    "explanation": "Choice D is the best answer because it presents a finding that, if true, would support Shcherbakova and colleagues’ claim that the outcome of their study is inconsistent with the linguistic niche hypothesis (LNH). The text explains that the LNH holds that there is an inverse relationship between the prevalence of non-native speakers of a language (exotericity) and the grammatical complexity of that language—that is, that as the number of non-native speakers increases, grammatical complexity decreases, and vice versa. According to the text, Shcherbakova and colleagues focused on two positive indications of grammatical complexity—fusion and informativity—and analyzed their occurrence in over 1,300 languages. If the researchers found a slightly positive correlation between fusion and exotericity and between informativity and exotericity —meaning that to some extent, grammatical complexity increases as the number of non-native speakers of a language increases—their outcome would not be consistent with the assumption that exotericity and grammatical complexity are inversely related (the LNH). Choice A is incorrect because it wouldn’t be possible to say that a finding of a slightly negative correlation between grammatical complexity and both fusion and informativity is inconsistent or consistent with the LNH, since the finding would address only grammatical complexity (given that fusion and informativity are aspects of grammatical complexity) and wouldn’t move beyond that factor to address its relationship to the prevalence of non-native speakers of a language (exotericity), which is the relationship the LNH focuses on. Choice B is incorrect because a finding of a slightly negative correlation between grammatical complexity and the prevalence of non-native speakers of a language (exotericity)— meaning that as the number of non-native speakers increases, grammatical complexity somewhat decreases, and vice versa—would be consistent, not inconsistent, with the LNH, since the text indicates that according to the LNH, there is an inverse relationship between grammatical complexity and exotericity; a negative correlation reflects an inverse relationship. Choice C is incorrect because it wouldn’t be possible to say that a finding of a slightly positive correlation between grammatical complexity and fusion is inconsistent or consistent with the LNH, since the finding would address only grammatical complexity (given that fusion is a positive indication of grammatical complexity) and wouldn’t move beyond that factor to address its relationship to the prevalence of non-native speakers of a language (exotericity), which is the relationship the LNH focuses on.",

 described, a single set of findings from one study using only one methodology can’t show that different methodologies may produce significantly different dinosaur bite force estimates, as Barrett and Rayfield suggest. Choice D is incorrect. Although the table shows that the maximum bite force estimated by Cost et al. was higher than that estimated by Bates and Falkingham, the difference is relatively small; in fact, both teams estimated a minimum bite force of approximately 35,000 newtons and a maximum bite force close to approximately 60,000 newtons. Because these findings demonstrate that a single methodology (muscular and skeletal modeling) produced similar overall results in two studies, the findings don’t support Barrett and Rayfield’s suggestion that different methodologies may produce significantly different dinosaur bite force estimates.",

-trait candidates’ likability) and no correlation between ignobility scores and admirable-trait candidates’ likability ratings (all participants gave admirable-trait candidates a rating of approximately 70 out of 100). Choice C is incorrect. The graph does show that regardless of their own ignobility scores, participants rated admirable-trait candidates as quite likable (a rating of approximately 70 out of 100). However, this doesn’t support the researchers’ conclusion because the conclusion has to do with how participants rated both types of candidates, not just the admirable-trait ones; moreover, the conclusion is that relative ratings were actually affected by the participants’ ignobility scores. Choice D is incorrect. The graph does show that only participants with an ignobility score of 6 gave the same likability score to both admirable- and ignoble- trait candidates while participants with other ignobility scores gave a different rating for each candidate, but this doesn’t support the researchers’ conclusion. The conclusion isn’t just that participants gave different ratings to the two types of candidates—it’s that participants with low to medium-high ignobility scores specifically gave higher likability ratings to admirable-trait candidates than to ignoble-trait candidates and that participants with high ignobility scores didn’t.",

    "question": "In the mountains of Brazil, Barbacenia tomentosa and Barbacenia macrantha—two plants in the Velloziaceae family—establish themselves on soilless, nutrient-poor patches of quartzite rock. Plant ecologists Anna Abrahão and Patricia de Britto Costa used microscopic analysis to determine that the roots of B. tomentosa and B. macrantha, which grow directly into the quartzite, have clusters of fine hairs nearthe root tip; fur ther analysis indicated that these hairs secrete both malic and citric acids. The researchers hypothesize that the plants depend on dissolving underlying rock with these acids, as the process not only creates channels for continued growth but also releases phosphates that provide the vital nutrient phosphorus. Which finding, if true, would most directly support the researchers’ hypothesis?",

hypothesis that the plants depend on dissolving rock. There’s no information in the text to suggest that the proportion of each acid has any bearing on the process of dissolving rock or on any benefits the plants might receive from that process. Choice D is incorrect because if the two species thrive on rocks without phosphates, that would weaken the researchers’ hypothesis that the plants depend on dissolving rock partly because dissolving rock gives them access to phosphates. If the plants can survive on rocks without getting a vital nutrient by dissolving those rocks, then either the nutrient isn’t actually vital for those plants or they can get the nutrient in some way other than by dissolving rocks.",

    "question": "In countries with right-hand traffic, drivers who want to make a left turn at a traffic intersection with stoplights have to wait for either a gap in oncoming traffic or a designated left-turn signal to turn green. At busy intersections, this often causes a backup of vehicles waiting to turn left or being prevented from proceeding by left-turning vehicles in front of them. Transportation researcher Vikash V. Gayah claims that in urban areas eliminating the option to turn left at busy intersections—both with and without dedicated left-turn signals—would improve traffic flow and, as a result, reduce overall travel times even if such a restriction would require drivers to sometimes travel a slightly longer distance. Which finding, if true, would most directly support the researcher’s claim?",

c times. In fact, the text emphasizes that designated left-turn signals contribute to increased congestion because they require drivers to wait to turn left, which results in a backup of vehicles. Installing such signals at all busy intersections would thus potentially compound the problem of congestion, not improve it. Moreover, although making streets easier for drivers to navigate might indicate that left-turn signals are beneficial to drivers, it doesn’t indicate that overall travel times would necessarily be reduced. Choice B is incorrect because a study concluding that drivers wait longer to make left turns at intersections without dedicated left-turn signals than at intersections with such signals wouldn’t support the claim that eliminating the option to turn left altogether would reduce overall travel times. In fact, the finding would merely support the idea that installing left-turn signals would likely reduce the time drivers spend waiting at busy intersections that didn’t previously have left-turn signals, not that overall travel times would be reduced. Choice D is incorrect because the finding that after a restriction eliminating left turns at most intersections took effect, school buses took longer to complete their routes than they did before the restriction was implemented would contradict rather than support the researcher’s claim that eliminating left turns would reduce overall travel times.",

rs representing the compressive strength of the 10% SSA mixture on day 7 and day 28 are roughly the same height (suggesting that the mixture’s compressive strength changed by only a small amount), and although there are relatively large gaps between the bars showing the compressive strength of the 20% and 40% SSA mixtures on day 7 and day 28 (suggesting that their compressive strength changed over time by a greater amount), this comparison concerns only how each SSA mixture’s strength changed over time and doesn’t compare the SSA mixtures with the control mixture. Supporting the recommendation that SSA substitution be done in small proportions requires evidence that small substitutions don’t compromise strength relative to the control while larger substitutions do. Choice C is incorrect because it doesn’t accurately represent the data in the graph, nor is the comparison it makes relevant to the researchers’ recommendation. While the graph does show that the compressive strength of the 10% SSA mixture was greater than that of the control on day 7 (about 25 megapascals vs. about 22 megapascals) and, moreover, that the compressive strength of the control increased from day 7 to day 28 (from about 22 megapascals to about 26 megapascals), the graph shows that the compressive strength of the 10% SSA mixture increased by a small amount (from about 25 megapascals to slightly more than 25 megapascals), not that it decreased. Moreover, the researchers recommended substituting relatively small proportions (compared with larger proportions) of the mixtures with SSA; comparing the compressive strength of the 10% SSA mixture with that of the control without also considering how the compressive strength of the 10% SSA mixture compared with that of the 20% and 40% SSA mixtures wouldn’t support the recommendation. Choice D is incorrect. Though the graph indicates that the 10% SSA mixture’s compressive strength on day 7 and day 28 (about 25 megapascals and slightly more than 25 megap ic influence and exchange.",

ence of data for delta 15-N levels in Akumal Bay in February 2016 would neither prove nor disprove that the presence of human wastewater at Akumal Bay and Tulum was not constant. Despite the unavailable data, there is still enough information to conclude that delta 15-N levels at both sites fluctuated significantly and that influxes of human wastewater therefore happened intermittently. Choice C is incorrect because a constancy in delta 15-N values would not indicate that the influx of human wastewater was intermittent, but rather the opposite. Moreover, the two periods selected are not indicative of general trends in the whole table (for example, the values fluctuated significantly in Akumal Bay between February 2017 and October 2017, and in Tulum between October 2016 and February 2017).",

clusion, which concerns a comparison of participants who took 2–4 days of leave with those who took 1–5 weeks, rather than a comparison of either group with participants who took no leave. Choice B is incorrect. Although the graph does show that in the first test administration, participants who took 2–4 days of leave had lower average attentiveness scores than did those who took 1–5 weeks of leave and those who took no leave, this test administration occurred before any participants went on leave; therefore, these results have no bearing on the researchers’ conclusion about how the amount of leave taken by participants affected their cognitive functioning. Choice D is incorrect. Although the graph does show that in the second and third test administrations, participants who took 2–4 days of leave had higher average attentiveness scores than did those who took no leave, the researchers’ conclusion is about the effects of short leave compared with the effects of long leave, not the effects of short leave compared with the effects of no leave. These results are therefore irrelevant to the conclusion.",

hat Alaska marmots had more torpor bouts (12) than arousal episodes (11) and that their arousal episodes were much shorter than their torpor bouts (21.2 hours and 13.81 days, respectively), comparing data across only Alaska marmot behaviors isn’t sufficient to support a hypothesis about torpor and arousal behaviors of both Alaska marmots and Arctic ground squirrels.",

    "question": "Global Strontium Seawater Curve 87 Sr/ 86 Sr Age (Ma) 0.708980 6.20 0.709000 5.86 0.709020 5.40 0.709040 4.75 0.709060 3.00 The late Hemphillian (Hh) Nor th American Land Mammal Age includes the subdivisions Hh3, 6.8 million years ago (Ma) to 6 Ma, and Hh4, 6 Ma to 4.75 Ma. While mammalian fossils have indicated that Florida’s Montbrook Fossil Site (MFS) and Palmetto Fauna of the Bone Valley Region (PFBV) date to Hh4, a more precise determination of the sites’ ages has proved challenging. Stephanie R. Killingswor th et al. compared average ratios of strontium-87 to strontium-86 ( 87 Sr/ 86 Sr) in fossil shark teeth from MFS and PFBV—0.709000 and 0.709028, respectively—to 87 Sr/ 86 Sr ratios in the global strontium seawater curve, a record that shows how 87 Sr/ 86 Sr ratios in seawater correspond to numerical ages and that is used to date fossils and, by extension, fossil sites. The researchers concluded that ______ Which choice most effectively uses data from the table to complete the statement?",
    "options": {
      "A": "mammalian fossil evidence offers less dating precision than do 87 Sr/ 86 Sr ratios in fossil shark teeth and that PFBV likely was deposited closer to the Hh3-Hh4 boundary than was MFS.",
      "B": "the average 87 Sr/ 86 Sr ratios in the fossil shark teeth from MFS and PFBV only partially support the site age estimates previously established through mammalian fossil evidence.",
      "C": "the average 87 Sr/ 86 Sr ratios in the fossil shark teeth from MFS and PFBV resolve previous uncertainty about the sites’ relative ages by indicating that both sites were deposited contemporaneously during the late Hh.",
      "D": "the average 87 Sr/ 86 Sr ratios in the fossil shark teeth from MFS and PFBV corroborate that both MFS and PFBV fall within Hh4 but suggest that PFBV was likely deposited more recently than MFS."
    },
    "correctAnswer": "D",
    "explanation": "Choice D is the best answer because it most effectively uses data from the table to complete the statement about the researchers’ conclusion about fossil shark teeth. The text states that mammalian fossil evidence has placed both MFS and PFBV within Hh4 (6 Ma to 4.75 Ma) but “a more precise determination of the sites’ ages has proved challenging,” prompting Killingswor th and colleagues to attempt to date the sites by comparing average ⁸⁷Sr/⁸⁶Sr ratios for fossil shark teeth from MFS and PFBV to ratios in the global strontium seawater curve. Given that “⁸⁷Sr/ ⁸⁶Sr ratios in seawater correspond to numerical ages,” a fossil whose ⁸⁷Sr/⁸⁶Sr ratio corresponds to the ratio associated with a particular age in the global strontium seawater curve can be inferred to date to that age. According to the table, the ⁸⁷Sr/⁸⁶Sr ratio of 0.709000 for fossil shark teeth from MFS corresponds to an age of 5.86 Ma, which falls within Hh4. By contrast, the table shows that the ⁸⁷Sr/⁸⁶Sr ratio of 0.709028 for fossils from PFBV would fall between 0.709020 (5.40 Ma) and 0.709040 (4.75 Ma), indicating an age that falls within Hh4 but is more recent than MFS’s age of 5.86 Ma. The data therefore corroborate the conclusion that both sites fall within Hh4 while suggesting that PFBV was likely deposited more recently than MFS was. Choice A is incorrect because the table indicates that MFS was deposited closer to the Hh3-Hh4 boundary than PFBV was, not the reverse. The table indicates that PFBV’s ⁸⁷Sr/⁸⁶Sr ratio of 0.709028 corresponds to an age between 4.75 Ma and 5.40 Ma, while MFS’s ⁸⁷Sr/⁸⁶Sr ratio of 0.709000 corresponds to an age of 5.86 Ma. Because the Hh3-Hh4 boundary occurs at 6 Ma, MFS was deposited closer to that boundary than PFBV was. In addition, the text doesn’t establish that mammalian fossil evidence offers less dating precision than ⁸⁷Sr/⁸⁶Sr ratios do; it states only that mammalian fossils have placed both MFS and PFBV in Hh4 and that more precise dating has proved challenging. Choice B is incorrect because it mischaracterizes the level of support for the site age estimates established through mammalian fossil evidence. The table indicates that the average ⁸⁷Sr/⁸⁶Sr ratios from MFS (0.709000) and PFBV (0.709028) both correspond to ages that fall within Hh4 (6 Ma to 4.75 Ma)—5.86 Ma for MFS and an age between 5.40 Ma and 4.75 Ma for PFBV. The ⁸⁷Sr/⁸⁶Sr ratios therefore fully support, rather than only partially support, the previous mammalian fossil evidence placing both sites within Hh4. Choice C is incorrect because the table indicates that the average ⁸⁷Sr/⁸⁶Sr ratios in fossil shark teeth from MFS (0.709000) and PFBV (0.709028) correspond to different ages—5.86 Ma for MFS and an age between 5.40 Ma and 4.75 Ma for PFBV. Because the ratios point to different ages, they don’t support the conclusion that the fossils at the two sites were deposited contemporaneously, or at the same time.",

    "question": "A student in a political science course is writing a paper on Aristotle’s The Politics, in which Aristotle offers his opinion on political instability and gives advice on how constitutions can be preserved. Aristotle observes that different forms of government can fall in different ways—for example, oligarchies might grant power to military leaders during wartime who refuse to relinquish that power during peacetime—but some methods of preserving order apply across all forms of government. The student claims that in particular Aristotle asserts that in a healthy state obedience to law must be as close to absolute as possible and that even minor infractions should not be ignored. Which quotation from a philosopher’s analysis of The Politics would best support the student’s claim?",
    "options": {
      "A": "“When constructing his argument regarding the characteristics of a well-functioning government, Aristotle asserts that ‘Transgression creeps in unperceived and at last ruins the state, ’ illustrating this idea with a comparison to frequent small expenditures slowly and almost imperceptibly chipping away at a for tune until it is ultimately depleted.”",
      "B": "“When Aristotle writes on the necessity of avoiding corruption in government, he proposes that ‘every state should be so administered and so regulated by law that its magistrates cannot possibly make money. ’ In particular, he thinks oligarchies are particularly susceptible to corruption through bribery.”",
      "C": "“When Aristotle considers the health of constitutions, he states that ‘Constitutions are preserved when their destroyers are at a distance, and sometimes also because they are near, for the fear of them makes the government keep in hand the constitution. ’ He holds that rulers who wish to see constitutions preserved must continually remind the populace of the dangers that would result from a constitutional collapse.”",
      "D": "“When contrasting different forms of government, Aristotle holds that ‘oligarchies may last, not from any inherent stability in such forms of government, but because the rulers are on good terms both with the unenfranchised and with the governing classes. ’ That is, oligarchic leaders who wish to hold on to power will introduce members of disenfranchised classes into government in a participatory role.”"

    "explanation": "Choice A is the best answer because it presents the quotation that best supports the student’s claim that in The Politics, Aristotle gives advice on preserving constitutions—preventing governments from falling and maintaining order—and specifically asserts that in a healthy state, laws must be followed as strictly as possible and infractions should not be overlooked even if they are minor. The philosopher states that when Aristotle builds his argument about the characteristics of a well-functioning government, Aristotle asserts that transgression, or violation of law, will ruin the state if it \"creeps in unperceived, \" or goes unnoticed. The philosopher then adds that Aristotle illustrates this point by comparing the situation to one in which small but frequent expenses diminish a for tune almost unnoticeably until, eventually, the for tune is entirely gone. In other words, the philosopher indicates that Aristotle makes the point that total obedience to law preserves a healthy state while even small violations, if ignored, will undermine the health of the state. Choice B is incorrect because the philosopher addresses Aristotle’s observation about corruption within the government (in particular, preventing the possibility that members of the government can take bribes), and although corruption can involve infractions, the observation is about a subset of people within the state and isn’t directly connected to the importance of upholding total obedience to the law throughout the state. Choice C is incorrect because the philosopher discusses Aristotle’s point about those who would intentionally destroy a constitution altogether and the need for rulers to remind the populace that it would be dangerous for a constitution to collapse, but neither idea is directly connected to the importance of upholding total obedience to the law. Choice D is incorrect because the philosopher explains that Aristotle makes the point that oligarchic leaders may retain power by having members of disenfranchised classes participate in government alongside governing classes, and this point doesn’t address the importance of ensuring obedience to the law and addressing even minor violations.",

    "explanation": "Choice D is the best answer because it describes data from the graph that support Ibáñez and colleagues’ conclusion that increasing anthropogenic nitrogen deposition can compensate for the negative effect of climate change on tree growth if that change is moderate but not if it’s extreme. The bar graph shows the growth of sugar maple trees with and without nitrogen fer tilization under three different climate-change scenarios: current conditions, a moderate change, and an extreme change. According to the graph, radial growth without nitrogen fer tilization is projected to be about 0.16 centimeters (cm) under current conditions, 0.15 cm under a moderate change, and 0.04 cm under an extreme change. The graph also shows that with nitrogen fer tilization, growth is projected to be about 0.18 centimeters under a moderate change but only about 0.06 centimeters under an extreme change. Thus, the data in the graph support the researchers’ conclusion by showing greater growth for a moderate change using nitrogen fer tilization than they do either under current conditions without nitrogen fer tilization or under an extreme change with nitrogen fer tilization. Choice A is incorrect. Although it accurately represents the data in the graph, this fact pattern doesn’t support Ibáñez and colleagues’ conclusion that the decline in radial growth due to climate change will be partly offset by higher levels of anthropogenic nitrogen, but only if change to the climate is moderate and not if it’s extreme. To support this would require comparing radial growth without nitrogen fer tilization under current climate conditions to the growth with nitrogen fer tilization under both moderate and extreme changes. This choice mentions only growth with nitrogen fer tilization under current climate conditions and moderate change and growth without nitrogen fer tilization under an extreme change, which don’t provide a basis to determine whether higher nitrogen in the future will be able to offset reduced growth due to climate change. Choice B is incorrect. Although it accurately represents the data in the graph, this fact pattern doesn’t support Ibáñez and colleagues’ conclusion that the decline in radial growth due to climate change will be partly offset by higher levels of atmospheric nitrogen, but only if change to the climate is moderate and not if it’s extreme. The support needed would compare radial growth under current climate conditions without nitrogen fer tilization to the growth with nitrogen fer tilization under moderate and extreme changes. This choice mentions only growth without nitrogen fer tilization under current conditions and moderate change and growth with nitrogen fer tilization under extreme change, which don’t provide a basis to determine whether higher nitrogen in the future will be able to offset reduced growth due to climate change. Choice C is incorrect. Although it accurately represents the data in the graph, this fact pattern doesn’t support Ibáñez and colleagues’ conclusion that the decline in radial growth due to climate change will be partly offset by higher levels of atmospheric nitrogen, but only if change to the climate is moderate and not if it’s extreme. The support needed would compare radial growth without adding nitrogen under current climate conditions to the growth with nitrogen fer tilization under moderate and extreme changes. This choice mentions only the growth with and without nitrogen fer tilization under moderate climate change and growth without nitrogen fer tilization under extreme change, which don’t provide a basis to determine whether higher nitrogen in the future will be able to offset reduced growth due to climate change.",

    "question": "Juvenile Plants Found Growing on Bare Ground and in Patches of Vegetation for Five Species Species Bare ground Patches of vegetation T otal Percent found in patches of vegetation T. moroderi 9 13 22 59.1% T. libanitis 83 120 203 59.1% H. syriacim 95 106 201 52.7% H. squamatum 218 321 539 59.6% H. stoechas 11 12 23 52.2% Alicia Montesinos-Navarro, Isabelle Storer, and Rocío Perez-Barrales recently examined several plots within a diverse plant community in southeast Spain. The researchers calculated that if individual plants were randomly distributed on this particular landscape, only about 15% would be with other plants in patches of vegetation. They counted the number of juvenile plants of five species growing in patches of vegetation and the number growing alone on bare ground and compared those numbers to what would be expected if the plants were randomly distributed. Based on these results, they claim that plants of these species that grow in close proximity to other plants gain an advantage at an early developmental stage. Which choice best describes data from the table that support the researchers’ claim?",
    "options": {
      "A": "For all five species, less than 75% of juvenile plants were growing in patches of vegetation.",
      "B": "The species with the greatest number of juvenile plants growing in patches of vegetation was H. stoechas.",
      "C": "For T. libanitis and T. moroderi, the percentage of juvenile plants growing in patches of vegetation was less than what would be expected if plants were randomly distributed.",
      "D": "For each species, the percentage of juvenile plants growing in patches of vegetation was substantially higher than what would be expected if plants were randomly distributed."
    },
    "correctAnswer": "D",
    "explanation": "Choice D is the best answer because it provides the most direct support from the table for the claim that the plants growing in close proximity to other plants gained an advantage at an early developmental stage. The table shows the total number of juvenile plants from five species that were found growing on bare ground and in patches of vegetation as well as the percentage of the total number of each species that were growing in patches of vegetation. For each of the five species, more than 50% of the juvenile plants were growing in patches of vegetation. The text notes, however, that a random distribution of plants across the landscape should result in only about 15% of the plants being found in patches of vegetation. In other words, for each of the five species, the percentage of juvenile plants found growing in patches of vegetation was substantially higher than could be explained by chance alone. This finding supports the claim in the text: if plants growing in patches are overrepresented among plants that have survived to the juvenile stage, as the data show they are, then it suggests that it’s advantageous for plants at an early stage of development to grow in patches of vegetation. Choice A is incorrect because the statement that less than 75% of juvenile plants were found growing in patches of vegetation, while true, doesn’t clearly support the claim that the plants growing in close proximity to other plants gained an advantage at an early developmental stage. Saying that less than 75% of plants were found in patches doesn’t indicate how the percentage growing in patches compares with the percentage that would be expected to grow in patches on the basis of chance alone, which is the information necessary to evaluate whether the claim in the text has support in the table. Put another way, if the percentage of plants found growing in patches was 15% or less, it would be true that less than 75% were found in patches, but the data would in fact weaken the claim in the text, not strengthen it, since the data would show that growing in patches wasn’t advantageous. Choice B is incorrect because only 12 plants of this species were found growing in patches, which was the lowest number of any species, not the greatest number. Additionally, even if it were true that this species had the greatest number of plants growing in patches, the finding would be irrelevant to the claim that plants of all five species gained an advantage by growing in close proximity to other plants. Choice C is incorrect because 59.1% of the plants of these species were found growing in patches, which is a far greater percentage, not a lower percentage, than what would be expected if plants were randomly distributed (around 15%). Additionally, if it were true that the percentage of plants growing in patches was lower for these species than what would be expected from chance alone, that finding would weaken, not strengthen, the claim that growing in patches is advantageous.",

    "question": "Founded in 1965 and originally established as a cultural extension of the United Farm Workers—a union representing many Mexican American agricultural workers at the time—the theater troupe El Teatro Campesino has achieved recognition as a source of inspiration for subsequent Chicano theater companies and as a contributor to the dramatic arts. In an article about the company, a theater historian posits that a significant stylistic influence on El Teatro’s early performances was the audience-mediated slapstick comedy of carpa theater, vaudeville-style shows popular in Mexico and the US Southwest in the 1920s and ’30s. Which quotation from the article would best illustrate the theater historian’s claim?",
    "options": {
      "A": "“The company presented actos, short comedy sketches, that often relied on exaggerated physical humor to groups of agricultural workers, whose reactions—enthusiastic cheers of appreciation and, occasionally, loud boos of disapproval—promoted improvisation.”",
      "B": "“The company was focused on the reality of the present situation and discovered that humor was often found in that reality; consequently, comedy became a tool to convey social critique while enter taining and inspiring audiences.”",
      "C": "“The company relied heavily on satire, humor, and references to contemporary popular culture as well as a make-do aesthetic—often referred to as rasquache—that reflected not only the troupe’s limited financial resources but also its sociopolitical message.”",
      "D": "“The members of the company, which in addition to founder Luis Valdez consisted entirely of nonprofessional actors, traveled into farm fields, where they, with minimal props and costumes, performed comedy in the form of brief humorous vignettes.”"
    },
    "correctAnswer": "A",
    "explanation": "Choice A is the best answer because it most effectively illustrates the theater historian’s claim that El Teatro Campesino’s early performances were influenced stylistically by carpa theater, vaudeville-style shows with “audience-mediated slapstick comedy.” The quotation indicates that El Teatro presented comedic sketches that often featured exaggerated physical humor and that the performers improvised based on the cheers and boos from the audience; thus, it illustrates that El Teatro’s performances were similarto carpa theater in the physical, slapstick nature of their comedy and in the way the performances were mediated, or shaped, by the audience’s reactions. Choice B is incorrect. Although the quotation refers to El Teatro’s use of comedy and mentions audiences, it focuses on the company’s use of comedic aspects of reality as a tool to critique society while providing audiences with enter tainment and inspiration; it doesn’t give any indication that El Teatro’s performances featured slapstick, or very physical, comedy or that they were directly shaped by the audience. Choice C is incorrect. Although the quotation refers to El Teatro’s aesthetic, or style, and mentions comedy, it indicates only that the company relied on satire and humor and had a style that reflected their limited financial means and sociopolitical message; it doesn’t give any indication that El Teatro’s performances featured slapstick, or very physical, comedy or that they were directly shaped by the audience. Choice D is incorrect. Although the quotation refers to El Teatro’s performance of comedy, it mentions only that the company performed brief humorous vignettes, or short humorous scenes, in farm fields; it doesn’t give any indication that El Teatro’s performances featured slapstick, or very physical, comedy or that they were directly shaped by the audience.",

    "options": {

    "correctAnswer": "C",
    "explanation": "Choice C is the best answer because it most effectively uses data from the graph to complete the statement about the researchers’ hypothesis regarding a finding. The text states that the researchers attribute a certain finding about community assembly in fungi and prokaryotes to the fact that fungi have a higher tolerance for environmental pressures than do prokaryotes. This finding, then, would be explained by the fact that fungi better tolerate environmental pressures, which the text defines as including variable and homogeneous selection. According to the graph, the contribution of variable selection to community assembly was nearly 40 percent for fungi but nearly 60 percent for prokaryotes, indicating that variable selection contributed significantly less to fungal community assembly than to prokaryotic community assembly. This finding aligns with the researchers’ hypothesis: because fungi tolerate environmental pressures like variable selection better than prokaryotes do, those pressures play a smaller role in shaping fungal communities than in shaping prokaryotic communities. Choice A is incorrect. Although this comparison is supported by the graph, which shows that homogenizing dispersal’s contribution to fungal community assembly was just over 10 percent while variable selection’s contribution was just under 40 percent, this comparison doesn’t illustrate the hypothesis because it involves two factors affecting fungal community assembly. The researchers’ hypothesis specifically concerns a difference between fungi and prokaryotes (namely, fungi’s greater tolerance of environmental pressures), so a comparison that is limited to fungal community assembly doesn’t represent a finding that aligns with this hypothesis. Choice B is incorrect because it mischaracterizes the information in the graph. The graph indicates that the total number of factors that contributed to community assembly was greater for fungi than for prokaryotes: all five factors made nonzero contributions to fungal community assembly, while two factors—homogeneous selection and dispersal limitation—appear not to have contributed to prokaryotic community assembly. In addition, the overall number of factors that influence community assembly isn’t directly relevant to the researchers’ hypothesis, which addresses the effects of higher tolerance of environmental pressures among fungi in comparison to prokaryotes. Choice D is incorrect. Although the graph indicates that homogeneous selection contributed only minimally to fungal community assembly and appears not to have contributed at all to prokaryotic community assembly, this isn’t a finding that the researchers’ hypothesis would account for. The hypothesis concerns a difference between fungi and prokaryotes that is plausibly attributable to fungi’s greater tolerance of environmental pressures, which include homogeneous and variable selection. The finding that one type of environmental pressure contributed negligibly to both groups doesn’t differentiate fungi from prokaryotes and therefore doesn’t illustrate what the hypothesis is meant to explain.",

    "question": "A member of the Otomi, an Indigenous people in Central Mexico, Octavio Medellín immigrated to the United States as a child, and his sculpture bears the impress of traditions on both sides of the border: US-based modernist sculpture, Mexican modernist painting, Otomi art, and the ancient sculpture of other Mexican Indigenous peoples, including the Maya. In his 1950 masterpiece History of Mexico, Medellín fuses these influences into a style so idiosyncratic that it resists efforts to view his work through the lens of nationality or cultural identity. Artists, he insisted, should strive for individual expression, even as they draw inspiration from their heritage and the communities where they live and work. Which quotation from an art critic most directly challenges the underlined claim in the text?",
    "options": {
      "A": "“Although a number of ancient Indigenous artistic traditions pictured human forms in profile, the forms populating the surface of A History of Mexico suggest a specifically Maya influence.”",
      "B": "“In A History of Mexico, the synthesis of ancient and modernist traditions functions as a stylistic parallel to the work’s subject matter: a survey of centuries of Mexican history.”",
      "C": "“Many critics focus on Indigenous influences in A History of Mexico and other key works by Medellín to the exclusion of influences from non- Indigenous art.”",
      "D": "“While A History of Mexico features modernist motifs, it relies primarily on angular human forms in profile—a staple of Maya sculpture—and thus invites classification as Indigenous art.”"
    },
    "correctAnswer": "D",
    "explanation": "Choice D is the best answer. This critic challenges the claim by arguing that A History of Mexico is not so idiosyncratic (unique) as to resist classification because its use of Maya-style human profiles actually “invites classification as Indigenous art.” Therefore, according to this critic, the work can be viewed, at least partially, through a lens of national or cultural identity. Choice A is incorrect. While it describes the Maya influence on a particular aspect of A History of Mexico, this quotation doesn’t push back on Medellín’s “idiosyncratic” (unique) style, nor does it try to categorize the entire work into a single cultural tradition. Choice B is incorrect. This choice doesn’t directly challenge the underlined claim, but rather supports it. It suggests that the work effectively blends a variety of artistic products to create a single work that can’t be defined by any one tradition. Instead, the work recalls many centuries of history and culture all at once. Choice C is incorrect. This choice supports rather than challenges the underlined claim. The quotation argues that other critics focus too much on Indigenous influences on the artwork instead of viewing all of the influences equally—that they should instead be viewing the work as an idiosyncratic whole instead of through one or two narrow cultural lenses.",
    "sourceId": "378c66d5"
  },

    "question": "In Diné (Navajo) culture, ikaah (sandpaintings) are created and then erased as part of sacred healing ceremonies lasting no more than a few days, but Diné hataałii (chanter, healer, cultural guide) Fred Stevens developed fixatives to preserve desacralized sandpaintings. While on a US- sponsored cultural ambassadorial trip in Europe and the Americas in the 1960s, Stevens produced several such sandpaintings and gave them to cultural institutions. This may seem in tension with the role of cultural ambassador—how could static objects authentically represent an inherently ephemeral and dynamic practice?—but such a view is itself overly object-focused and neglects how Stevens strove to convey exactly those characteristics of ikaah as a cultural practice. Which quotation from an art historian would most directly support the claim made in the text?",
    "options": {
      "A": "“While Stevens’s ambassadorial sandpaintings are undoubtedly educative for audiences that have little exposure to Diné culture, they should not be confused with authentic ikaah, which cannot be extricated from a practice that is intentionally and necessarily transitory nor condensed into a single persistent object.”",
      "B": "“The most compelling way to reconcile the apparent tension between the temporary and performative nature of ikaah and the persistent and static nature of Stevens’s ambassadorial sandpaintings is to recognize that Stevens was an ambassador not only of Diné culture but of a US art culture that tended to value permanent works over ephemeral ones.”",
      "C": "“Stevens’s ambassadorial sandpaintings are best understood not as self-contained objects but as reminders of the public creations of the sandpaintings, during which Stevens conducted appropriate ikaah rituals and encouraged viewers to closely track his movements and subtle shifts in the sand throughout the process.”",
      "D": "“It is important to recall Stevens’s own actions as a gift-giver—a temporary and performative role—of the sandpaintings, for by taking those actions, Stevens publicly enacted the transmission of knowledge of both traditional ikaah practices and cutting-edge chemistry (in the form of the preservative additives), a hybrid that reflects the dynamism of Diné culture.”"
    },
    "correctAnswer": "C",
    "explanation": "Choice C is the best answer because it most directly supports the text’s claim that Stevens strove to convey the ephemeral and dynamic characteristics of ikaah as a cultural practice. The text challenges the characterization of Stevens’s preserved sandpaintings as mere “static objects” that cannot “authentically represent” a practice defined in part by the absence of an end product; it claims instead that this “overly object-focused” interpretation overlooks how Stevens preserved the essential characteristics of traditional ikaah practice. This quotation supports the claim by explaining that Stevens’s sandpaintings should be understood “not as self-contained objects but as reminders of the public creations of the sandpaintings,” during which Stevens “conducted appropriate ikaah rituals and encouraged viewers to closely track his movements and subtle shifts in the sand throughout the process.” The fact that Stevens created the sandpaintings in a public setting and invited viewers to attentively engage with this process supports the claim that he sought to portray ikaah as a dynamic practice rather than as a static product. Fur ther, the inherently impermanent nature of such a performance evokes the ephemerality that characterizes ikaah. Choice A is incorrect because it contradicts rather than supports the text’s claim that Stevens strove to convey the ephemeral and dynamic characteristics of ikaah as a cultural practice. This quotation argues that Stevens’s preserved sandpaintings “should not be confused with authentic ikaah” and emphasizes that authentic ikaah “cannot be extricated from a practice that is intentionally and necessarily transitory.” This view aligns with the “overly object-focused” perspective that the text argues against, rather than supporting the claim that Stevens successfully conveyed ikaah’s ephemeral and dynamic characteristics. Choice B is incorrect because it focuses on reconciling the tension between ephemeral and permanent forms rather than supporting the claim that Stevens actively conveyed ikaah’s ephemeral and dynamic characteristics. While this quotation acknowledges an apparent contradiction, it suggests that Stevens was accommodating US preferences for permanent artworks; it doesn’t demonstrate how he communicated the ephemeral and dynamic nature of traditional ikaah practice. Choice D is incorrect. Although the quotation mentions Stevens’s “temporary and performative role” as a gift-giver, it doesn’t address how Stevens conveyed the ephemeral and dynamic characteristics of ikaah itself during his ambassadorial activities. The quotation focuses on Stevens’s role in transmitting knowledge and representing cultural dynamism but doesn’t specifically support the claim about his efforts to communicate the essential characteristics of ikaah practice. Fur ther, the quotation incorrectly implies that Stevens shared his knowledge of preservative additives; the text doesn’t establish that he revealed how the sandpaintings were preserved.",
    "sourceId": "ca9dc00f"
  },

    "question": "Corn-Related Vocabulary in Various Southeastern Languages Language family Word (language) English translation Proposed origin in vocabulary of the T otozoquean language family Muskogean tanchi’ (Chickasaw); tanchi (Choctaw); vce (Muscogee, pronounced “uh-chi”) corn no Iroquoian se-lu (Cherokee) corn no Caddoan -k’as- (Caddo) dried corn yes Chitimacha k’asma (Chitimacha) corn yes In Caddo, a language from what is now the US Southeast, vocabulary per taining to corn cultivation resembles equivalent vocabulary in the Totozoquean language family in Mexico. This resemblance is perhaps attributable to cultural contact: such words could have entered Caddo through the intermediary of the neighboring but unrelated Chitimacha language, concurrent with the dissemination of corn itself from Mexico into the Southeast after 700 CE. That the vocabulary per taining to domestic crops accompanies them as they diffuse into new regions is an established phenomenon globally. Crops may also be decoupled from vocabulary altogether: corn cultivation became ubiquitous among the Southeastern tribes, yet ______ Which choice most effectively uses data from the table to complete the statement?",

      "C": "corn-related vocabulary underwent changes when entering other, unrelated languages, as can be seen by the divergence of the Caddo word from the Chitimacha word it originated in.",

    "question": "Given that stars and planets initially form from the same gas and dust in space, some astronomers have posited that host stars (such as the Sun) and their planets (such as those in our solar system) are composed of the same materials, with the planets containing equal or smaller quantities of the materials that make up the host star. This idea is also supported by evidence that rocky planets in our solar system are composed of some of the same materials as the Sun. Which finding, if true, would most directly weaken the astronomers’ claim?",

, not show that an inexpensive store context merely moderates, or lessens, that effect. Choice C is incorrect because this finding wouldn’t show that the effect Sevilla and Townsend observed in their initial experiments (that products spaced far apart were perceived as more valuable than the same products spaced close together) is present but lessened in inexpensive retail contexts, as the text suggests. The conclusion in the text rests on determining the difference in jewelry items’ perceived value between two spacing conditions within each store and then comparing the difference for the inexpensive store (Forever 21) to the difference for the upscale store (Tiffany &amp; Co.); a finding that compares perceptions of the jewelry items’ value between the two stores but for only one type of spacing condition at a time wouldn’t provide information about the degree of difference between spacing conditions within each type of store context. Choice D is incorrect because this finding wouldn’t show that the effect Sevilla and Townsend observed in their initial experiments (that products spaced far apart were perceived as more valuable than the same products spaced close together) is present but lessened in inexpensive retail contexts, as the text suggests. The conclusion in the text rests on determining the difference in jewelry items’ perceived value between two spacing conditions within each store and then comparing the difference for the inexpensive store (Forever 21) to the difference for the upscale store (Tiffany &amp; Co.); a finding that compares perceptions of the relative value of jewelry items between the two stores and for only one type of spacing condition at a time wouldn’t provide information about the degree of difference between spacing conditions within each type of store context.",

e the number of Black writers present on Random House’s list of published authors, not on the influence she may have had on the content of the works she edited. Without knowing whether Morrison’s stylistic influence led to more publications or if Morrison applied her influence specifically to works by Black writers, the finding that works edited by Morrison could be identified by stylistic characteristics would have no bearing on the claim that Morrison intended to strengthen the presence of Black writers among the published authors at Random House.",

    "question": "The presence of other individuals of the same species has been observed to mitigate stress in highly social mammals. To investigate whether this phenomenon, known as social buffering, also occurs in reptiles, researchers led by Chelsea E. Martin monitored stress responses in wild southern Pacific rattlesnakes (Crotalus helleri) in three experimental treatments: when alone, with a rope, and with a companion C. helleri. The researchers compared the percent change between baseline and peak heart rate in response to a (harmless) disturbance, with higher values indicating higher stress levels. Which finding, if true, would most directly support the idea that social buffering occurs among C. helleri?",

nce was reduced and so wouldn’t directly demonstrate social buffering as defined in the study. Choice D is incorrect because the finding states that the percent change in heart rate was smaller among solitary snakes than among snakes with a companion, which would indicate a smaller stress response when alone. This pattern would directly contradict the social buffering hypothesis rather than support it. Fur thermore, a comparison of baseline heart rates would be immaterial for determining whether social buffering occurs among C. helleri because the text indicates that a change in heart rate, not average baseline heart rate, indicates a stress response.",

    "question": "ALSOL is a microcredit program in Mexico that makes small loans to female entrepreneurs who lack the collateral and credit history to secure financing from conventional banks. Borrowers use their business proceeds to repay loans in equal weekly installments and incur no penalty for missed payments other than lack of access to larger loans. Economists Gustavo Barboza and Sandra Trejos analyzed ALSOL data and found that rural borrowers, who mostly make and sell handicrafts, miss payments more often than urban borrowers do, partly because they sell their goods less frequently than they could. Barboza and Trejos claim that this behavior reflects strategic decisions that enable rural women to increase their profits per unit sold. Which finding, if true, would most directly support Barboza and Trejos’s claim?",

    "explanation": "Choice D is the best answer because it presents a finding that, if true, would most directly support Barboza and Trejos’s claim that rural female entrepreneurs who have received small loans from ALSOL are strategic in selling their goods less frequently than they could, even if it means missing payments. The text explains that borrowers in the ALSOL program use proceeds from their businesses to repay loans in equal weekly payments, with almost no penalty for missed payments. According to the text, Barboza and Trejos found that rural borrowers miss weekly payments in part because they don’t sell their goods as often as they could, a move the researchers claim allows the entrepreneurs to help increase profits for the goods they sell. Finding that the cost of bringing goods to towns with marketplaces is high for rural entrepreneurs but is largely independent of how many goods are brought would support the researchers’ claim: traveling to marketplaces less frequently would mean that a rural entrepreneur spends less on travel overall, and taking a large load of goods to a marketplace for essentially the same cost as taking a small load would allow the entrepreneur to more substantially offset the cost of travel with greater overall sales at the marketplace, resulting in more profit per good sold—even if those profits are earned less frequently and don’t support weekly loan payments. Choice A is incorrect because the finding that many marketplaces require entrepreneurs to pay the operators of the marketplace a fixed percentage of proceeds to be able to sell goods there wouldn’t explain why rural entrepreneurs strategically choose to sell their goods less frequently than they could in order to increase their profits per unit sold. With a fixed percentage of proceeds due to operators, the amount entrepreneurs have to pay operators would also be fixed regardless of frequency of selling. Choice B is incorrect because the finding that rural entrepreneurs can usually sell their goods for higher prices in cities than in their local areas but also face higher competition to sell goods in cities wouldn’t explain why rural entrepreneurs strategically choose to sell their goods less frequently than they could in order to increase their profits per unit sold. This is because both the higher prices and higher competition in cities would be stable factors—meaning there would be no clear reason for the rural entrepreneurs not to take every available chance to sell their goods in cities and to instead sell their goods in cities only sometimes. Choice C is incorrect because the finding that rural entrepreneurs have lower costs and thus tend to require smaller initial loans than urban entrepreneurs do has no bearing on rural borrowers strategically choosing to sell their goods less frequently than they could specifically to increase their profits per unit sold. The cost of producing goods doesn’t depend on the frequency with which an entrepreneur sells those goods, so lower frequency alone wouldn’t affect profits, and the initial loan amount is set and has nothing to do with how much profit is earned from each sale.",
