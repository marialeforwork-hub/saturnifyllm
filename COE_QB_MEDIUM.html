eutral feedback, which a finding would need to do to demonstrate that positive feedback enhanced enjoyment as predicted. Fur ther, the fact that participants who received negative feedback had greater endurance than those who received positive or neutral feedback wouldn’t reveal whether positive feedback had an effect on endurance, either positive or negative. Choice C is incorrect because endurance being greater with positive feedback than with neutral feedback would show that positive feedback did have the predicted physical effect (enhancing endurance). Fur ther, reported enjoyment being similar with neutral feedback and negative feedback wouldn’t reveal anything about how enjoyment was affected by positive feedback, and thus wouldn’t show that positive feedback had the predicted psychological effect.",

ads and riprap along its shoreline (Cur tis) and one site with unequal percentages of bulkheads and riprap (Miles) but without indicating whether bulkheads or riprap were more prevalent at Miles. This finding wouldn’t provide any clear information about how bulkheads and riprap each correlate with waterbird community integrity, so it wouldn’t illustrate the researchers’ finding of a difference between those correlations.",

luence; such similarities might arise if Cisneros and younger Latina authors alike depicted cer tain basic cultural and historical features of their communities. Testimony from younger Latina authors about how The House on Mango Street had inspired them would be far more persuasive evidence of the novella’s influence.",

    "question": "Rivers rich in sediment appear yellow, while increases in red algae make rivers appear red. To track things like the sediment or algae content of large US rivers, John R. Gardner and colleagues used satellite data to determine the dominant visible wavelengths of light measured for various segments of these rivers. The researchers classified wavelengths of 495 nanometers (nm) and below as red, wavelengths between 495 and 560 nm as blue, and wavelengths of 560 nm and above as yellow. The researchers concluded that for the Missouri River, segments flowing into lakes tend to carry more sediment than those flowing out of lakes. Which finding, if true, would most directly support the researchers’ conclusion?",

an segments flowing out of lakes. This finding would suggest only that there is more sediment around the edges of lakes than in their centers, which does not have any direct bearing on the researchers’ conclusion about river segments flowing into and out of lakes. Choice C is incorrect because finding that most segments of the Missouri River have wavelengths significantly higher than 560 nanometers would suggest that most segments of the river are high in sediment, not that segments flowing into lakes are higher in sediment than segments flowing out of lakes. Only a comparison of river segments flowing into lakes with segments flowing out of lakes can support the researchers’ conclusion.",

 bill surface area of the species that are included in the table and although its habitat has the second-lowest mean minimum temperature in the coldest month, this habitat has the highest (rather than the lowest) mean maximum temperature in the warmest month. Moreover, the data about this species’ bill surface area and mean minimum temperature suggest that smaller bills are associated with colder habitats, supporting rather than challenging the hypothesis that bill size increases with habitat temperature. Choice B is incorrect because it misrepresents the data in the table. Although the Cozumel thrasher has the second-greatest mean bill surface area of the species that are included in the table, its habitat’s mean maximum temperature in the warmest month is not \"significantly higher\" than the mean maximum temperatures of the other habitats. On the contrary, the mean maximum temperature of the Cozumel thrasher’s habitat is lower than that observed for the habitats of both the Bendire’s thrasher and the long-billed thrasher. Choice C is incorrect because it misrepresents the data in the table. Although this choice accurately describes the brown thrasher’s mean bill surface area and habitat temperature, it incorrectly states that the long-billed thrasher has the second- largest (rather than the third-largest) mean bill surface area of the species included. In addition, instead of revealing a lack of support for the hypothesis that bill size increases with habitat temperature, the data in this choice broadly reflect the hypothesized relationship.",

he reduction in the spider population, though the fact that the spider population also fell substantially in the other enclosure means that the lizards aren’t the only cause of the reduction.",

    "question": "Many insects are iridescent, or have colors that appearto shimmer and change when seen from different angles. Scientists have assumed that this feature helps to attract mates but could also attract predators. But biologist Karin Kjernsmo and a team had the idea that the shifting appearance of colors might actually make it harder for other animals to see iridescent insects. To test this idea, the team put beetle forewings on leaves along a forest path and then asked human participants to look for them. Some of the wings were naturally iridescent. Others were painted with a nonchanging color from the iridescent spectrum, such as purple or blue. Which finding, if true, would most directly support the team’s idea?",
    "options": {

    "question": "External shopping cues are a type of marketing that uses obvious messaging—a display featuring a new product, for example, or a “buy one, get one free” offer—to entice consumers to make spontaneous purchases. In a study, data scientist Sam K. Hui and colleagues found that this effect can also be achieved with a less obvious cue: rearranging a store’s layout. The researchers explain that trying to find items in new locations causes shoppers to move through more of the store, exposing them to more products and increasing the likelihood that they’ll buy an item they hadn’t planned on purchasing. Which response from a survey given to shoppers who made a purchase at a retail store best supports the researchers’ explanation?",

      "B": "“I didn’t buy everything on my shopping list today. I couldn’t find a couple of the items in the store, even though I looked all over for them.”",
      "C": "“The store sent me a coupon for a new brand of soup, so I came here to find out what kinds of soup that brand offers. I decided to buy a few cans because I had the coupon.”",

d fish in low-visibility conditions, which would result in wider- headed fish bumping into obstructions more frequently. A finding showing equal bumping rates between fish with the two head shapes would indicate no relationship between head width and detection ability, directly contradicting the hypothesis.",

    const quizContainer = document.getElementById('quiz');
    let currentScore = 0;
    let answeredCount = 0;
    const totalQuestions = quizData.length;

    const STUDENT_ID = sessionStorage.getItem('studentId') || sessionStorage.getItem('studentName') || 'guest';
    const QUIZ_STORAGE_KEY = `quiz_draft_${STUDENT_ID}_${document.title}`;

    function renderMath() {
        if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise();
        }
    }

    function buildQuiz() {
        localStorage.setItem(QUIZ_STORAGE_KEY + '_total', quizData.length);
        quizContainer.innerHTML = '';
        createNavigatorBox(); 

        quizData.forEach((data, index) => {
            const questionBlock = document.createElement('div');
            questionBlock.classList.add('question-block');
            questionBlock.id = `question-${data.id}`;
            questionBlock.dataset.locked = "false";
            questionBlock.style.scrollMarginTop = "100px";

            let optionsHtml = '';
            if (data.options && Object.keys(data.options).length > 0) {
                for (const [key, value] of Object.entries(data.options)) {
                    optionsHtml += `
                        <li>
                            <label id="label-${data.id}-${key}">
                                <input type="radio" name="question${data.id}" value="${key}">
                                <strong class="answer-letter" aria-hidden="true">${key}.</strong>
                                <span class="answer-content">${value}</span>
                            </label>
                            <button type="button" class="eliminate-option" aria-label="Gạch bỏ đáp án ${key}" aria-pressed="false" title="Gạch bỏ đáp án ${key}">×</button>
                        </li>
                    `;
                }
            }

            questionBlock.innerHTML = `
                <div class="question-text">Câu ${index + 1}: ${data.question}</div>
                <ul class="options">${optionsHtml}</ul>
                <div class="explanation" id="explanation-${data.id}">${data.explanation || ''}</div>
            `;
            questionBlock.querySelectorAll('.eliminate-option').forEach(button => {
                button.addEventListener('click', () => {
                    const eliminated = button.getAttribute('aria-pressed') !== 'true';
                    button.setAttribute('aria-pressed', String(eliminated));
                    button.closest('li').classList.toggle('is-eliminated', eliminated);
                });
            });
            quizContainer.appendChild(questionBlock);
        });
        
        quizContainer.addEventListener('change', () => { saveProgress(); updateNavigatorState(); });
        quizContainer.addEventListener('input', () => { saveProgress(); updateNavigatorState(); });
        
        const progressEl = document.getElementById('progressText');
        if (progressEl) progressEl.innerText = `0/${totalQuestions}`;

        renderMath();
    }

    function createNavigatorBox() {
        const grid = document.getElementById('navGrid');
        if(!grid) return;
        grid.innerHTML = ''; 

        quizData.forEach((data, index) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.id = `nav_btn_${data.id}`;
            btn.className = 'nav-grid-btn';
            btn.innerText = index + 1;

            btn.onclick = () => {
                const targetBlock = document.getElementById(`question-${data.id}`);
                if (targetBlock) targetBlock.scrollIntoView({ behavior: 'smooth' });
            };
            grid.appendChild(btn);
        });
    }

    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const questionListPanel = document.getElementById('questionListPanel');
    
    if (toggleSidebarBtn && questionListPanel) {
        toggleSidebarBtn.addEventListener('click', () => {
            questionListPanel.classList.toggle('collapsed');
        });
    }

    const toggleNavBtn = document.getElementById('toggleNavBtn');
    const stickyFooter = document.getElementById('stickyFooter');
    const toggleIcon = document.getElementById('toggleIcon');
    const toggleText = document.getElementById('toggleText');

    toggleNavBtn.addEventListener('click', () => {
        if (stickyFooter.classList.contains('hidden')) {
            stickyFooter.classList.remove('hidden');
            toggleIcon.innerText = '👁️';
            toggleText.innerText = 'Ẩn thanh công cụ';
        } else {
            stickyFooter.classList.add('hidden');
            toggleIcon.innerText = '👀';
            toggleText.innerText = 'Hiện thanh công cụ';
        }
    });

    function updateNavigatorState() {
        quizData.forEach((data) => {
            let hasAnswered = false;
            const selected = document.querySelector(`input[name="question${data.id}"]:checked`);
            if (selected) hasAnswered = true;

            const btn = document.getElementById(`nav_btn_${data.id}`);
            if (btn) {
                if (hasAnswered) {
                    btn.style.background = '#2ecc71'; 
                    btn.style.color = '#ffffff'; 
                    btn.style.borderColor = '#27ae60';
                } else if (document.getElementById(`question-${data.id}`).dataset.locked !== "true") {
                    btn.style.background = '#f8f9fa'; 
                    btn.style.color = '#2c3e50'; 
                    btn.style.borderColor = '#bdc3c7';
                }
            }
        });
    }

    function saveProgress() {
        let userAnswers = {};
        quizData.forEach(data => {
            const selectedOption = document.querySelector(`input[name="question${data.id}"]:checked`);
            if (selectedOption) userAnswers[data.id] = selectedOption.value;
        });
        localStorage.setItem(QUIZ_STORAGE_KEY, JSON.stringify(userAnswers));
    }

    function checkAndRestoreProgress() {
        const savedDraft = localStorage.getItem(QUIZ_STORAGE_KEY);
        if (!savedDraft) return;

        const userAnswers = JSON.parse(savedDraft);
        const count = Object.keys(userAnswers).length;

        if (count > 0) {
            const confirmResume = confirm(
                `Em đang làm dở ${count}/${totalQuestions} câu ở lần trước.\n\n` +
                `• Bấm [OK] để LÀM TIẾP bài đang dở.\n` +
                `• Bấm [Hủy (Cancel)] để LÀM LẠI TỪ ĐẦU.`
            );

            if (confirmResume) {
                let lastAnsweredId = null;
                Object.entries(userAnswers).forEach(([qId, value]) => {
                    const radio = document.querySelector(`input[name="question${qId}"][value="${value}"]`);
                    if (radio) {
                        radio.checked = true;
                        lastAnsweredId = qId;
                    }
                });

                updateNavigatorState();

                if (lastAnsweredId) {
                    const targetBlock = document.getElementById(`question-${lastAnsweredId}`);
                    if (targetBlock) {
                        targetBlock.scrollIntoView({ behavior: 'smooth' });
                    }
                }
            } else {
                startTime = new Date();
                localStorage.removeItem(QUIZ_STORAGE_KEY);
            }
        }
    }

    function checkCurrentAnswers() {
        let checkedAny = false;

        quizData.forEach(data => {
            const block = document.getElementById(`question-${data.id}`);
            if (block.dataset.locked === "true") return;

            const correctAnswer = (data.correctAnswer || '').toString().trim().toLowerCase();
            const selectedOption = document.querySelector(`input[name="question${data.id}"]:checked`);
            
            if (selectedOption) {
                checkedAny = true;
                const userAnswer = selectedOption.value.trim().toLowerCase();
                
                if (userAnswer === correctAnswer) {
                    document.getElementById(`label-${data.id}-${selectedOption.value}`).classList.add('correct-answer-label');
                    currentScore++;
                } else {
                    document.getElementById(`label-${data.id}-${selectedOption.value}`).classList.add('wrong-answer-label');
                    const correctKey = data.correctAnswer;
                    if (document.getElementById(`label-${data.id}-${correctKey}`)) {
                        document.getElementById(`label-${data.id}-${correctKey}`).classList.add('correct-answer-label');
                    }
                }

                const explanationEl = document.getElementById(`explanation-${data.id}`);
                if (explanationEl && data.explanation) {
                    explanationEl.style.display = 'block';
                    explanationEl.innerHTML = `<strong>Giải thích:</strong> ${data.explanation}`;
                }

                const radios = document.querySelectorAll(`input[name="question${data.id}"]`);
                radios.forEach(radio => radio.disabled = true);
                block.dataset.locked = "true";
                answeredCount++;
            }
        });

        if (!checkedAny) {
            alert('Bạn chưa chọn đáp án nào để kiểm tra!');
        } else {
            updateScoreBoard();
            saveAdminResultData();

            if (answeredCount === totalQuestions) {
                alert(`Chúc mừng! Bạn đã hoàn thành toàn bộ ${totalQuestions} câu hỏi. Tổng điểm: ${currentScore}/${totalQuestions}.`);
                localStorage.removeItem(QUIZ_STORAGE_KEY);
            }
        }
    }

    let startTime = new Date();

    function saveAdminResultData() {
        const endTime = new Date();
        const durationSec = Math.max(0, Math.round((endTime - startTime) / 1000));
        const durationMin = (durationSec / 60).toFixed(1);

        const quizTitle = document.title || 'Bài tập SAT';
        let studentAnswers = {};

        quizData.forEach((data, index) => {
            const selected = document.querySelector(`input[name="question${data.id}"]:checked`);
            studentAnswers[`Câu ${index + 1}`] = selected ? selected.value : 'Bỏ trống';
        });

        let history = JSON.parse(localStorage.getItem('sat_results') || '[]');
        const attemptCount = history.filter(h => h.studentName === STUDENT_ID && h.quizTitle === quizTitle).length + 1;

        const resultData = {
            id: Date.now(),
            studentName: STUDENT_ID,
            quizTitle: quizTitle,
            attempt: attemptCount,
            score: `${currentScore}/${totalQuestions}`,
            percentage: Math.round((currentScore / totalQuestions) * 100) + '%',
            answers: studentAnswers,
            startTime: startTime.toLocaleTimeString('vi-VN') + ' ' + startTime.toLocaleDateString('vi-VN'),
            endTime: endTime.toLocaleTimeString('vi-VN') + ' ' + endTime.toLocaleDateString('vi-VN'),
            duration: `${durationMin} phút (${durationSec}s)`
        };

        history.push(resultData);
        localStorage.setItem('sat_results', JSON.stringify(history));

        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'SAT_SUBMIT_RESULT', data: resultData }, '*');
        }
    }

    function resetQuiz() {
        if (!confirm('Bạn có muốn làm lại từ đầu không?')) return;
        
        currentScore = 0;
        answeredCount = 0;
        startTime = new Date();
        
        localStorage.removeItem(QUIZ_STORAGE_KEY);
        
        quizData.forEach(data => {
            const block = document.getElementById(`question-${data.id}`);
            if (block) {
                block.dataset.locked = "false";
                block.querySelectorAll('.eliminate-option').forEach(button => {
                    button.setAttribute('aria-pressed', 'false');
                    button.closest('li').classList.remove('is-eliminated');
                });
                
                const radios = document.querySelectorAll(`input[name="question${data.id}"]`);
                radios.forEach(radio => {
                    radio.disabled = false;
                    radio.checked = false;
                });
                if (data.options) {
                    for (const key of Object.keys(data.options)) {
                        const lbl = document.getElementById(`label-${data.id}-${key}`);
                        if (lbl) {
                            lbl.classList.remove('correct-answer-label', 'wrong-answer-label');
                        }
                    }
                }

                const explanationEl = document.getElementById(`explanation-${data.id}`);
                if (explanationEl) explanationEl.style.display = 'none';

                const navBtn = document.getElementById(`nav_btn_${data.id}`);
                if (navBtn) {
                    navBtn.style.background = '#f8f9fa';
                    navBtn.style.color = '#2c3e50';
                    navBtn.style.borderColor = '#bdc3c7';
                }
            }
        });
        updateScoreBoard();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateScoreBoard() {
        const progressEl = document.getElementById('progressText');
        const scoreEl = document.getElementById('scoreText');
        if (progressEl) progressEl.innerText = `${answeredCount}/${totalQuestions}`;
        if (scoreEl) scoreEl.innerText = currentScore;
    }

    document.getElementById('checkBtn').addEventListener('click', checkCurrentAnswers);
    document.getElementById('resetBtn').addEventListener('click', resetQuiz);

    buildQuiz();
    checkAndRestoreProgress();
</script>
    <script src="quiz-pager.js" defer></script>
</body>
</html>
