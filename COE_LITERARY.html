const quizElement = document.getElementById("quiz");
const navGrid = document.getElementById("navGrid");
const selectedAnswers = new Map();
const studentId = sessionStorage.getItem("studentId") || sessionStorage.getItem("studentName") || "guest";
const storageKey = `quiz_draft_${studentId}_${document.title}`;
const totalQuestions = quizData.length;
const startTime = new Date();
let currentScore = 0;
let answeredCount = 0;

quizData.forEach((question, index) => {
    const block = document.createElement("section");
    block.className = "question-block";
    block.id = `question-${question.id}`;
    block.dataset.locked = "false";
    block.style.scrollMarginTop = "100px";

    const heading = document.createElement("h2");
    heading.textContent = question.group === "Extra" ? `Extra Question ${question.label.slice(1)}` : `Question ${question.id}`;
    const prompt = document.createElement("div");
    prompt.className = "question-text";
    const extraLabel = question.group === "Extra" ? `[Extra Question ${question.label.slice(1)}] ` : "";
    prompt.textContent = `Câu ${question.id}: ${extraLabel}${question.question}`;
    const options = document.createElement("ul");
    options.className = "options";
    const navButton = document.createElement("button");
    navButton.type = "button";
    navButton.id = `nav_btn_${question.id}`;
    navButton.className = "nav-grid-btn";
    navButton.textContent = question.label || String(question.id);
    navButton.setAttribute("aria-label", heading.textContent);
    navButton.addEventListener("click", () => block.scrollIntoView({ behavior: "smooth" }));
    navGrid.append(navButton);

    Object.entries(question.options).forEach(([key, value]) => {
        const item = document.createElement("li");
        const label = document.createElement("label");
        label.htmlFor = `q${question.id}-${key}`;
        label.id = `label-${question.id}-${key}`;
        const letter = document.createElement("strong");
        letter.className = "answer-letter";
        letter.textContent = `${key}.`;
        letter.setAttribute("aria-hidden", "true");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `question${question.id}`;
        input.id = `q${question.id}-${key}`;
        input.value = key;
        input.setAttribute("aria-label", `${key}. ${value}`);
        input.addEventListener("change", () => {
            selectedAnswers.set(question.id, key);
            navButton.classList.add("answered");
            saveProgress();
        });
        const text = document.createElement("span");
        text.textContent = value;
        label.append(input, text);
        item.append(letter, label);
        options.append(item);
    });

    const explanation = document.createElement("div");
    explanation.className = "explanation";
    explanation.id = `explanation-${question.id}`;
    block.append(prompt, options, explanation);
    quizElement.append(block);
});

localStorage.setItem(`${storageKey}_total`, String(totalQuestions));

function saveProgress() {
    const answers = {};
    quizData.forEach(question => {
        const selected = document.querySelector(`input[name="question${question.id}"]:checked`);
        if (selected) answers[question.id] = selected.value;
    });
    localStorage.setItem(storageKey, JSON.stringify(answers));
    updateProgress();
}

function updateProgress() {
    document.getElementById("progressText").textContent = `${selectedAnswers.size}/${totalQuestions}`;
}
updateProgress();

const savedDraft = localStorage.getItem(storageKey);
if (savedDraft) {
    const answers = JSON.parse(savedDraft);
    const answerCount = Object.keys(answers).length;
    if (answerCount && window.confirm(`Em đang làm dở ${answerCount}/${totalQuestions} câu. Bấm OK để làm tiếp, hoặc Cancel để làm lại.`)) {
        Object.entries(answers).forEach(([questionId, answer]) => {
            const input = document.querySelector(`input[name="question${questionId}"][value="${answer}"]`);
            if (!input) return;
            input.checked = true;
            selectedAnswers.set(Number(questionId), answer);
            document.getElementById(`nav_btn_${questionId}`)?.classList.add("answered");
        });
        updateProgress();
    } else {
        localStorage.removeItem(storageKey);
    }
}

function saveResult() {
    const endTime = new Date();
    const durationSeconds = Math.max(0, Math.round((endTime - startTime) / 1000));
    const answers = {};
    quizData.forEach(question => {
        const selected = selectedAnswers.get(question.id);
        const label = question.group === "Extra" ? `Extra ${question.label.slice(1)}` : `Câu ${question.id}`;
        answers[label] = selected || "Bỏ trống";
    });
    const history = JSON.parse(localStorage.getItem("sat_results") || "[]");
    const result = {
        id: Date.now(),
        studentName: studentId,
        quizTitle: document.title,
        attempt: history.filter(item => item.studentName === studentId && item.quizTitle === document.title).length + 1,
        score: `${currentScore}/${totalQuestions}`,
        percentage: `${Math.round((currentScore / totalQuestions) * 100)}%`,
        answers,
        startTime: startTime.toLocaleTimeString("vi-VN") + " " + startTime.toLocaleDateString("vi-VN"),
        endTime: endTime.toLocaleTimeString("vi-VN") + " " + endTime.toLocaleDateString("vi-VN"),
        duration: `${(durationSeconds / 60).toFixed(1)} phút (${durationSeconds}s)`
    };
    history.push(result);
    localStorage.setItem("sat_results", JSON.stringify(history));
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "SAT_SUBMIT_RESULT", data: result }, "*");
    }
}

document.getElementById("checkBtn").addEventListener("click", () => {
    let checkedAny = false;
    quizData.forEach(question => {
        const block = document.getElementById(`question-${question.id}`);
        if (block.dataset.locked === "true") return;
        const chosen = selectedAnswers.get(question.id);
        if (!chosen) return;
        checkedAny = true;
        answeredCount++;
        const explanation = document.getElementById(`explanation-${question.id}`);
        explanation.style.display = "block";
        explanation.textContent = `Correct answer: ${question.correctAnswer}.`;
        document.querySelectorAll(`input[name="question${question.id}"]`).forEach(input => {
            const label = input.closest("label");
            if (input.value === question.correctAnswer) label.classList.add("correct-answer-label");
            if (input.checked && input.value !== question.correctAnswer) label.classList.add("wrong-answer-label");
            input.disabled = true;
        });
        if (chosen === question.correctAnswer) currentScore++;
        block.dataset.locked = "true";
    });
    if (!checkedAny) {
        window.alert("Bạn chưa chọn đáp án nào để kiểm tra!");
        return;
    }
    document.getElementById("scoreText").textContent = String(currentScore);
    saveProgress();
    saveResult();
    if (answeredCount === totalQuestions) localStorage.removeItem(storageKey);
});

document.getElementById("resetBtn").addEventListener("click", () => {
    if (!window.confirm("Bạn có muốn làm lại từ đầu không?")) return;
    selectedAnswers.clear();
    currentScore = 0;
    answeredCount = 0;
    localStorage.removeItem(storageKey);
    document.querySelectorAll("#quiz input[type=radio]").forEach(input => {
        input.checked = false;
        input.disabled = false;
        input.closest("label").classList.remove("correct-answer-label", "wrong-answer-label");
    });
    document.querySelectorAll(".explanation").forEach(element => {
        element.style.display = "none";
        element.textContent = "";
    });
    document.querySelectorAll(".question-block").forEach(block => { block.dataset.locked = "false"; });
    document.querySelectorAll(".nav-grid button").forEach(button => button.classList.remove("answered"));
    document.getElementById("scoreText").textContent = "0";
    updateProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
<script src="quiz-pager.js" defer></script>
