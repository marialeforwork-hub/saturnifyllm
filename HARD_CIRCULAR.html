<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIRCULAR - HARD</title>
    
    <!-- Tích hợp MathJax để hiển thị công thức toán học -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; margin: 0; padding-bottom: 100px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }

        .question-text { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .options { list-style-type: none; padding: 0; }
        .options li { margin-bottom: 10px; }
        .options label { display: block; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        .options label:hover { background: #eef2f5; }
        .options input[type="radio"] { margin-right: 10px; cursor: pointer; }
        .correct-answer-label { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; font-weight: bold; }
        .wrong-answer-label { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        
        .fill-input {
            width: 100%;
            max-width: 320px;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }
        .correct-input {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }
        .wrong-input {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .answer-feedback {
            margin-top: 8px;
            font-weight: bold;
            font-size: 0.95em;
        }

        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            padding: 15px 20px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
            border-top: 3px solid #3498db;
            transition: transform 0.3s ease;
        }
        .stats {
            font-size: 1.1em;
            color: #2c3e50;
        }
        .stats span { font-weight: bold; color: #e74c3c; font-size: 1.2em; margin-left: 5px; }
        .stats b { color: #2980b9; margin-left: 5px; font-size: 1.1em; }
        
        .global-check-btn {
            padding: 12px 30px;
            font-size: 1.1em;
            background-color: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.3);
        }
        .global-check-btn:hover { background-color: #27ae60; transform: translateY(-1px); }
        
        .reset-btn {
            padding: 12px 20px;
            font-size: 1.1em;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.3);
        }
        .reset-btn:hover { background-color: #c0392b; transform: translateY(-1px); }

        /* Nút Sidebar và Nav Box Styles */
        .toggle-sidebar-btn {
            position: fixed; top: 20px; right: 20px; z-index: 10001;
            background: #3498db; color: white; border: none; border-radius: 50%;
            width: 45px; height: 45px; cursor: pointer; font-size: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.2s;
        }
        .toggle-sidebar-btn:hover { transform: scale(1.05); }

        #quizNavBox {
            position: fixed; top: 75px; right: 20px; width: 220px; max-height: 75vh;
            background: white; border: 2px solid #3498db; border-radius: 15px; padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 9999; overflow-y: auto;
            display: none; /* Mặc định ẩn */
        }

        .toggle-nav-btn {
            position: fixed; bottom: 85px; right: 20px; z-index: 1001;
            background: #e67e22; color: #fff; border: none; padding: 10px 18px;
            border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 0.95em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: bottom 0.3s ease;
        }

        @media (max-width: 600px) {
            .sticky-footer { flex-direction: column; gap: 10px; padding: 10px; }
            .global-check-btn { width: 100%; }
        }
    </style>
</head>
<body>

<!-- Nút Toggle Sidebar danh sách câu hỏi -->
<button class="toggle-sidebar-btn" id="toggleSidebarBtn">📌</button>

<!-- Khối danh sách câu hỏi -->
<div id="quizNavBox">
    <h3 style="text-align: center; margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 10px;">📌 Danh Sách Câu Hỏi</h3>
    <div id="navGrid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;">
        <!-- Danh sách nút sẽ được JS chèn tự động vào đây -->
    </div>
</div>

<div class="container">
    <h1>CIRCULAR - HARD</h1>
    <p style="text-align: center; color: #7f8c8d;">Chọn đáp án hoặc nhập kết quả, sau đó bấm <strong>"Kiểm tra"</strong> để xem đáp án.</p>
    <div id="quiz"></div>
</div>

<!-- Nút Toggle ẩn hiện Footer -->
<button class="toggle-nav-btn" id="toggleNavBtn">
    <span id="toggleIcon">👁️</span> <span id="toggleText">Ẩn thanh công cụ</span>
</button>

<!-- Sticky Footer Công Cụ -->
<div class="sticky-footer" id="stickyFooter">
    <div class="stats">
        Tiến độ:<b id="progressText">0/0</b> &nbsp;&nbsp;|&nbsp;&nbsp; 
        Điểm số:<span id="scoreText">0</span>
    </div>
    <div style="display: flex; gap: 10px;">
        <button class="reset-btn" id="resetBtn">🔄 Làm lại từ đầu</button>
        <button class="global-check-btn" id="checkBtn">✅ Kiểm tra các câu đã chọn</button>
    </div>
</div>

<script type="module">

    const firebaseConfig = {
        apiKey: "AIzaSyBWAaxOqQHJQTFjp2hxkWwDCSvagb6KvSg",

    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let startTime = new Date();
    async function saveScoreToFirebase(score, total) {
        const studentName = sessionStorage.getItem('studentName') || "Học sinh ẩn danh";
        const studentId = sessionStorage.getItem('studentId') || "N/A";
        const quizName = document.title;
        const endTime = new Date();

        let detailedAnswers = {};
        quizData.forEach((data, index) => {
            let userChoice = "Bỏ trống";
            const expected = data.answer || data.correctAnswer || '';

            if (data.options && Object.keys(data.options).length > 0) {
                const selectedOption = document.querySelector(`input[name="question${data.id}"]:checked`);
                if (selectedOption) userChoice = selectedOption.value;
            } else {
                const inputEl = document.getElementById(`input-${data.id}`);
                if (inputEl && inputEl.value.trim() !== '') userChoice = inputEl.value.trim();
            }

            const isCorrect = userChoice.toString().trim().toLowerCase() === expected.toString().trim().toLowerCase();

            detailedAnswers[`Câu ${index + 1}`] = {
                questionText: data.text || data.question,
                userChoice: userChoice,
                correctAnswer: expected,
                isCorrect: isCorrect
            };
        });

        const durationSec = Math.max(0, Math.round((endTime - startTime) / 1000));
        const durationText = `${Math.floor(durationSec / 60)} phút ${durationSec % 60} giây`;

        try {
            await addDoc(collection(db, "results"), {
                name: studentName,
                id: studentId,
                quizTitle: quizName,
                score: score,
                total: total,
                percentage: Math.round((score / total) * 100) + '%',
                startTime: startTime.toLocaleTimeString('vi-VN') + ' ' + startTime.toLocaleDateString('vi-VN'),
                endTime: endTime.toLocaleTimeString('vi-VN') + ' ' + endTime.toLocaleDateString('vi-VN'),
                duration: durationText,
                answers: detailedAnswers,
                timestamp: new Date()
            });
            console.log("Đã lưu chi tiết bài làm lên Firebase!");
        } catch (error) {
            console.error("Lỗi khi lưu điểm lên Firebase: ", error);
        }
    }
  const quizData =[
  {
    "id": 1,
    "text": "In the xy-plane, the graph of the given equation is a circle. If this circle is inscribed in a square, what is the perimeter of the square?\n\n$x^{2}-16x+y^{2}-10y-55=0$\n\nA. 24\nB. 48\nC. 96\nD. 220",
    "type": "multiple_choice",
    "answer": "C"
  },
  {
    "id": 2,
    "text": "In the xy-plane, the graph of the given equation is a circle. If this circle is inscribed in a square, what is the perimeter of the square?\n\n$x^{2}-6x+y^{2}-12y-36=0$\n\nA. 18\nB. 36\nC. 72\nD. 144",
    "type": "multiple_choice",
    "answer": "C"
  },
  {
    "id": 3,
    "text": "A circle in the xy-plane has its center at $(-4,2)$ and the point $(-8,5)$ lies on the circle. Which equation represents this circle?\n\nA. $(x-4)^{2}+(y+2)^{2}=5$\nB. $(x+4)^{2}+(y-2)^{2}=25$\nC. $(x+4)^{2}+(y-2)^{2}=5$\nD. $(x-4)^{2}+(y+2)^{2}=25$",
    "type": "multiple_choice",
    "answer": "B"
  },
  {
    "id": 4,
    "text": "The given equation represents circle P in the xy-plane. Circle Q has a center that is 1 unit to the right of and 2 units below the center of circle P. Circle Q has a diameter that is double the diameter of circle P. Which equation represents circle Q?\n\n$(x-3)^{2}+(y+7)^{2}=25$\n\nA. $(x-2)^{2}+(y+5)^{2}=50$\nB. $(x-4)^{2}+(y+9)^{2}=50$\nC. $(x-2)^{2}+(y+5)^{2}=100$\nD. $(x-4)^{2}+(y+9)^{2}=100$",
    "type": "multiple_choice",
    "answer": "D"
  },
  {
    "id": 5,
    "text": "The graph of the given equation is a circle in the xy-plane. The point $(a,b)$ lies on the circle. Which of the following is a possible value for a?\n\n$(x+3)^{2}+(y-19)^{2}=144$\n\nA. -16\nB. -13\nC. 12\nD. 19",
    "type": "multiple_choice",
    "answer": "B"
  },
  {
    "id": 6,
    "text": "The graph of the given equation is a circle in the xy-plane. The point $(a,b)$ lies on the circle. Which of the following is a possible value for a?\n\n$(x+3)^{2}+(y-18)^{2}=169$\n\nA. -17\nB. -12\nC. 13\nD. 18",
    "type": "multiple_choice",
    "answer": "B"
  },
  {
    "id": 7,
    "text": "The given equation represents circle P in the xy-plane. Circle Q has a center that is 3 units to the right of and 2 units below the center of circle P. Circle Q has a diameter that is double the diameter of circle P. Which equation represents circle Q?\n\n$(x-5)^{2}+(y+3)^{2}=36$\n\nA. $(x-8)^{2}+(y+5)^{2}=144$\nB. $(x-2)^{2}+(y+1)^{2}=144$\nC. $(x-8)^{2}+(y+5)^{2}=72$\nD. $(x-2)^{2}+(y+1)^{2}=72$",
    "type": "multiple_choice",
    "answer": "A"
  },
  {
    "id": 8,
    "text": "Circle F in the xy-plane is represented by the equation $(x-13)^{2}+(y-9)^{2}=196$. Circle G is obtained by shifting circle F 5 units to the left and 11 units up. An equation representing circle G is $(x+h)^{2}+(y+k)^{2}=196$, where h and k are constants. What is the value of $h+k$?",
    "type": "free_response",
    "answer": "-28"
  },
  {

    "text": "In the xy-plane, the graph of the given equation is a circle. If this circle is inscribed in a square, what is the perimeter of the square?\n\n$x^{2}-4x+y^{2}-8y-80=0$\n\nA. 20\nB. 40\nC. 80\nD. 320",
    "type": "multiple_choice",
    "answer": "C"
  },
  {
    "id": 10,
    "text": "A circle in the xy-plane has its center at $(-7,3)$ and has a radius of 9. An equation of this circle is $x^{2}+y^{2}+ax+by+c=0$, where a, b, and c are constants. What is the value of c?",
    "type": "free_response",
    "answer": "-23"
  },
  {
    "id": 11,
    "text": "A circle in the xy-plane has a diameter with endpoints $(a,11)$ and $(a,d)$, where a and d are constants. An equation of this circle is $(x-a)^{2}+(y-17)^{2}=r^{2}$, where r is a positive constant. What is the value of d?\n\nA. 5\nB. 12\nC. 20\nD. 23",
    "type": "multiple_choice",
    "answer": "D"
  },
  {
    "id": 12,
    "text": "In the xy-plane, the graph of the given equation is a circle. Which point lies on this circle?\n\n$(x+3)^{2}+(y-4)^{2}=25$\n\nA. $(-3,4)$\nB. $(3,-4)$\nC. $(\\sqrt{11}+3,\\sqrt{14}-4)$\nD. $(\\sqrt{11}-3,\\sqrt{14}+4)$",
    "type": "multiple_choice",
    "answer": "D"
  },
  {
    "id": 13,
    "text": "The graph of the given equation is a circle in the xy-plane. The point $(a,b)$ lies on the circle. Which of the following is a possible value for a?\n\n$(x+3)^{2}+(y-18)^{2}=169$\n\nA. -17\nB. -11\nC. 11\nD. 18",
    "type": "multiple_choice",
    "answer": "B"
  }
]; 
   quizData.forEach(data => {
        // Tự động bóc tách các lựa chọn A, B, C, D từ text đưa vào options
        if (data.type === 'multiple_choice' && !data.options) {
            data.options = {};
            let lines = data.text.split('\n');
            let qText = [];
            lines.forEach(line => {
                let match = line.match(/^([A-D])\.\s+(.*)/);
                if (match) {
                    data.options[match[1]] = match[2];
                } else {
                    if (line.trim() !== '') qText.push(line);
                }
            });
            // Thêm các thẻ xuống dòng HTML chuẩn
            data.text = qText.join('<br/><br/>');
        } else if (data.text) {
            // Fix lỗi xuống dòng cho các câu Fill in the blank
            data.text = data.text.replace(/\n/g, '<br/>');
        }
    });

    const quizContainer = document.getElementById('quiz');
    let currentScore = 0;
    let answeredCount = 0;
    const totalQuestions = quizData.length;

    const STUDENT_ID = sessionStorage.getItem('studentId') || sessionStorage.getItem('studentName') || 'guest';
    const QUIZ_STORAGE_KEY = `quiz_draft_${STUDENT_ID}_${document.title}`;

    function renderMath() {
        if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise();
        }
    }

    function buildQuiz() {
        quizContainer.innerHTML = '';
        createNavigatorBox(); // Chèn các nút vào khối Nav đã tạo trong HTML

        quizData.forEach((data, index) => {
            const questionBlock = document.createElement('div');
            questionBlock.classList.add('question-block');
            questionBlock.id = `question-${data.id}`;
            questionBlock.dataset.locked = "false";
            questionBlock.style.scrollMarginTop = "100px"; // Đảm bảo cuộn tới không bị khuất

            let contentHtml = '';

            // Nếu câu trắc nghiệm (đã được bóc tách ở tiền xử lý)
            if (data.options && Object.keys(data.options).length > 0) {
                let optionsHtml = '';
                for (const [key, value] of Object.entries(data.options)) {
                    optionsHtml += `
                        <li>
                            <label id="label-${data.id}-${key}">
                                <input type="radio" name="question${data.id}" value="${key}">
                                <strong>${key}.</strong> ${value}
                            </label>
                        </li>
                    `;
                }
                contentHtml = `<ul class="options">${optionsHtml}</ul>`;
            } else {
                contentHtml = `
                    <div style="margin-top: 10px;">
                        <input type="text" class="fill-input" id="input-${data.id}" name="question${data.id}" placeholder="Nhập đáp án của bạn...">
                        <div id="feedback-${data.id}" class="answer-feedback"></div>
                    </div>
                `;
            }

            questionBlock.innerHTML = `
                <div class="question-text">Câu ${index + 1}: ${data.text}</div>
                ${contentHtml}
            `;
            quizContainer.appendChild(questionBlock);
        });
        
        quizContainer.addEventListener('change', () => { saveProgress(); updateNavigatorState(); });
        quizContainer.addEventListener('input', () => { saveProgress(); updateNavigatorState(); });
        
        const progressEl = document.getElementById('progressText');
        if (progressEl) progressEl.innerText = `0/${totalQuestions}`;

        renderMath();
    }

    // Gắn trực tiếp các nút vào khối Div đã có sẵn bên ngoài thay vì tự tạo box nổi
    function createNavigatorBox() {
        const grid = document.getElementById('navGrid');
        if(!grid) return;
        grid.innerHTML = ''; // Làm sạch trước khi load

        quizData.forEach((data, index) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.id = `nav_btn_${data.id}`;
            btn.innerText = index + 1;
            btn.style.cssText = `
                width: 100%; height: 35px; border: 1px solid #bdc3c7; background: #f8f9fa;
                color: #2c3e50; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9em;
                transition: background 0.2s;
            `;

            btn.onclick = () => {
                const targetBlock = document.getElementById(`question-${data.id}`);
                if (targetBlock) targetBlock.scrollIntoView({ behavior: 'smooth' });
            };
            grid.appendChild(btn);
        });
    }

    // ==========================================
    // LOGIC CHO 2 NÚT ẨN HIỆN GIAO DIỆN MỚI
    // ==========================================
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const quizNavBox = document.getElementById('quizNavBox');
    
    toggleSidebarBtn.addEventListener('click', () => {
        if (quizNavBox.style.display === 'none' || quizNavBox.style.display === '') {
            quizNavBox.style.display = 'block';
        } else {
            quizNavBox.style.display = 'none';
        }
    });

    const toggleNavBtn = document.getElementById('toggleNavBtn');
    const stickyFooter = document.getElementById('stickyFooter');
    const toggleIcon = document.getElementById('toggleIcon');
    const toggleText = document.getElementById('toggleText');

    toggleNavBtn.addEventListener('click', () => {
        if (stickyFooter.style.display === 'none') {
            stickyFooter.style.display = 'flex';
            toggleIcon.innerText = '👁️';
            toggleText.innerText = 'Ẩn thanh công cụ';
            toggleNavBtn.style.bottom = '85px'; // Đẩy nút lên trên footer
        } else {
            stickyFooter.style.display = 'none';
            toggleIcon.innerText = '👀';
            toggleText.innerText = 'Hiện thanh công cụ';
            toggleNavBtn.style.bottom = '20px'; // Hạ nút xuống dưới cùng khi ẩn footer
        }
    });


    // (Giữ nguyên các hàm checkAndRestoreProgress, checkCurrentAnswers, updateNavigatorState, v.v.. của bạn bên dưới)
    function updateNavigatorState() {
        quizData.forEach((data) => {
            let hasAnswered = false;
            if (data.options && Object.keys(data.options).length > 0) {
                const selected = document.querySelector(`input[name="question${data.id}"]:checked`);
                if (selected) hasAnswered = true;
            } else {
                const inputEl = document.getElementById(`input-${data.id}`);
                if (inputEl && inputEl.value.trim() !== '') hasAnswered = true;
            }

            const btn = document.getElementById(`nav_btn_${data.id}`);
            if (btn) {
                if (hasAnswered) {
                    btn.style.background = '#2ecc71'; btn.style.color = '#ffffff'; btn.style.borderColor = '#27ae60';
                } else if (document.getElementById(`question-${data.id}`).dataset.locked !== "true") {
                    btn.style.background = '#f8f9fa'; btn.style.color = '#2c3e50'; btn.style.borderColor = '#bdc3c7';
                }
            }
        });
    }

    function saveProgress() {
        let userAnswers = {};
        quizData.forEach(data => {
            if (data.options && Object.keys(data.options).length > 0) {
                const selectedOption = document.querySelector(`input[name="question${data.id}"]:checked`);
                if (selectedOption) userAnswers[data.id] = selectedOption.value;
            } else {
                const inputEl = document.getElementById(`input-${data.id}`);
                if (inputEl && inputEl.value.trim() !== '') userAnswers[data.id] = inputEl.value.trim();
            }
        });
        localStorage.setItem(QUIZ_STORAGE_KEY, JSON.stringify(userAnswers));
    }
function checkAndRestoreProgress() {
        const savedDraft = localStorage.getItem(QUIZ_STORAGE_KEY);
        if (!savedDraft) return;

        const userAnswers = JSON.parse(savedDraft);
        const count = Object.keys(userAnswers).length;

        if (count > 0) {
            const confirmResume = confirm(
                `Em đang làm dở ${count}/${totalQuestions} câu ở lần trước.\n\n` +
                `• Bấm [OK] để LÀM TIẾP bài đang dở.\n` +
                `• Bấm [Hủy (Cancel)] để LÀM LẠI TỪ ĐẦU.`
            );

            if (confirmResume) {
                let lastAnsweredId = null;
                Object.entries(userAnswers).forEach(([qId, value]) => {
                    const data = quizData.find(q => q.id == qId);
                    if (data) {
                        if (data.options && Object.keys(data.options).length > 0) {
                            const radio = document.querySelector(`input[name="question${qId}"][value="${value}"]`);
                            if (radio) radio.checked = true;
                        } else {
                            const inputEl = document.getElementById(`input-${qId}`);
                            if (inputEl) inputEl.value = value;
                        }
                        lastAnsweredId = qId;
                    }
                });

                updateNavigatorState();

                if (lastAnsweredId) {
                    const targetBlock = document.getElementById(`question-${lastAnsweredId}`);
                    if (targetBlock) {
                        targetBlock.scrollIntoView({ behavior: 'smooth' });
                    }
                }
            } else {
                startTime = new Date();
                localStorage.removeItem(QUIZ_STORAGE_KEY);
            }
        }
    }

    function checkCurrentAnswers() {
        let checkedAny = false;

        quizData.forEach(data => {
            const block = document.getElementById(`question-${data.id}`);
            if (block.dataset.locked === "true") return;

            const correctAnswer = (data.answer || data.correctAnswer || '').toString().trim().toLowerCase();

            if (data.options && Object.keys(data.options).length > 0) {
                const selectedOption = document.querySelector(`input[name="question${data.id}"]:checked`);
                if (selectedOption) {
                    checkedAny = true;
                    const userAnswer = selectedOption.value.trim().toLowerCase();
                    
                    if (userAnswer === correctAnswer) {
                        document.getElementById(`label-${data.id}-${selectedOption.value}`).classList.add('correct-answer-label');
                        currentScore++;
                    } else {
                        document.getElementById(`label-${data.id}-${selectedOption.value}`).classList.add('wrong-answer-label');
                        const correctKey = (data.answer || data.correctAnswer);
                        if (document.getElementById(`label-${data.id}-${correctKey}`)) {
                            document.getElementById(`label-${data.id}-${correctKey}`).classList.add('correct-answer-label');
                        }
                    }

                    const radios = document.querySelectorAll(`input[name="question${data.id}"]`);
                    radios.forEach(radio => radio.disabled = true);
                    block.dataset.locked = "true";
                    answeredCount++;
                }
            } else {
                const inputEl = document.getElementById(`input-${data.id}`);
                if (inputEl && inputEl.value.trim() !== '') {
                    checkedAny = true;
                    const userAnswer = inputEl.value.trim().toLowerCase();
                    const feedbackEl = document.getElementById(`feedback-${data.id}`);

                    if (userAnswer === correctAnswer) {
                        inputEl.classList.add('correct-input');
                        if (feedbackEl) feedbackEl.innerHTML = `<span style="color: #27ae60;">Chính xác!</span>`;
                        currentScore++;
                    } else {
                        inputEl.classList.add('wrong-input');
                        if (feedbackEl) feedbackEl.innerHTML = `<span style="color: #c0392b;">Sai rồi. Đáp án đúng: <strong>${data.answer || data.correctAnswer}</strong></span>`;
                    }

                    inputEl.disabled = true;
                    block.dataset.locked = "true";
                    answeredCount++;
                }
            }
        });

        if (!checkedAny) {
            alert('Bạn chưa chọn hoặc nhập đáp án nào để kiểm tra!');
        } else {
            updateScoreBoard();
            saveAdminResultData();

            if (typeof saveScoreToFirebase === 'function') {
                saveScoreToFirebase(currentScore, answeredCount);
            }

            if (answeredCount === totalQuestions) {
                alert(`Chúc mừng! Bạn đã hoàn thành toàn bộ ${totalQuestions} câu hỏi. Tổng điểm: ${currentScore}/${totalQuestions}.`);
                localStorage.removeItem(QUIZ_STORAGE_KEY);
            }
        }
    }

    function saveAdminResultData() {
        const endTime = new Date();
        const durationSec = Math.max(0, Math.round((endTime - startTime) / 1000));
        const durationMin = (durationSec / 60).toFixed(1);

        const quizTitle = document.title || 'Bài tập SAT';
        let studentAnswers = {};

        quizData.forEach((data, index) => {
            let val = 'Bỏ trống';
            if (data.options && Object.keys(data.options).length > 0) {
                const selected = document.querySelector(`input[name="question${data.id}"]:checked`);
                if (selected) val = selected.value;
            } else {
                const inputEl = document.getElementById(`input-${data.id}`);
                if (inputEl && inputEl.value.trim() !== '') val = inputEl.value.trim();
            }
            studentAnswers[`Câu ${index + 1}`] = val;
        });

        let history = JSON.parse(localStorage.getItem('sat_results') || '[]');
        const attemptCount = history.filter(h => h.studentName === STUDENT_ID && h.quizTitle === quizTitle).length + 1;

        const resultData = {
            id: Date.now(),
            studentName: STUDENT_ID,
            quizTitle: quizTitle,
            attempt: attemptCount,
            score: `${currentScore}/${totalQuestions}`,
            percentage: Math.round((currentScore / totalQuestions) * 100) + '%',
            answers: studentAnswers,
            startTime: startTime.toLocaleTimeString('vi-VN') + ' ' + startTime.toLocaleDateString('vi-VN'),
            endTime: endTime.toLocaleTimeString('vi-VN') + ' ' + endTime.toLocaleDateString('vi-VN'),
            duration: `${durationMin} phút (${durationSec}s)`
        };

        history.push(resultData);
        localStorage.setItem('sat_results', JSON.stringify(history));

        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'SAT_SUBMIT_RESULT', data: resultData }, '*');
        }
    }

    function resetQuiz() {
        if (!confirm('Bạn có muốn làm lại từ đầu không?')) return;
        
        currentScore = 0;
        answeredCount = 0;
        startTime = new Date();
        
        localStorage.removeItem(QUIZ_STORAGE_KEY);
        
        quizData.forEach(data => {
            const block = document.getElementById(`question-${data.id}`);
            if (block) {
                block.dataset.locked = "false";
                
                if (data.options && Object.keys(data.options).length > 0) {
                    const radios = document.querySelectorAll(`input[name="question${data.id}"]`);
                    radios.forEach(radio => {
                        radio.disabled = false;
                        radio.checked = false;
                    });
                    for (const key of Object.keys(data.options)) {
                        const lbl = document.getElementById(`label-${data.id}-${key}`);
                        if (lbl) {
                            lbl.classList.remove('correct-answer-label', 'wrong-answer-label');
                        }
                    }
                } else {
                    const inputEl = document.getElementById(`input-${data.id}`);
                    if (inputEl) {
                        inputEl.disabled = false;
                        inputEl.value = '';
                        inputEl.classList.remove('correct-input', 'wrong-input');
                    }
                    const feedbackEl = document.getElementById(`feedback-${data.id}`);
                    if (feedbackEl) feedbackEl.innerHTML = '';
                }

                const navBtn = document.getElementById(`nav_btn_${data.id}`);
                if (navBtn) {
                    navBtn.style.background = '#f8f9fa';
                    navBtn.style.color = '#2c3e50';
                    navBtn.style.borderColor = '#bdc3c7';
                }
            }
        });
        updateScoreBoard();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateScoreBoard() {
        const progressEl = document.getElementById('progressText');
        const scoreEl = document.getElementById('scoreText');
        if (progressEl) progressEl.innerText = `${answeredCount}/${totalQuestions}`;
        if (scoreEl) scoreEl.innerText = currentScore;
    }

    document.getElementById('checkBtn').addEventListener('click', checkCurrentAnswers);
    document.getElementById('resetBtn').addEventListener('click', resetQuiz);

    buildQuiz();
    checkAndRestoreProgress();
</script>
    <script>
    (function() {
        // Tự động lấy tên bài học từ thẻ <title> của file btap
        const QUIZ_KEY = document.title.trim() || "August SAT Math"; 
        const studentId = sessionStorage.getItem('studentId') || 'GUEST';

        function saveProgressAndNotify() {
            const answers = {};
            
            // Lấy các câu trắc nghiệm đã chọn
            document.querySelectorAll('input[type="radio"]:checked').forEach(radio => {
                answers[radio.name] = radio.value;
            });

            // Lấy các câu điền ô trống
            document.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
                if (input.value.trim() !== '' && input.name) {
                    answers[input.name] = input.value.trim();
                }
            });

            // Đếm tổng số câu trong bài
            let totalQuestions = document.querySelectorAll('.question-block, .question').length;
            if (totalQuestions === 0) {
                const radioNames = new Set([...document.querySelectorAll('input[type="radio"]')].map(i => i.name));
                totalQuestions = radioNames.size || 1;
            }

            const storageKey = `quiz_draft_${studentId}_${QUIZ_KEY}`;
            localStorage.setItem(storageKey, JSON.stringify(answers));
            localStorage.setItem(storageKey + '_total', totalQuestions);

            // Báo cho trang chính index.html cập nhật ngay lập tức
            if (window.parent) {
                window.parent.postMessage({ type: 'SAT_PROGRESS_UPDATE' }, '*');
            }
        }

        function restoreDraftAnswers() {
            const storageKey = `quiz_draft_${studentId}_${QUIZ_KEY}`;
            const saved = localStorage.getItem(storageKey);
            if (!saved) return;

            try {
                const answers = JSON.parse(saved);
                Object.keys(answers).forEach(name => {
                    const val = answers[name];
                    const radio = document.querySelector(`input[type="radio"][name="${name}"][value="${val}"]`);
                    if (radio) radio.checked = true;

                    const textInput = document.querySelector(`input[name="${name}"]`);
                    if (textInput && textInput.type !== 'radio') textInput.value = val;
                });
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            restoreDraftAnswers();
            saveProgressAndNotify();

            document.addEventListener('change', saveProgressAndNotify);
            document.addEventListener('input', saveProgressAndNotify);
        });
    })();
    </script>
